  - id: dislikes-hidden
    date: 2021-11-10
    date_kind: announced
    category: removed-feature
    title: Tubely hides the public dislike count
    what_changed: Tubely hid public dislike counts on 10 November 2021, keeping the button.
    user_impact: Viewers lost a quick way to spot a bad video.
    company_said: It said the counts were being used to pile on creators.
    severity: 2
    status: reversed
    reversed:
      date: 2022-02
      what: The counts came back in a test.
      sources:
        - url: https://news.example/dislikes-back
          publisher: News Example
          kind: press
          published: 2022-02-01
          archive: https://web.archive.org/web/20220201000000/https://news.example/dislikes-back
          quote: Dislikes are back.
    sources:
      - url: https://blog.tubely.example/dislikes
        publisher: Tubely Blog
        kind: primary
        published: 2021-11-10
        archive: https://web.archive.org/web/20211110000000/https://blog.tubely.example/dislikes
        quote: We're making the dislike count private.
      - url: https://news.example/dislikes-extra
        publisher: News Example
        kind: press
        published: 2021-11-11
        archive: pending
        quote: Dislike counts are gone.
    corrections: [{ date: 2026-11-18, what: Fixed the date. }]
    added: 2026-11-18
