changes:
  - id: cloud-shutdown
    date: 2025-10-06
    date_kind: announced
    category: bricked
    title: Neato shuts down its cloud, so its robot vacuums lose app control and schedules
    what_changed: >-
      Neato said on 6 October 2025 that it was phasing out the cloud its robot vacuums rely on, and
      emailed customers that it would be phased out during Q4 2025. When Neato closed in 2023,
      Vorwerk had said it would support existing Neato products for the next 5 years. In November
      2026, under commitments made to Italy's competition authority, Neato offered eligible private
      customers in Europe who bought a D4 to D10 on or after 1 October 2020 a free Vorwerk VR7 for a
      D8, D9 or D10, or a EUR 500 voucher for an older model, in return for the robot, undamaged
      apart from normal wear.
    before: App control, schedules, maps and no-go zones
    after: Manual cleaning, started from the robot's button
    user_impact: >-
      Neato owners lost access to the MyNeato app, and with it remote starts, cleaning schedules,
      maps and no-go zones, while the robots carry on cleaning manually, with a press of the button
      starting a full house run.
    company_said: >-
      Neato said cybersecurity standards, compliance obligations and regulations had advanced since
      2023, so its existing cloud could no longer be maintained in a reliable way.
    severity: 4
    status: in-force
