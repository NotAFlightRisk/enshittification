changes:
  - id: shutdown
    date: 2025-07-08
    date_kind: effective
    category: removed-feature
    title: Mozilla shuts down Pocket
    question: When did Pocket shut down?
    what_changed: >-
      Mozilla shut down Pocket on 8 July 2025, having announced on 22 May 2025 that it would close
      the read-it-later app. Pocket left the app stores and stopped taking sign-ups and new Premium
      subscriptions on the day of the announcement, and after 8 July the website was export-only.
      Mozilla first gave users until 8 October 2025 to export their saves, then moved the deadline,
      and on 12 November 2025 it switched off export and the Pocket API and queued all user data for
      permanent deletion.
    user_impact: >-
      Pocket users had to export their saved articles by 12 November 2025 or lose them, apps built
      on Pocket's API could no longer load people's lists or save, tag or delete articles, Kobo
      eReaders that showed people's Pocket saves lost Pocket on 8 July, and annual Premium
      subscribers got a prorated refund.
    company_said: >-
      Mozilla said the way people use the web had evolved, so it was putting its resources into
      projects that better matched their browsing habits.
    severity: 4
    status: in-force
