  - id: music-shuffle-only
    date: 2022-11-01
    date_kind: announced
    category: removed-feature
    title: Amazon Music for Prime members goes from picking songs to shuffle play
    question: When did Amazon Prime Music go shuffle only?
    what_changed: >-
      Amazon said on 1 November 2022 that Prime members' music would grow from 2m to 100m songs,
      but in shuffle mode. Prime members could still play a selection of All-Access
      playlists on demand, and picking a song needed Amazon Music Unlimited.
    before: 2m songs
