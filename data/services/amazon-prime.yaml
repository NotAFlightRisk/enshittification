    date_kind: announced
    effective: 2018-09-14
    category: removed-feature
    title: Twitch Prime stops including ad-free viewing on Twitch
    what_changed: >-
      Twitch said on 20 August 2018 that Twitch Prime, part of Amazon Prime, would stop including
      ad-free viewing for new members from 14 September 2018. Members on monthly Prime kept it until
      15 October, and annual members until their next renewal.
    user_impact: >-
      Prime members who watched Twitch got ads again, bar one channel a month with their free sub,
      unless they paid for Twitch Turbo.
    company_said: Twitch said advertising is an important source of support for the creators on Twitch.
    severity: 2
    status: in-force
