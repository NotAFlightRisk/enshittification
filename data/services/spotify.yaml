  - id: lyrics-free-limit
    date: 2024-05
    date_kind: reported
    category: paywall
    title: Spotify puts a monthly limit on lyrics for free listeners
    what_changed: >-
      Spotify started limiting free users to lyrics for 3 songs a month in May 2024, after testing
      lyrics as a Premium feature in 2023. Its help page said free users got limited access,
      and unlimited lyrics were only on Premium.
    user_impact: >-
      Free listeners who used up the monthly limit couldn't see lyrics for any more songs that month
      unless they paid for Premium.
    severity: 2
    status: reversed
    reversed:
      date: 2024-07-30
      what: >-
        After complaints, Spotify started raising the free limit on 30 July 2024. By 9 August its help
        page no longer said unlimited lyrics were Premium-only, and said lyrics were available on both
        the free and Premium tiers.
      sources:
        - url: https://techcrunch.com/2024/07/30/spotify-expands-monthly-limit-lyrics-free-users/
          publisher: TechCrunch
          kind: press
          published: 2024-07-30
