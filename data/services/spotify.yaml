changes:
  - id: family-price-2021
    date: 2021-04-26
    date_kind: reported
    effective: 2021-04-30
    category: price-rise
    title: Spotify Premium Family goes from $14.99 to $15.99 in the US
    what_changed: >-
      Spotify's US Premium Family plan went from $14.99 to $15.99 a month from 30 April 2021, with
      existing subscribers paying it after a month's grace. Individual, Duo and Student stayed the
      same in the US, while Student, Duo and Family went up in the UK and Europe.
    before: $14.99 a month
    after: $15.99 a month
    user_impact: US families sharing a plan paid more, while every other US plan kept its price.
    company_said: >-
      Spotify said it updates prices from time to time to reflect local macroeconomic factors and
      market demands.
    severity: 1
    status: in-force
    regions: [US]
    prices:
      - { plan: family-us, from: 14.99, to: 15.99 }
    sources:
      - url: https://www.theverge.com/2021/4/26/22403813/spotify-price-increase-subscriptions-2021
        publisher: The Verge
        kind: press
        published: 2021-04-26
        archive: https://web.archive.org/web/20210426162507/https://www.theverge.com/2021/4/26/22403813/spotify-price-increase-subscriptions-2021
        quote: Spotify family is increasing from $14.99 to $15.99 per month in the US.
    added: 2026-11-18
    updated: 2026-11-19
    sources_checked: 2026-11-18
    status_checked: 2026-11-18

  - id: premium-price-2023
    date: 2023-07-24
    date_kind: announced
    category: price-rise
    title: Spotify Premium Individual goes from $9.99 to $10.99 in the US
    what_changed: >-
      Spotify raised US Premium Individual from $9.99 to $10.99 a month on 24 July 2023, along with
      Duo, Family and Student. Duo went from $12.99 to $14.99, Family from $15.99 to $16.99 and
      Student from $4.99 to $5.99, as prices went up in markets around the world.
    before: $9.99 a month
    after: $10.99 a month
    user_impact: >-
      It ended the $9.99 price that US Individual had kept since Spotify launched there in 2011.
    company_said: >-
      Spotify said it was changing prices so it could keep innovating as the market changed.
    severity: 1
    status: in-force
    regions: [AD, AL, AR, AT, AU, BA, BE, BG, BR, CA, CL, CO, CR, CY, DK, EC, EE, ES, FI, FR, GB,
      GR, GT, HK, HR, ID, IE, IL, IS, IT, LT, LU, LV, MC, ME, MK, MT, MX, NL, "NO", NZ, PE, PT, RS,
      SE, SG, SI, SK, SM, TH, TR, US, XK]
    prices:
