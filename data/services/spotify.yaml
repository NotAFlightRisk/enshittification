  - id: lyrics-premium-test
    date: 2023-09-05
    date_kind: reported
    category: paywall
    title: Spotify tests putting lyrics behind Premium
    what_changed: >-
      Spotify was found testing lyrics as a Premium-only feature on 5 September 2023, with some free
      users seeing a prompt to upgrade instead. Spotify said it was a test with a limited number of
      users.
    user_impact: Free listeners in the test lost the in-app lyrics unless they paid for Premium.
    severity: 2
    status: test
    sources:
      - url: https://www.theverge.com/2023/9/5/23860124/spotify-lyrics-premium-only-feature
        publisher: The Verge
        kind: press
        published: 2023-09-05
        archive: https://web.archive.org/web/20260201202858/https://www.theverge.com/2023/9/5/23860124/spotify-lyrics-premium-only-feature
        quote: >-
          Instead, they saw only a notification bubble saying, “Enjoy lyrics on Spotify Premium,”
          with a link to sign up.
    added: 2026-11-18
    updated: 2026-11-19
    sources_checked: 2026-11-18
    status_checked: 2026-11-18

  - id: premium-price-2024
    date: 2024-06-03
    date_kind: announced
    category: price-rise
    title: Spotify Premium Individual goes from $10.99 to $11.99 in the US
    what_changed: >-
      Spotify raised US Premium Individual from $10.99 to $11.99 a month on 3 June 2024, with Duo
      and Family going up too. Duo went from $14.99 to $16.99 and Family from $16.99 to $19.99,
      while Student stayed at $5.99.
    before: $10.99 a month
    after: $11.99 a month
    user_impact: >-
      Every US Premium subscriber except students paid more, with existing ones told by email over
      the following month.
    company_said: >-
      Spotify said it updates prices now and then so it can keep investing in and improving the
      product.
    severity: 1
    status: in-force
    regions: [US]
    prices:
      - { plan: individual-us, from: 10.99, to: 11.99 }
      - { plan: duo-us, from: 14.99, to: 16.99 }
      - { plan: family-us, from: 16.99, to: 19.99 }
    sources:
