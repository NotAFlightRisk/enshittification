  - id: web-api-endpoints-cut
    date: 2024-11-27
    date_kind: effective
    category: api-restriction
    title: Spotify cuts recommendations and audio features from its API for new apps
    what_changed: >-
      Spotify cut new Web API apps off from its recommendations, related artists, audio features and
      audio analysis endpoints on 27 November 2024. Apps still in development mode lost them too,
      along with featured and category playlists, 30-second previews and Spotify's own editorial and
      algorithmic playlists, while apps that already had extended access kept them.
    user_impact: >-
      Developers starting new apps, or still in development mode, lost Spotify's recommendations and
      audio analysis data.
    company_said: Spotify said the changes were meant to create a more secure platform.
    severity: 1
    status: in-force
    sources:
      - url: https://developer.spotify.com/blog/2024-11-27-changes-to-the-web-api
        publisher: Spotify for Developers
        kind: primary
        published: 2024-11-27
        archive: https://web.archive.org/web/20261113085112/https://developer.spotify.com/blog/2024-11-27-changes-to-the-web-api
        quote: >-
          Effective today, new Web API use cases will no longer be able to access or use the
          following endpoints and functionality in their third-party applications.
    added: 2026-11-18
    updated: 2026-11-19
    sources_checked: 2026-11-18
    status_checked: 2026-11-18

  - id: car-thing-bricked
    date: 2024-12-09
    date_kind: effective
    category: bricked
    title: Spotify switches off Car Thing, its $90 in-car player
    question: When did Spotify Car Thing stop working?
    what_changed: >-
      Spotify ended Car Thing on 9 December 2024, after which its $90 in-car player no longer
      worked. Owners were told in May 2024, with no automatic refund or credit, and Spotify later
      asked them to contact customer service by 14 January 2025 about refund options.
    user_impact: Every Car Thing stopped working, and Spotify didn't open-source the software.
    company_said: Spotify said it was discontinuing Car Thing to streamline its product offerings.
    severity: 5
    status: in-force
    sources:
      - url: https://support.spotify.com/us/article/car-thing-discontinued/
        publisher: Spotify Support
        kind: primary
        published: 2025-08-28
        archive: https://web.archive.org/web/20250828003549/https://support.spotify.com/us/article/car-thing-discontinued/
        quote: >-
          After December 9th, 2024, Car Thing will be discontinued and will no longer be
          operational.
      - url: https://www.theverge.com/2024/5/23/24163383/spotify-car-thing-discontinued-december-2024
        publisher: The Verge
        kind: press
        published: 2024-05-23
        archive: https://web.archive.org/web/20260810095411/https://www.theverge.com/2024/5/23/24163383/spotify-car-thing-discontinued-december-2024
        quote: >-
          Customers who bought the Car Thing are receiving emails warning that it will stop working
          altogether as of December 9th.
    added: 2026-11-18
    updated: 2026-11-19
    sources_checked: 2026-11-18
    status_checked: 2026-11-18

  - id: premium-price-2026
    date: 2026-01-15
    date_kind: announced
    category: price-rise
    title: Spotify Premium Individual goes from $11.99 to $12.99 in the US
    what_changed: >-
      Spotify raised US Premium Individual from $11.99 to $12.99 a month on 15 January 2026, and
      every other US plan with it. Duo went from $16.99 to $18.99, Family from $19.99 to $21.99 and
      Student from $5.99 to $6.99, with subscribers in the US, Estonia and Latvia emailed over the
      following month.
    before: $11.99 a month
    after: $12.99 a month
    user_impact: US Individual now costs $12.99, up from $9.99 before July 2023.
    company_said: >-
      Spotify said occasional price updates reflect the value it delivers and let it keep offering
      the best experience and benefit artists.
    severity: 1
    status: in-force
    regions: [US, EE, LV]
    prices:
