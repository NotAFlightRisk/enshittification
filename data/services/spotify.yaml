  - id: developer-mode-limits
    date: 2026-02-06
    date_kind: announced
    effective: 2026-02-11
    category: api-restriction
    title: Spotify's Web API Development Mode needs Premium and allows 5 users per app
    what_changed: >-
      Spotify said on 6 February 2026 that Web API apps in Development Mode would need the owner to
      have Premium, with 5 users per app and 1 app per developer. New apps also got a smaller set
      of endpoints from 11 February, and existing apps had to follow from 9 March, though they kept
      any users and apps they already had. In July 2026 Spotify raised the limit to 25 apps per
      developer.
    user_impact: >-
      Developers with personal or hobby apps on Spotify's API had to pay for Premium to keep them
      working, and new apps could have 5 users at most.
    company_said: >-
      Spotify said automation and AI had changed the risk profile of developer access, and that at
      its scale those risks needed more structured controls.
    severity: 1
    status: in-force
    related: [spotify/web-api-endpoints-cut]
    sources:
      - url: https://developer.spotify.com/blog/2026-02-06-update-on-developer-access-and-platform-security
        publisher: Spotify for Developers
        kind: primary
        published: 2026-02-06
        archive: https://web.archive.org/web/20261122172439/https://developer.spotify.com/blog/2026-02-06-update-on-developer-access-and-platform-security
        quote: Development Mode use will require a Spotify Premium account
      - url: https://developer.spotify.com/blog/2026-02-06-update-on-developer-access-and-platform-security
        publisher: Spotify for Developers
        kind: primary
        published: 2026-02-06
        archive: https://web.archive.org/web/20261122172439/https://developer.spotify.com/blog/2026-02-06-update-on-developer-access-and-platform-security
        quote: >-
          API access will be limited to a smaller set of supported endpoints From March 9 , these
          same requirements will also apply to all existing Development Mode integrations .
      - url: https://developer.spotify.com/documentation/web-api/tutorials/february-2026-migration-guide
        publisher: Spotify for Developers
        kind: primary
        published: 2026-11-11
        archive: https://web.archive.org/web/20261111112829/https://developer.spotify.com/documentation/web-api/tutorials/february-2026-migration-guide
        quote: As of July 2026, the Client IDs per developer limit has been increased to 25.
      - url: https://developer.spotify.com/documentation/web-api/tutorials/february-2026-migration-guide
        publisher: Spotify for Developers
        kind: primary
        published: 2026-11-11
        archive: https://web.archive.org/web/20261111112829/https://developer.spotify.com/documentation/web-api/tutorials/february-2026-migration-guide
        quote: >-
          Existing apps are grandfathered: If you already have multiple Client IDs or more than 5
          users, you will retain them.
    added: 2026-11-23
    updated: 2026-11-23
    sources_checked: 2026-11-23
