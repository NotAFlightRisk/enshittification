          quote: >-
            the company is now expanding the monthly limit. Starting today, Spotify is raising the
            limit on the number of lyrics free users can view.
        - url: https://techcrunch.com/2024/07/30/spotify-expands-monthly-limit-lyrics-free-users/
          publisher: TechCrunch
          kind: press
          published: 2024-07-30
          archive: https://web.archive.org/web/20260225191712/https://techcrunch.com/2024/07/30/spotify-expands-monthly-limit-lyrics-free-users/
          quote: Since the company decided to remove the restriction
        - url: https://support.spotify.com/us/article/lyrics/
          publisher: Spotify Support
          kind: primary
          published: 2024-08-09
          archive: https://web.archive.org/web/20240809010441/https://support.spotify.com/us/article/lyrics/
          quote: Lyrics are now available for Spotify users across both our Free and Premium tiers.
