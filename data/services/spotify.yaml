  - id: lyrics-premium-test
    date: 2023-09-05
    date_kind: reported
    category: paywall
    title: Spotify tests putting lyrics behind Premium
    what_changed: >-
      Spotify was found testing lyrics as a Premium-only feature on 5 September 2023, with some free
      users seeing a prompt to upgrade instead. Spotify said it was a test with a limited number of
      users.
    user_impact: Free listeners in the test lost the in-app lyrics unless they paid for Premium.
    severity: 2
    status: reversed
    reversed:
      date: 2024-07-30
      what: >-
        Spotify put lyrics behind a monthly limit for free users in May 2024, and started raising
        that limit on 30 July 2024. Its lyrics help page now says lyrics are available on both the
        free and Premium tiers.
      sources:
        - url: https://support.spotify.com/us/article/lyrics/
          publisher: Spotify Support
          kind: primary
          published: 2026-09-23
          archive: https://web.archive.org/web/20260923022804/https://support.spotify.com/us/article/lyrics/
          quote: Lyrics are now available for Spotify users across both our free and Premium tiers.
        - url: https://techcrunch.com/2024/07/30/spotify-expands-monthly-limit-lyrics-free-users/
          publisher: TechCrunch
          kind: press
          published: 2024-07-30
          archive: https://web.archive.org/web/20260225191712/https://techcrunch.com/2024/07/30/spotify-expands-monthly-limit-lyrics-free-users/
          quote: >-
            Back in May, Spotify quietly started putting lyrics behind a paywall, limiting free
            users to lyrics for three songs per month.
        - url: https://techcrunch.com/2024/07/30/spotify-expands-monthly-limit-lyrics-free-users/
          publisher: TechCrunch
          kind: press
          published: 2024-07-30
          archive: https://web.archive.org/web/20260225191712/https://techcrunch.com/2024/07/30/spotify-expands-monthly-limit-lyrics-free-users/
          quote: >-
