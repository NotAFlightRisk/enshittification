  - id: paid-sharing
    date: 2024-09-25
    date_kind: effective
    category: paywall
    title: Disney+ starts charging US and UK subscribers to share outside their household
    question: When did Disney+ start charging for password sharing?
    what_changed: >-
      Disney started charging US subscribers to share Disney+ outside their household on 25
      September 2024, at $6.99 a month on Basic and $9.99 on Premium. The same week it reached the
      UK, at £3.99 on Standard with Ads and £4.99 on Standard and Premium, as part of a rollout
      across Canada, Costa Rica, Guatemala, Europe and Asia-Pacific. Each account could add only one
      Extra Member, and in the US bundle subscribers and people billed through a partner couldn't add
      any.
    user_impact: >-
      Subscribers could pay for one extra member outside their home, while in the US people sharing
      a bundle or partner-billed account couldn't add one, so the other person needed their own
      subscription.
    company_said: Disney said a Disney+ subscription is meant to be used within one household.
    severity: 3
    status: in-force
    regions: [US, GB]
    sources:
      - url: https://thewaltdisneycompany.com/paid-sharing-disney-explainer/
        publisher: The Walt Disney Company
        kind: primary
        published: 2024-09-25
        archive: https://web.archive.org/web/20240925161616/https://thewaltdisneycompany.com/paid-sharing-disney-explainer/
        quote: >-
          For example, in the U.S., an Extra Member profile will cost an additional $6.99 per month
          for Disney+ Basic subscriptions and $9.99 per month for Disney+ Premium subscriptions.
      - url: https://thewaltdisneycompany.com/paid-sharing-disney-explainer/
        publisher: The Walt Disney Company
        kind: primary
        published: 2024-09-25
        archive: https://web.archive.org/web/20240925161616/https://thewaltdisneycompany.com/paid-sharing-disney-explainer/
        quote: >-
          Note that only one Extra Member slot is available per account*. *Extra Member not
          available for Disney Bundle subscribers or for subscribers billed through our partners at
          this time.
      - url: https://www.theverge.com/2024/9/25/24254189/disney-plus-password-sharing-pricing-extra-member
        publisher: The Verge
        kind: press
        published: 2024-09-25
        archive: https://web.archive.org/web/20240925170645/https://www.theverge.com/2024/9/25/24254189/disney-plus-password-sharing-pricing-extra-member
        quote: >-
          That member will be restricted to one profile, and they can only stream and download on
          one device at a time.
      - url: https://thewaltdisneycompany.com/paid-sharing-disney-explainer/
        publisher: The Walt Disney Company
        kind: primary
        published: 2024-09-25
        archive: https://web.archive.org/web/20240925161616/https://thewaltdisneycompany.com/paid-sharing-disney-explainer/
        quote: >-
