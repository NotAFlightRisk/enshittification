    title: Disney+ renames its UK plan Premium and raises it from £7.99 to £10.99
    what_changed: >-
      Disney said on 10 August 2023 that its £7.99 UK plan would be renamed Premium and cost £10.99
      a month from 1 November 2023. Existing subscribers paid it from their first bill on or after 6
      December unless they moved to the new £7.99 Standard, which drops 4K and allows 2 streams, not
      4, or to £4.99 Standard with Ads.
