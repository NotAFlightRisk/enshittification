    updated: 2026-11-22
    sources_checked: 2026-11-22
    status_checked: 2026-11-22

  - id: free-plan-end
    date: 2025-12-31
    date_kind: effective
    category: paywall
    title: Crunchyroll ends its free, ad-supported plan
    question: When did Crunchyroll end its free plan?
    what_changed: >-
      Crunchyroll ended free, ad-supported streaming on 31 December 2025, which it announced in an ad
      during its own free streams. Free viewers already only had selected shows, as Crunchyroll had
      stopped automatically offering all new simulcasts free in 2022.
    before: Free with ads for selected shows
    after: Paid plans only for on-demand streaming
    user_impact: People using Crunchyroll's free on-demand streaming had to subscribe to keep watching.
    severity: 3
    status: in-force
    sources:
      - url: https://www.animenewsnetwork.com/news/2025-12-08/crunchyroll-halts-ad-supported-streaming-on-december-31/.231838
        publisher: Anime News Network
        kind: press
        published: 2025-12-08
        archive: https://web.archive.org/web/20251208190627/https://www.animenewsnetwork.com/news/2025-12-08/crunchyroll-halts-ad-supported-streaming-on-december-31/.231838
        quote: >-
          Crunchyroll revealed in an advertisement during its own free streams that it is halting
          free ad-supported streaming on its service on December 31.
      - url: https://www.animenewsnetwork.com/news/2025-12-08/crunchyroll-halts-ad-supported-streaming-on-december-31/.231838
        publisher: Anime News Network
        kind: press
        published: 2025-12-08
        archive: https://web.archive.org/web/20251208190627/https://www.animenewsnetwork.com/news/2025-12-08/crunchyroll-halts-ad-supported-streaming-on-december-31/.231838
        quote: >-
          Crunchyroll instead required that viewers have a subscription to access new and continuing
          simulcasts.
      - url: https://www.androidauthority.com/crunchyroll-ends-free-plan-3623492/
        publisher: Android Authority
        kind: press
        published: 2025-12-09
        archive: https://web.archive.org/web/20251209161241/https://www.androidauthority.com/crunchyroll-ends-free-plan-3623492/
        quote: >-
          Cord Cutters News reports that Crunchyroll will discontinue its free, ad-supported
          streaming plan on December 31, 2025. The news apparently came via an in-player message in
          place of a regular advertisement.
      - url: https://www.animenewsnetwork.com/news/2026-02-02/crunchyroll-increases-subscription-prices-for-all-tiers/.233751
        publisher: Anime News Network
        kind: press
        published: 2026-02-02
        archive: https://web.archive.org/web/20260202204140/https://www.animenewsnetwork.com/news/2026-02-02/crunchyroll-increases-subscription-prices-for-all-tiers/.233751
        quote: >-
          Crunchyroll halted halting free ad-supported streaming on its service on December 31.
    added: 2026-11-22
    updated: 2026-11-22
    sources_checked: 2026-11-22
    status_checked: 2026-11-22

  - id: price-2026
    date: 2026-02-02
    date_kind: announced
    effective: 2026-03
    category: price-rise
    title: Crunchyroll raises every US monthly tier by $2, with Fan going from $7.99 to $9.99
    what_changed: >-
      Crunchyroll raised every US monthly tier by $2 on 2 February 2026, taking Fan to $9.99, Mega
      Fan to $13.99 and Ultimate Fan to $17.99. Existing members paid it from their next bill after
      4 March, and Fan gained offline viewing on 1 device.
    before: $7.99 a month (Fan)
    after: $9.99 a month (Fan)
    user_impact: >-
      US members on the Fan, Mega Fan and Ultimate Fan monthly tiers paid $2 more a month, with Fan
      members getting offline viewing on 1 device.
    severity: 2
    status: in-force
    regions: [US]
    prices:
      - { plan: fan-us, from: 7.99, to: 9.99 }
      - { plan: mega-fan-us, from: 11.99, to: 13.99 }
      - { plan: ultimate-fan-us, from: 15.99, to: 17.99 }
    sources:
      - url: https://www.animenewsnetwork.com/news/2026-02-02/crunchyroll-increases-subscription-prices-for-all-tiers/.233751
        publisher: Anime News Network
        kind: press
        published: 2026-02-02
        archive: https://web.archive.org/web/20260202204140/https://www.animenewsnetwork.com/news/2026-02-02/crunchyroll-increases-subscription-prices-for-all-tiers/.233751
        quote: >-
          The company increased the Fan Tier price from US$7.99 to US$9.99, the Mega Fan Tier price
          from US$11.99 to US$13.99 per month and the Ultimate Fan Tier from US$15.99 to US$17.99
          per month. The price changes will be reflected for existing paid subscriptions in the U.S.
          on the next billing date after March 4.
      - url: https://www.animenewsnetwork.com/news/2026-02-02/crunchyroll-increases-subscription-prices-for-all-tiers/.233751
        publisher: Anime News Network
        kind: press
        published: 2026-02-02
        archive: https://web.archive.org/web/20260202204140/https://www.animenewsnetwork.com/news/2026-02-02/crunchyroll-increases-subscription-prices-for-all-tiers/.233751
        quote: The Fan Tier now allows users to download content for offline viewing on one device.
      - url: https://www.crunchyroll.com/premium
        publisher: Crunchyroll
        kind: pricing-page
        published: 2026-04-03
        archive: https://web.archive.org/web/20260403113604/https://www.crunchyroll.com/premium
        quote: >-
          Fan $9.99/mo + Applicable taxes No ads Complete access to Crunchyroll's library New
          episodes shortly after airing in Japan Stream on a total of 1 device at a time Offline
          Viewing
