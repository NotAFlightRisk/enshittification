  - id: ad-breaks-test
    date: 2024-06-03
    date_kind: reported
    category: ads
    title: Instagram tests ad breaks that stop you scrolling until the ad has played
    what_changed: >-
      Instagram confirmed on 3 June 2024 that it was testing ad breaks, which show a countdown and
      stop people browsing their feed until they've viewed the ad. Meta didn't say how many people
      or which countries were in the test.
    user_impact: People in the test had to watch an ad before they could keep scrolling.
    company_said: Meta said it was always testing formats that can drive value for advertisers.
    severity: 1
    status: test
    sources:
