        archive: https://web.archive.org/web/20260720003322/https://apnews.com/article/meta-ai-instagram-facebook-turn-off-disable-fd778171e2a1e7098d7b3756deb5587b
        quote: >-
          The bad news is there’s no one button to turn off Meta AI on Facebook, Instagram,
          Messenger or WhatsApp.
      - url: https://apnews.com/article/meta-ai-instagram-facebook-turn-off-disable-fd778171e2a1e7098d7b3756deb5587b
