  - id: highlights-storage-cap
    date: 2025-02-19
    date_kind: announced
    effective: 2025-05-19
    category: removed-feature
    title: Twitch caps Highlights and uploads at 100 hours and deletes the least-viewed first
    what_changed: >-
      Twitch said on 19 February 2025 that it would cap Highlights and uploads at 100 hours a
      channel and delete the rest, least-viewed Highlights first. The deadline was 19 April, later
      pushed back to 19 May 2025.
    user_impact: >-
      Streamers with more than 100 hours of Highlights and uploads had to download and delete them
      or lose them, which Twitch put at under 0.5% of active channels.
    company_said: >-
      Twitch said Highlights hadn't been effective at driving discovery or engagement, and that
      storing them was costly.
    severity: 1
    status: in-force
    sources:
      - url: https://techcrunch.com/2025/02/20/twitch-caps-streamers-storage-at-100-hours-of-highlights-and-uploads/
        publisher: TechCrunch
        kind: press
        published: 2025-02-20
        archive: https://web.archive.org/web/20250220155913/https://techcrunch.com/2025/02/20/twitch-caps-streamers-storage-at-100-hours-of-highlights-and-uploads/
        quote: >-
          Twitch on Wednesday announced it will begin limiting streamers to 100 hours of highlights
          and uploads, and will delete content if a channel exceeds the limit.
      - url: https://techcrunch.com/2025/02/20/twitch-caps-streamers-storage-at-100-hours-of-highlights-and-uploads/
        publisher: TechCrunch
        kind: press
        published: 2025-02-20
        archive: https://web.archive.org/web/20250220155913/https://techcrunch.com/2025/02/20/twitch-caps-streamers-storage-at-100-hours-of-highlights-and-uploads/
        quote: >-
          Streamers whose channels are over the limit after this data will have their highlights and
