  - id: ai-training-default
    date: 2026-08-12
    date_kind: reported
    category: ai
    title: Twitch lets Amazon train generative AI on streamers' channels unless they opt out
    what_changed: >-
      TechCrunch reported on 12 August 2026 that Twitch would use creators' content to train
      generative AI models for Amazon, with creators opted in by default. Opting out keeps streams,
      VODs, clips, stream chats and a channel's pictures and text out of future training only.
    user_impact: >-
      Creators were opted in unless they found the setting and turned it off, and anyone chatting on
      another person's stream is covered by that channel's setting, not their own.
    company_said: >-
      Twitch's chief product officer said it wasn't opt-in because "if this was opt-in, nobody would
      opt in."
    severity: 1
    status: in-force
    related: [linkedin/ai-training-default]
    sources:
      - url: https://techcrunch.com/2026/08/12/amazon-will-train-on-twitch-streamers-content-by-default-unless-they-opt-out/
