changes:
  - id: surestream-ads
    date: 2016-11-02
    date_kind: announced
    category: ads
    title: Twitch rolls out SureStream video ads that ad blockers can't skip
    what_changed: >-
      Twitch started rolling out SureStream on 2 November 2016, ad technology it said would reduce
      the impact of software that bypasses ads. Twitch said the ads couldn't be skipped even with an
      ad blocker on, and pointed anyone who didn't want ads to Twitch Prime, Turbo or channel subs.
    user_impact: >-
      Viewers who used an ad blocker on Twitch would have to watch its video ads wherever SureStream
      was switched on, unless they paid to go ad-free.
    company_said: >-
      Twitch said SureStream would improve video ads for viewers and partners and increase the ad
      revenue pool for partners.
    severity: 3
    status: in-force
    sources:
      - url: https://blog.twitch.tv/en/2016/11/02/introducing-sure-stream-for-a-better-video-ad-experience-on-twitch-3ca5ce3287c/
        publisher: Twitch Blog
        kind: primary
        published: 2016-11-02
        archive: https://web.archive.org/web/20220925212046/https://blog.twitch.tv/en/2016/11/02/introducing-sure-stream-for-a-better-video-ad-experience-on-twitch-3ca5ce3287c/
        quote: >-
          We are well aware that many dedicated Twitch viewers use software that bypasses ads, and the
          rollout of this technology will reduce the efficacy of such software.
      - url: https://blog.twitch.tv/en/2016/11/02/introducing-sure-stream-for-a-better-video-ad-experience-on-twitch-3ca5ce3287c/
        publisher: Twitch Blog
        kind: primary
        published: 2016-11-02
        archive: https://web.archive.org/web/20220925212046/https://blog.twitch.tv/en/2016/11/02/introducing-sure-stream-for-a-better-video-ad-experience-on-twitch-3ca5ce3287c/
        quote: >-
          Over time SureStream will allow us to improve the video advertising experience for viewers
          and partners, improve ad deliverability by reducing the impact of third party services that
          bypass ads, and increase the advertising revenue pool available for partners.
      - url: https://techcrunch.com/2016/11/02/twitch-starts-selling-its-own-video-ads-says-they-cant-be-avoided-via-ad-blockers/
        publisher: TechCrunch
        kind: press
        published: 2016-11-02
        archive: https://web.archive.org/web/20161108231151/https://techcrunch.com/2016/11/02/twitch-starts-selling-its-own-video-ads-says-they-cant-be-avoided-via-ad-blockers/
        quote: >-
          Twitch’s SureStream ads, once enabled, won’t be able to be bypassed by viewers, even if
          they have a third-party ad and content blocker enabled, Twitch noted in its announcement.
