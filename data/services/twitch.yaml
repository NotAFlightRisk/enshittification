changes:
  - id: past-broadcasts-deleted
    date: 2014-08-27
    date_kind: effective
    category: removed-feature
    title: Twitch ends save forever for past broadcasts and deletes the saved ones
    question: When did Twitch start deleting saved past broadcasts?
    what_changed: >-
      Twitch said it would start removing saved past broadcasts from its servers on 27 August 2014,
      after taking away the option to save them forever. It announced the change on 6 August: past
      broadcasts would be kept for up to 14 days, or 60 for Turbo subscribers and Partners.
      Highlights were still saved indefinitely, and a 2-hour limit on them was dropped the next day.
    before: Past broadcasts kept up to 3 days, or forever if saved
    after: Past broadcasts kept up to 14 days, or 60 for Turbo and Partners
    user_impact: >-
      Streamers who had saved past broadcasts forever had 3 weeks' notice to export them to YouTube
      or cut them into highlights before Twitch was due to start deleting them.
    company_said: >-
      Twitch said longer storage for past broadcasts, kept in 3 copies and playable on mobile,
      came at considerable cost and meant dropping save forever, and that it wasn't a move to save
      space.
    severity: 2
    status: in-force
    related: [twitch/highlights-storage-cap]
    sources:
      - url: https://blog.twitch.tv/en/2014/08/06/update-changes-to-vods-on-twitch-169cd8bda850/
        publisher: Twitch Blog
        kind: primary
        published: 2014-08-06
        archive: https://web.archive.org/web/20190927011316/https://blog.twitch.tv/en/2014/08/06/update-changes-to-vods-on-twitch-169cd8bda850/
        quote: >-
          Historically, we’ve offered you the option to save a past broadcast forever.
      - url: https://blog.twitch.tv/en/2014/08/06/update-changes-to-vods-on-twitch-169cd8bda850/
        publisher: Twitch Blog
        kind: primary
        published: 2014-08-06
        archive: https://web.archive.org/web/20190927011316/https://blog.twitch.tv/en/2014/08/06/update-changes-to-vods-on-twitch-169cd8bda850/
        quote: >-
          In order to enable this, we have to remove the “save forever” option entirely for past broadcasts.
      - url: https://blog.twitch.tv/en/2014/08/06/update-changes-to-vods-on-twitch-169cd8bda850/
        publisher: Twitch Blog
        kind: primary
        published: 2014-08-06
        archive: https://web.archive.org/web/20190927011316/https://blog.twitch.tv/en/2014/08/06/update-changes-to-vods-on-twitch-169cd8bda850/
        quote: >-
          As for existing past broadcasts, beginning three weeks from today, we will begin removing them from Twitch servers.
      - url: https://blog.twitch.tv/en/2014/08/06/update-changes-to-vods-on-twitch-169cd8bda850/
        publisher: Twitch Blog
        kind: primary
        published: 2014-08-06
        archive: https://web.archive.org/web/20190927011316/https://blog.twitch.tv/en/2014/08/06/update-changes-to-vods-on-twitch-169cd8bda850/
        quote: >-
          Unfortunately, increasing the amount of storage this way comes at considerable cost.
      - url: https://blog.twitch.tv/en/2014/08/06/update-changes-to-vods-on-twitch-169cd8bda850/
        publisher: Twitch Blog
        kind: primary
        published: 2014-08-06
        archive: https://web.archive.org/web/20190927011316/https://blog.twitch.tv/en/2014/08/06/update-changes-to-vods-on-twitch-169cd8bda850/
        quote: >-
          To be clear: this is not a move to economize on space.
      - url: https://blog.twitch.tv/en/2014/08/06/update-changes-to-vods-on-twitch-169cd8bda850/
        publisher: Twitch Blog
        kind: primary
        published: 2014-08-06
        archive: https://web.archive.org/web/20190927011316/https://blog.twitch.tv/en/2014/08/06/update-changes-to-vods-on-twitch-169cd8bda850/
