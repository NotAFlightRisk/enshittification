changes:
  - id: neighbors-portal-police-requests
    date: 2019-08-28
    date_kind: announced
    category: tracking
    title: Ring says 405 police agencies can ask owners for videos through its Neighbors Portal
    what_changed: >-
      Ring said on 28 August 2019 that 405 police agencies used its Neighbors Portal, which let them
      ask Ring owners for their videos on active investigations. The Washington Post reported the
      same day that the number of police deals hadn't been reported until then. Ring added a map so
      people could see if their local police had joined.
    after: Police can ask Ring owners for their videos
    user_impact: >-
      Ring owners in those agencies' areas could be asked for their videos, though sharing was up to
      them.
    company_said: >-
      Ring said it had designed how law enforcement uses the Neighbors app so users always stay in
      control of the information they share.
    severity: 1
    status: reversed
    regions: [US]
    reversed:
      date: 2024-01-24
      what: >-
        Ring sunset its Request for Assistance tool, so police and fire departments could no longer
        use the Neighbors app to request and receive video, though they could still post there.
      sources:
        - url: https://blog.ring.com/about-ring/ring-announces-new-neighbors-app-features-sunsets-request-for-assistance-post/
          publisher: Ring
          kind: primary
          published: 2024-01-24
          archive: https://web.archive.org/web/20261030045844/https://blog.ring.com/about-ring/ring-announces-new-neighbors-app-features-sunsets-request-for-assistance-post/
          quote: >-
            They will no longer be able to use the RFA tool to request and receive video in the app.
    related: [ring/community-requests]
    sources:
      - url: https://blog.ring.com/2019/08/28/working-together-for-safer-neighborhoods-introducing-the-neighbors-active-law-enforcement-map/
        publisher: Ring
        kind: primary
        published: 2019-08-28
        archive: https://web.archive.org/web/20261006150605/https://blog.ring.com/2019/08/28/working-together-for-safer-neighborhoods-introducing-the-neighbors-active-law-enforcement-map/
        quote: >-
          Today, 405 agencies use the Neighbors Portal, which is an extension of the Neighbors App
          that allow law enforcement to engage with their local community—from posting important
          information about crime and safety events in their neighborhoods to viewing and commenting
          on public posts as a verified law enforcement officer to asking for help on active
          investigations by submitting requests for video recordings.
      - url: https://www.washingtonpost.com/technology/2019/08/28/doorbell-camera-firm-ring-has-partnered-with-police-forces-extending-surveillance-reach/
        publisher: The Washington Post
        kind: press
        published: 2019-08-28
        archive: https://web.archive.org/web/20190828121612/https://www.washingtonpost.com/technology/2019/08/28/doorbell-camera-firm-ring-has-partnered-with-police-forces-extending-surveillance-reach/
        quote: >-
          The number of police deals, which has not previously been reported, will likely fuel
          broader questions about privacy, surveillance and the expanding reach of tech giants and
          local police.
        paywalled: true
    added: 2026-11-23
    updated: 2026-11-23
    sources_checked: 2026-11-23
    status_checked: 2026-11-23

  - id: basic-price-2022
    date: 2022-06-01
    date_kind: announced
    effective: 2022-07-01
    category: price-rise
    title: Ring Protect Basic goes from $3 to $3.99 a month, its first US rise
    what_changed: >-
      Ring said on 1 June 2022 that US Ring Protect Basic would go from $3 to $3.99 a month, or
      $39.99 a year, its first rise since the plan launched in 2015. It took effect from the first
      bill on or after 1 July 2022, and came with more video storage, bulk downloads and discounts.
    before: $3 a month
    after: $3.99 a month
    user_impact: >-
      Every US Protect Basic subscriber paid more, while Protect Plus and Pro kept their prices.
    company_said: >-
      Ring said it was raising the price with its continued investment in innovation and commitment
      to bringing new capabilities.
    severity: 2
    status: in-force
    regions: [US]
    prices:
      - { plan: basic-us, from: 3, to: 3.99 }
    related: [ring/basic-price-2024]
    sources:
      - url: https://blog.ring.com/products-innovation/we-are-continuing-to-innovate-for-our-neighbors/
        publisher: Ring
        kind: primary
        published: 2022-06-01
        archive: https://web.archive.org/web/20260209204557/https://blog.ring.com/products-innovation/we-are-continuing-to-innovate-for-our-neighbors/
        quote: >-
          we are raising the price of our Ring Protect Basic plan for the first time to $3.99 per
          month, or $39.99 per year in the U.S. The price change will take effect on the first
          billing date on or after July 1, 2022.
      - url: https://techcrunch.com/2022/06/03/ring-announces-new-features-raises-its-basic-subscription-price-for-the-first-time-since-2017/
        publisher: TechCrunch
        kind: press
        published: 2022-06-03
        archive: https://web.archive.org/web/20221012153859/https://techcrunch.com/2022/06/03/ring-announces-new-features-raises-its-basic-subscription-price-for-the-first-time-since-2017/
        quote: >-
          the price of the Protect Basic plan is increasing starting in July to $3.99 a month or
          $39.99 a year in the U.S.
    added: 2026-11-23
    updated: 2026-11-23
    sources_checked: 2026-11-23
    status_checked: 2026-11-23

  - id: alarm-app-features-paywall
    date: 2023-03-29
    date_kind: effective
    category: paywall
    title: Ring Alarms bought from 29 March 2023 need Ring Protect for the app's alarm features
    what_changed: >-
      Ring Alarms bought in the US and Canada from 29 March 2023 need Ring Protect for their in-app
      features. Without it, the Ring Keypad arms and disarms them. Alarms owned
      before that date keep their in-app features, with or without a subscription, for the expected
      life of the device.
    before: Ring Alarm in-app features without a subscription
    after: Keypad only, unless you pay for Ring Protect
    user_impact: >-
      People who bought a Ring Alarm from 29 March 2023 and don't pay for Ring Protect can only arm
      and disarm it on the keypad, with alarm alerts sounding from the base station.
    severity: 2
    status: in-force
    regions: [US, CA]
    related: [ring/home-away-modes-paywall]
    sources:
      - url: https://support.ring.com/hc/en-us/articles/12866034603028
        publisher: Ring Help
        kind: primary
        published: 2023-03
        archive: https://web.archive.org/web/20230302212259/https://support.ring.com/hc/en-us/articles/12866034603028
        quote: >-
          Starting March 29, 2023 , a Ring Protect subscription will be required to access Ring Alarm
          in-app features in the US and Canada, including digital notifications and the ability to
          Arm and Disarm from your app. If you owned an Alarm before this date, your current device
          will keep these in-app features.
      - url: https://ring.com/support/articles/odtb0/Price-Increase-for-Ring-Protect-Basic-March2024
        publisher: Ring Help
        kind: primary
        published: 2024-02-08
        archive: https://web.archive.org/web/20240208214404/https://ring.com/support/articles/odtb0/Price-Increase-for-Ring-Protect-Basic-March2024
        quote: >-
          If you bought a Ring Alarm after March 29, 2023, you will lose Ring Alarm in-app features
          if you cancel your Ring Protect subscription. You can still Arm and Disarm your Alarm
          directly from the Ring Keypad without a subscription. Alarm alerts will sound locally from
          the physical Ring Alarm Base Station.
      - url: https://ring.com/support/articles/odtb0/Price-Increase-for-Ring-Protect-Basic-March2024
        publisher: Ring Help
        kind: primary
        published: 2024-02-08
        archive: https://web.archive.org/web/20240208214404/https://ring.com/support/articles/odtb0/Price-Increase-for-Ring-Protect-Basic-March2024
        quote: >-
          If you owned a Ring Alarm before March 29, 2023, you will have access to in-app features
          (with or without a subscription) for the expected life of the device.
    added: 2026-11-23
    updated: 2026-11-23
    sources_checked: 2026-11-23
    status_checked: 2026-11-23

