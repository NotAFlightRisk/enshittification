    title: Ring puts Home and Away Modes for its doorbells and cameras behind Ring Protect
    what_changed: >-
      Ring made Home and Away Modes for doorbells and cameras a Ring Protect feature on 29 March 2023,
      including on ones people already owned. Modes switch
      recording and Live View on or off depending on whether you're home.
