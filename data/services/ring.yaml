  - id: community-requests
    date: 2025-04-22
    date_kind: announced
    effective: 2025-09-04
    category: tracking
    title: Ring brings back police requests for owners' videos, through Axon
    what_changed: >-
      Ring said on 22 April 2025 that it would bring police video requests back to the Neighbors app
      through Axon, after ending them in January 2024. Community Requests began rolling out in the US
      on 4 September 2025, notifying owners near an incident, with any videos they share going
      straight to Axon Evidence. Ring said in October 2025 it planned a Flock Safety integration,
      then cancelled it on 12 February 2026 before it launched.
    before: No police video requests in the Neighbors app
    after: Police using Axon can ask nearby owners for videos
    user_impact: >-
      US Ring owners near an incident a participating agency asks about get requests for their
      videos unless they turn those notifications off, though sharing stays up to them.
    company_said: >-
      Ring said it was similar to the way the public has always responded to pleas for information,
      just a much smarter way to get it to public safety agencies.
    severity: 1
    status: in-force
    regions: [US]
    related: [ring/neighbors-portal-police-requests]
    sources:
      - url: https://blog.ring.com/about-ring/ring-announces-plans-to-work-with-axon-to-bring-community-request-service-to-the-neighbors-app/
        publisher: Ring
        kind: primary
        published: 2025-04-22
        archive: https://web.archive.org/web/20260810012538/https://blog.ring.com/about-ring/ring-announces-plans-to-work-with-axon-to-bring-community-request-service-to-the-neighbors-app/
        quote: >-
          With Axon, we’re working to bring Community Request into Ring’s Neighbors app.
      - url: https://blog.ring.com/about-ring/ring-launches-community-requests-a-new-way-to-help-your-community/
        publisher: Ring
        kind: primary
        published: 2025-09-04
        archive: https://web.archive.org/web/20261018133939/https://blog.ring.com/about-ring/ring-launches-community-requests-a-new-way-to-help-your-community/
        quote: >-
          The request appears publicly on the Neighbors feed, and Ring users within the designated
          area receive a notification.
      - url: https://blog.ring.com/about-ring/ring-announces-new-neighbors-app-features-sunsets-request-for-assistance-post/
        publisher: Ring
        kind: primary
        published: 2024-01-24
        archive: https://web.archive.org/web/20261030045844/https://blog.ring.com/about-ring/ring-announces-new-neighbors-app-features-sunsets-request-for-assistance-post/
        quote: >-
          They will no longer be able to use the RFA tool to request and receive video in the app.
      - url: https://blog.ring.com/about-ring/ring-and-flock-cancel-partnership/
        publisher: Ring
        kind: primary
        published: 2026-02-12
        archive: https://web.archive.org/web/20261107121334/https://blog.ring.com/about-ring/ring-and-flock-cancel-partnership/
        quote: >-
          In October 2025, Ring and Flock Safety announced our intention to work together on an
