  - id: search-party-on-by-default
    date: 2025-10-23
    date_kind: reported
    category: ai
    title: Ring signs outdoor cameras up to AI scans for lost dogs unless owners opt out
    what_changed: >-
      Ring turned Search Party on by default for outdoor cameras ahead of its planned November 2025
      launch, so they use AI to look for dogs reported missing nearby. PCWorld reported on 23 October
      2025 that the setting was already on in the app. Owners whose camera spots a possible match are asked
      whether to share the video, and can turn it off in the app's Control Center.
    after: Outdoor cameras scan for lost dogs unless you turn it off
    user_impact: >-
      Ring owners' outdoor cameras joined searches for other people's lost dogs unless they found the
      setting and turned it off.
    company_said: >-
      Ring said your privacy is always in your control, as owners choose which videos, if any, to
      share with a neighbour looking for their dog.
    severity: 1
    status: in-force
    sources:
      - url: https://www.pcworld.com/article/2951106/rings-ai-powered-pet-finder-is-coming-and-youre-already-signed-up.html
        publisher: PCWorld
        kind: press
        published: 2025-10-23
        archive: https://web.archive.org/web/20251023180404/https://www.pcworld.com/article/2951106/rings-ai-powered-pet-finder-is-coming-and-youre-already-signed-up.html
        quote: >-
          Ring’s Search Party feature isn’t slated to go live until November, but banners announcing
          the functionality have already started appearing in the Ring app, along with a
          setting—already enabled—that lets you control whether Search Party is active on your Ring
          cameras.
      - url: https://blog.ring.com/products-innovation/icymi-ring-launches-4k-cameras-alexa-ai-search-party/
        publisher: Ring
        kind: primary
        published: 2025-10-10
        archive: https://web.archive.org/web/20260518190801/https://blog.ring.com/products-innovation/icymi-ring-launches-4k-cameras-alexa-ai-search-party/
        quote: >-
          When a neighbor reports their dog is missing in the Ring App, registered outdoor Ring
          cameras will automatically scan for sightings in the neighborhood. If your device captures
          footage of the missing dog, you'll receive a notification and can then choose to share the
          video.
      - url: https://www.engadget.com/big-tech/heres-how-to-disable-rings-creepy-search-party-feature-185420455.html
        publisher: Engadget
        kind: press
        published: 2026-02-09
        archive: https://web.archive.org/web/20260209195740/https://www.engadget.com/big-tech/heres-how-to-disable-rings-creepy-search-party-feature-185420455.html
        quote: >-
          many Ring users are looking for a way to disable the feature, as it's enabled by default.
    added: 2026-11-23
    updated: 2026-11-23
    sources_checked: 2026-11-23
    status_checked: 2026-11-23
