  - id: forsaken-campaign-vaulted
    date: 2022-02-22
    date_kind: effective
    category: removed-feature
    title: Bungie removes the Forsaken campaign and Tangled Shore from Destiny 2
    what_changed: >-
      Bungie moved the Forsaken campaign and the Tangled Shore into its Destiny Content Vault on 22
      February 2022, when Year 5 began. The campaign had been free for all players until then, and
      Forsaken's raid, dungeon and exotics, reached through the Dreaming City, stayed on sale as the
      Forsaken Pack.
    user_impact: >-
      Destiny 2 players could no longer play the Forsaken campaign or visit the Tangled Shore.
    company_said: >-
      Bungie said cycling some destinations and activities into the vault each year let it update
      the game more quickly.
    severity: 3
    status: in-force
    sources:
      - url: https://help.bungie.net/hc/en-us/articles/360049202971-Destiny-Content-Vault
        publisher: Bungie Help
        kind: primary
        published: 2022-02-22
        archive: https://web.archive.org/web/20261001011352/https://help.bungie.net/hc/en-us/articles/360049202971-Destiny-Content-Vault
        quote: >-
          With the launch of Year 5 on February 22, 2022, certain destinations, seasonal content,
          activities, and quests moved into the Destiny Content Vault (DCV).
      - url: https://help.bungie.net/hc/en-us/articles/360049202971-Destiny-Content-Vault
