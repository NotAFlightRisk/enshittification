  - id: content-vault-2020
    date: 2020-11-10
    date_kind: effective
    category: removed-feature
    title: Bungie removes the Red War, Curse of Osiris and Warmind campaigns from Destiny 2
    question: When did Destiny 2 remove Curse of Osiris and Warmind?
    what_changed: >-
      Bungie moved the Red War, Curse of Osiris and Warmind campaigns into its Destiny Content Vault
      on 10 November 2020, so they can no longer be played. The Mercury, Mars, Titan and Io
      destinations went too, with the Leviathan, Eater of Worlds, Spire of Stars, Scourge of the
      Past and Crown of Sorrows raids. Bungie had announced the vault in June 2020.
    user_impact: >-
      Destiny 2 players could no longer play the original campaigns, the destinations they were set
      on or the raids that went with them.
    company_said: >-
      Bungie said the vault would help it manage updates, keep file sizes down and prioritise newer
      content.
    severity: 3
    status: in-force
    sources:
      - url: https://help.bungie.net/hc/en-us/articles/360049202971-Destiny-Content-Vault
        publisher: Bungie Help
        kind: primary
        published: 2020-11-10
        archive: https://web.archive.org/web/20261001011352/https://help.bungie.net/hc/en-us/articles/360049202971-Destiny-Content-Vault
        quote: >-
          With the launch of Year 4 on November 10, 2020, certain destinations, seasonal content,
          activities, and quests moved into the Destiny Content Vault (DCV).
