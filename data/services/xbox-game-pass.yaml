      Ultimate or PC Game Pass at launch, but about a year later. The same day it cut Ultimate from
      $29.99 to $22.99 a month and PC Game Pass from $16.49 to $13.99 in the US.
    before: New Call of Duty games on day one
    after: New Call of Duty games about a year later
