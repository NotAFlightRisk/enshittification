  - id: dlc-discount-swapped-for-points
    date: 2025-10-03
    date_kind: reported
    category: removed-feature
    title: Game Pass swaps its 10% member discount on add-ons and DLC for Rewards points
    what_changed: >-
      Kotaku reported on 3 October 2025 that Game Pass had dropped its 10% off Call of Duty
      add-ons, and Microsoft then said the discount had gone on all DLC. Instead,
      Ultimate members get 10% back in Rewards points on select games and add-ons, and Premium
      members 5%.
    before: 10% off add-ons and DLC
    after: 10% back in Rewards points on Ultimate, 5% on Premium
    user_impact: >-
      Game Pass members who buy add-ons, like Call of Duty points, lost the 10% off at checkout and
      get Rewards points back on select games and add-ons instead, at 10% on Ultimate and 5% on
      Premium.
    severity: 1
    status: in-force
