  - id: cloud-gaming-hour-limits
    date: 2026-09-03
    date_kind: announced
    effective: 2026-11
    category: paywall
    title: Game Pass limits cloud gaming to 5 to 15 hours a month and sells extra time
    question: Does Game Pass have a cloud gaming time limit?
    what_changed: >-
      Microsoft said on 3 September 2026 that from November, Game Pass would cap cloud gaming at
      15 hours a month on Ultimate, 10 on Premium and 5 on Essential. Essential, Premium and
      Ultimate had all been sold with unlimited cloud gaming since October 2025, and time past the
      cap has to be bought from the Xbox Store. By 10 November 2026 the Game Pass plans page listed
      the monthly hours.
    before: No monthly limit on cloud gaming
    after: 15 hours a month on Ultimate, 10 on Premium, 5 on Essential
    user_impact: >-
      Game Pass members who stream a lot, which Microsoft put at 4% of subscribers, have to buy
      more playtime past the cap, though existing members in some countries, such as Germany and
      Australia, were told it won't apply while their plan keeps renewing.
    company_said: >-
      Microsoft said the cost of providing cloud gaming grows as more people use it and play for
      longer, and that for some players the practical result is a higher cost.
    severity: 2
    status: in-force
    sources:
      - url: https://news.xbox.com/en-us/2026/09/03/xbox-cloud-gaming-changes/
        publisher: Xbox Wire
        kind: primary
        published: 2026-09-03
        archive: https://web.archive.org/web/20260903213615/https://news.xbox.com/en-us/2026/09/03/xbox-cloud-gaming-changes/
        quote: >-
          Game Pass plans will include a set number of cloud gaming hours each month: Game Pass
          Ultimate: 15 hours Game Pass Premium: 10 hours Game Pass Essential: 5 hours Today, eligible
          Game Pass subscribers can stream without these monthly hour limits.
      - url: https://news.xbox.com/en-us/2026/09/03/xbox-cloud-gaming-changes/
        publisher: Xbox Wire
        kind: primary
        published: 2026-09-03
        archive: https://web.archive.org/web/20260903213615/https://news.xbox.com/en-us/2026/09/03/xbox-cloud-gaming-changes/
        quote: >-
          Once subscribers use their included hours, they will be able to purchase additional cloud
          playtime through the XBOX Store.
      - url: https://news.xbox.com/en-us/2026/09/03/xbox-cloud-gaming-changes/
        publisher: Xbox Wire
        kind: primary
        published: 2026-09-03
        archive: https://web.archive.org/web/20260903213615/https://news.xbox.com/en-us/2026/09/03/xbox-cloud-gaming-changes/
        quote: We expect this upcoming change to impact 4% of Game Pass subscribers.
      - url: https://news.xbox.com/en-us/2026/09/03/xbox-cloud-gaming-changes/
        publisher: Xbox Wire
        kind: primary
        published: 2026-09-03
        archive: https://web.archive.org/web/20260903213615/https://news.xbox.com/en-us/2026/09/03/xbox-cloud-gaming-changes/
