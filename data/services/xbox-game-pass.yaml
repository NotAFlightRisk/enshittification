changes:
  - id: gold-price-2021
    date: 2021-01-22
    date_kind: announced
    category: price-rise
    title: Xbox Live Gold's 6-month price set to go from $39.99 to $59.99, then dropped
    what_changed: >-
      Microsoft said on 22 January 2021 that Xbox Live Gold would cost $59.99 for 6 months, up from
      $39.99, with 1 and 3 months going up too. It dropped the rise the same day.
    before: $39.99 for 6 months
    after: $59.99 for 6 months
    user_impact: >-
      It would have hit new Gold members and anyone paying by the month or 3 months, but it was
      dropped the same day.
    company_said: >-
      Microsoft said Gold's price hadn't changed for years in many markets, and for over 10 years
      in some.
    severity: 2
    status: reversed
    reversed:
      date: 2021-01-22
      what: Microsoft said the same night that it would not change Xbox Live Gold pricing after all.
      sources:
        - url: https://news.xbox.com/en-us/2021/01/22/update-on-xbox-live-gold-pricing/
          publisher: Xbox Wire
          kind: primary
          published: 2021-01-22
          archive: https://web.archive.org/web/20210201000804/https://news.xbox.com/en-us/2021/01/22/update-on-xbox-live-gold-pricing/
          quote: As a result, we have decided not to change Xbox Live Gold pricing.
    regions: [US]
    sources:
      - url: https://news.xbox.com/en-us/2021/01/22/update-on-xbox-live-gold-pricing/
        publisher: Xbox Wire
        kind: primary
        published: 2021-01-22
        archive: https://web.archive.org/web/20210122140958/https://news.xbox.com/en-us/2021/01/22/update-on-xbox-live-gold-pricing/
        quote: >-
          Going forward, new pricing will be 1-month for $10.99, 3-months for $29.99, and 6-months
          for $59.99, or your local market equivalent.
      - url: https://news.xbox.com/en-us/2021/01/22/update-on-xbox-live-gold-pricing/
        publisher: Xbox Wire
        kind: primary
        published: 2021-01-22
        archive: https://web.archive.org/web/20210122140958/https://news.xbox.com/en-us/2021/01/22/update-on-xbox-live-gold-pricing/
        quote: >-
          In many markets, the price of Xbox Live Gold has not changed for years and in some
          markets, it hasn’t changed for over 10 years.
      - url: https://news.xbox.com/en-us/2021/01/22/update-on-xbox-live-gold-pricing/
        publisher: Xbox Wire
        kind: primary
        published: 2021-01-22
        archive: https://web.archive.org/web/20210201000804/https://news.xbox.com/en-us/2021/01/22/update-on-xbox-live-gold-pricing/
        quote: >-
          In the US, $9.99 for 1-month, $24.99 for 3-months, $39.99 for 6-months and $59.99 for
          retail 12-months.
    added: 2026-11-20
    updated: 2026-11-20
    sources_checked: 2026-11-20
    status_checked: 2026-11-20

  - id: ultimate-price-2023
    date: 2023-06-21
    date_kind: announced
    effective: 2023-07-06
    category: price-rise
    title: Game Pass Ultimate goes from $14.99 to $16.99 a month in the US, its first rise
    what_changed: >-
      Microsoft said on 21 June 2023 that US Game Pass Ultimate would go from $14.99 to $16.99 a
      month for new members on 6 July 2023. Existing members paid it from 13 August, and Game Pass
      for Console went from $9.99 to $10.99.
    before: $14.99 a month
    after: $16.99 a month
    user_impact: >-
      US Ultimate and Game Pass for Console members paid more, new ones from July and existing
      monthly ones from August 2023.
    company_said: >-
      Xbox said the Game Pass rises were to match local market conditions and weren't tied to its
      Activision Blizzard deal.
    severity: 1
    status: in-force
    regions: [US]
    prices:
      - { plan: ultimate-us, from: 14.99, to: 16.99 }
    sources:
      - url: https://www.theverge.com/2023/6/21/23768400/microsoft-xbox-series-x-xbox-game-pass-price-increase
        publisher: The Verge
        kind: press
        published: 2023-06-21
        archive: https://web.archive.org/web/20230621173918/https://www.theverge.com/2023/6/21/23768400/microsoft-xbox-series-x-xbox-game-pass-price-increase
        quote: >-
          Xbox Game Pass Ultimate will move from $14.99 per month to $16.99 (€14.99 / £12.99). The
          base Xbox Game Pass for Console pricing will also move from $9.99 a month up to $10.99
          (€10.99 / £8.99).
      - url: https://www.theverge.com/2023/6/21/23768400/microsoft-xbox-series-x-xbox-game-pass-price-increase
        publisher: The Verge
        kind: press
        published: 2023-06-21
        archive: https://web.archive.org/web/20230621173918/https://www.theverge.com/2023/6/21/23768400/microsoft-xbox-series-x-xbox-game-pass-price-increase
        quote: >-
          If you’re an existing Game Pass monthly subscriber, then these new recurring prices won’t
          take effect until August 13th, or September 13th in Germany. New Xbox Game Pass members
          will see the new prices immediately on July 6th.
      - url: https://www.theverge.com/2023/6/21/23768400/microsoft-xbox-series-x-xbox-game-pass-price-increase
        publisher: The Verge
        kind: press
        published: 2023-06-21
        archive: https://web.archive.org/web/20230621173918/https://www.theverge.com/2023/6/21/23768400/microsoft-xbox-series-x-xbox-game-pass-price-increase
        quote: >-
          These Game Pass price adjustments are not related to the Activision Blizzard deal, and are
          intended to match local market conditions
    added: 2026-11-20
    updated: 2026-11-20
    sources_checked: 2026-11-20
    status_checked: 2026-11-20

  - id: games-with-gold-ended
    date: 2023-07-17
    date_kind: announced
    effective: 2023-09-01
    category: removed-feature
    title: Microsoft ends Games with Gold, the monthly games included with Xbox Live Gold
    question: What happened to Games with Gold?
    what_changed: >-
      Microsoft said on 17 July 2023 that Games with Gold, the monthly games Xbox Live Gold members
      could add to their library, would end on 1 September 2023. Gold became Game Pass Core on 14
      September, with over 25 games from the Game Pass catalogue in their place and new ones added
      2-3 times a year.
    before: New games to add to your library every month
    after: Over 25 Game Pass games, with new ones 2-3 times a year
    user_impact: >-
      Xbox Live Gold members stopped getting new games to add to their library each month, and got
      a set of Game Pass games that can change over time instead.
    company_said: >-
      Microsoft said it wanted to re-imagine how to include games with the subscription, and found
      the answer was select titles from its Game Pass catalogue.
    severity: 2
    status: in-force
    sources:
      - url: https://news.xbox.com/en-us/2023/07/17/xbox-game-pass-core/
        publisher: Xbox Wire
        kind: primary
        published: 2023-07-17
        archive: https://web.archive.org/web/20230717163450/https://news.xbox.com/en-us/2023/07/17/xbox-game-pass-core/
        quote: >-
          Games with Gold will come to an end on September 1. Players can continue to access any
          Xbox One games they previously redeemed through Games with Gold if they remain a Game Pass
          Core or Game Pass Ultimate member.
      - url: https://news.xbox.com/en-us/2023/07/17/xbox-game-pass-core/
        publisher: Xbox Wire
        kind: primary
        published: 2023-07-17
        archive: https://web.archive.org/web/20230717163450/https://news.xbox.com/en-us/2023/07/17/xbox-game-pass-core/
        quote: >-
          We wanted to use this opportunity to re-imagine how to include content with this
          subscription. We found that the answer to the most compelling catalog was to leverage
          select titles from our Xbox Game Pass catalog.
      - url: https://www.theverge.com/2023/7/17/23794792/microsoft-xbox-game-pass-core-live-gold-replacement
        publisher: The Verge
        kind: press
        published: 2023-07-17
        archive: https://web.archive.org/web/20230717174514/https://www.theverge.com/2023/7/17/23794792/microsoft-xbox-game-pass-core-live-gold-replacement
        quote: >-
          Microsoft is discontinuing Games with Gold on September 1st, the perk that has allowed
          Xbox owners to grab free games monthly for a decade and add them to their content library.
      - url: https://news.xbox.com/en-us/2023/07/27/games-with-gold-for-august-2023/
        publisher: Xbox Wire
        kind: primary
        published: 2023-07-27
        archive: https://web.archive.org/web/20230727165656/https://news.xbox.com/en-us/2023/07/27/games-with-gold-for-august-2023/
        quote: >-
          Games with Gold will come to an end on September 1. You can continue to access any Games
          with Gold games previously redeemed while remaining an Xbox Game Pass Core or Xbox Game
          Pass Ultimate member.
    added: 2026-11-20
    updated: 2026-11-20
    sources_checked: 2026-11-20
    status_checked: 2026-11-20

