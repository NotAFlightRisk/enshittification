changes:
  - id: free-classic-retired
    date: 2023-04-12
    date_kind: effective
    category: paywall
    title: Microsoft retires Teams Free (classic), and keeping its data in Teams costs $4 a user
    question: When did Microsoft retire Teams Free (classic)?
    what_changed: >-
      Microsoft said its legacy free Teams app for business, Teams Free (classic), would no longer
      be available after 12 April 2023. After that, it said, users would lose access to their
      account and its data would be deleted, and its page still gave that date over a year later. To
      keep their chats, files, teams and meetings, organisations had to upgrade all the profiles on
      their account to a paid plan, such as Teams Essentials at $4 per user a month or Microsoft 365
      Business Basic at $6. The newer Microsoft Teams (free) was the free option, but none of their
      data would move across to it, though files could be saved somewhere else first.
    before: Free Teams for business, with its chats, files, teams and meetings
    after: $4 per user a month to keep them, or a new free account with nothing moved over
    user_impact: >-
      Organisations on Teams Free (classic) had to upgrade every profile to keep their chats, files,
      teams and meetings, or move to a new Microsoft Teams (free) account without them, saving their
      files somewhere else first.
    company_said: >-
      Microsoft said it was making the change to invest in a single free Teams experience across
      personal and small business.
    severity: 3
    status: in-force
