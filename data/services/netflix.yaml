    date_kind: announced
    category: price-rise
    title: Netflix Standard goes from $15.49 to $17.99 in the US
    what_changed: >-
      Netflix raised US Standard from $15.49 to $17.99 a month on 21 January 2025, with the ad plan
      going from $6.99 to $7.99 and Premium from $22.99 to $24.99. An extra member without ads went
      from $7.99 to $8.99, and existing members paid the new prices from their next billing cycle.
    before: $15.49 a month
    after: $17.99 a month
