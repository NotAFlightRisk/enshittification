changes:
  - id: dvd-streaming-split
    date: 2011-07-12
    date_kind: announced
    effective: 2011-09-01
    category: price-rise
    title: Netflix splits DVDs and streaming, taking the combined plan from $9.99 to $15.98
    what_changed: >-
      Netflix said on 12 July 2011 that its $9.99 plan for streaming and DVDs would become a $7.99
      streaming plan and a $7.99 DVD plan, or $15.98 for both. New members paid it
      straight away and existing ones from 1 September 2011, while streaming on its own stayed at
      $7.99.
    before: $9.99 a month for streaming and DVDs
    after: $15.98 a month for both
    user_impact: Members who kept both streaming and DVDs paid 60% more.
    company_said: >-
      Netflix said separate plans would better reflect the cost of each and give members a choice.
    severity: 2
    status: in-force
    regions: [US]
    sources:
      - url: https://blog.netflix.com/2011/07/netflix-introduces-new-plans-and.html
        publisher: Netflix Blog
        kind: primary
        published: 2011-07-12
        archive: https://web.archive.org/web/20110713091434/http://blog.netflix.com/2011/07/netflix-introduces-new-plans-and.html
        quote: The price for getting both of these plans will be $15.98 a month ($7.99 + $7.99).
      - url: https://www.prnewswire.com/news-releases/netflix-to-offer-new-unlimited-dvd-plans-and-will-separate-streaming-and-dvd-plans-in-the-us-125422973.html
        publisher: Netflix via PR Newswire
        kind: primary
        published: 2011-07-12
        archive: https://web.archive.org/web/20110714083521/http://www.prnewswire.com/news-releases/netflix-to-offer-new-unlimited-dvd-plans-and-will-separate-streaming-and-dvd-plans-in-the-us-125422973.html
        quote: The unlimited streaming plan will remain at $7.99 a month.
      - url: https://techcrunch.com/2014/05/09/netflix-learns-from-past-mistakes-increases-prices-the-right-way/
        publisher: TechCrunch
        kind: press
        published: 2014-05-09
        archive: https://web.archive.org/web/20140509175128/https://techcrunch.com/2014/05/09/netflix-learns-from-past-mistakes-increases-prices-the-right-way/
        quote: >-
          you suddenly went from paying $10/month to paying $16/month, a 60 percent price hike
    added: 2026-11-19
    updated: 2026-11-19
    sources_checked: 2026-11-19
    status_checked: 2026-11-19

  - id: standard-price-2014
    date: 2014-05-09
    date_kind: announced
    category: price-rise
    title: Netflix's HD streaming plan goes from $7.99 to $8.99 for new US members
    what_changed: >-
      Netflix said on 9 May 2014 that its $7.99 HD streaming plan would cost new members $8.99 a
      month. Existing members kept their $7.99 price until 2016, and a new $7.99 plan with SD on one
      screen became the cheapest.
    before: $7.99 a month
    after: $8.99 a month
    user_impact: New members paid more for HD, while existing ones kept the old price for now.
    company_said: Netflix said the rise was so it could keep adding more films and TV shows.
    severity: 1
    status: in-force
    regions: [US]
    prices:
      - { plan: standard-us, from: 7.99, to: 8.99 }
    sources:
      - url: https://blog.netflix.com/2014/05/a-quick-update-on-our-streaming-plans.html
        publisher: Netflix Blog
        kind: primary
        published: 2014-05-09
        archive: https://web.archive.org/web/20140513223948/http://blog.netflix.com/2014/05/a-quick-update-on-our-streaming-plans.html
        quote: >-
          To continue adding more movies and TV shows, we are increasing the price of our $7.99 a
          month streaming plan by one dollar to $8.99 for new members.
      - url: https://www.sec.gov/Archives/edgar/data/1065280/000106528016000057/nflx-33116x10qxdoc.htm
        publisher: Netflix (SEC filing)
        kind: primary
        published: 2016-04-20
        archive: https://web.archive.org/web/20160430043335/https://www.sec.gov/Archives/edgar/data/1065280/000106528016000057/nflx-33116x10qxdoc.htm
        quote: >-
          In May 2014, in the U.S., we increased the price of our standard plan from $7.99 per month
