      2023, and in the UK too. That left the $6.99 ad plan as the cheapest, and $15.49 Standard as
      the cheapest without ads, while people already on Basic could keep it.
    before: Cheapest plan without ads $9.99 a month
    after: Cheapest plan without ads $15.49 a month
    user_impact: New and rejoining members who didn't want ads paid $15.49 a month instead of $9.99.
    company_said: >-
      Netflix said its entry prices were great value given the breadth and quality of its catalogue.
