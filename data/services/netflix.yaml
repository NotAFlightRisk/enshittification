  - id: price-hold-ends-2016
    date: 2016-05
    date_kind: effective
    category: price-rise
    title: Netflix ends its price hold, moving long-time members from $7.99 to $9.99
    what_changed: >-
      Netflix started moving US members who had kept $7.99 since 2014 onto the $9.99 Standard price
      from May 2016, by billing date, as their price guarantees ran out. Each was emailed 30 days
      before their next bill, and could move to the $7.99 SD plan instead.
    before: $7.99 a month
    after: $9.99 a month
    user_impact: Members who had kept the old price paid more to keep HD, or gave it up.
    severity: 2
    status: in-force
    regions: [US]
    sources:
