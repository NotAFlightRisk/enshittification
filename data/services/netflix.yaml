  - id: phone-casting-removed
    date: 2025-12-01
    date_kind: reported
    category: removed-feature
    title: Netflix stops casting from phones to most TVs
    question: When did Netflix stop casting from phones?
    what_changed: >-
      Netflix stopped casting from its phone app to most TVs and streaming devices, first reported on
      1 December 2025 after its help page changed. Casting still works with older
      Chromecasts and TVs with Google Cast built in, and only on ad-free plans.
    user_impact: >-
      People who cast from their phone to a Chromecast with Google TV, a Google TV Streamer or most
      TVs lost the feature.
    severity: 2
    status: in-force
    sources:
