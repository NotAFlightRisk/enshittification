  - id: paid-sharing
    date: 2023-05-23
    date_kind: announced
    category: paywall
    title: Netflix starts charging US and UK members to share outside their household
    question: When did Netflix start charging for password sharing?
    what_changed: >-
      Netflix started emailing US members who shared their account outside their household on 23
      May 2023, offering to add an extra member for $7.99 a month. It started the same day in the
      UK, where an extra member cost £4.99. In the US only Standard and Premium could add extra
      members, so Basic and Standard with ads couldn't.
    user_impact: >-
      Members could pay for an extra member outside their home, $7.99 a month in the US and £4.99 in
      the UK, while Basic and Standard with ads accounts in the US couldn't add one.
    company_said: Netflix said a Netflix account is for use by one household.
    severity: 3
    status: in-force
    regions: [US, GB]
    sources:
      - url: https://about.netflix.com/en/news/update-on-sharing-may-us
        publisher: Netflix Newsroom
        kind: primary
        published: 2023-05-23
        archive: https://web.archive.org/web/20230523191832/https://about.netflix.com/en/news/update-on-sharing-may-us
        quote: >-
          Starting today, we will be sending this email to members who are sharing Netflix outside
          their household in the United States.
      - url: https://www.theverge.com/2023/5/23/23734725/netflix-password-sharing-us-pricing-streaming
        publisher: The Verge
        kind: press
        published: 2023-05-23
        archive: https://web.archive.org/web/20260104094428/https://www.theverge.com/2023/5/23/23734725/netflix-password-sharing-us-pricing-streaming
        quote: >-
          Netflix subscribers on its two cheapest plans (Basic or Standard with Ads, which cost $9.99
          and $6.99 per month, respectively) don't have the option to add extra members to their
          account at all.
      - url: https://help.netflix.com/en/node/24926/us
        publisher: Netflix Help Center
        kind: pricing-page
        published: 2023-05-31
        archive: https://web.archive.org/web/20230531053307/https://help.netflix.com/en/node/24926/us
        quote: >-
          Basic : $9.99 / month Standard : $15.49 / month ( extra member slots ** can be added for
          $7.99 each / month) Premium : $19.99 / month ( extra member slots ** can be added for $7.99
          each / month)
      - url: https://about.netflix.com/en/news/update-on-sharing-may-gb
        publisher: Netflix
        kind: primary
        published: 2023-05-23
        archive: https://web.archive.org/web/20230523204526/https://about.netflix.com/en/news/update-on-sharing-may-gb
