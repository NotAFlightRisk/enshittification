changes:
  - id: cloud-shutdown
    date: 2026-05-06
    date_kind: effective
    category: removed-feature
    title: Bose switches off the SoundTouch cloud, and with it the music services in its app
    question: When did Bose end support for SoundTouch?
    what_changed: >-
      Bose switched off the SoundTouch cloud on 6 May 2026, ending the music services built into the
      SoundTouch app and support for SoundTouch presets. Bose had announced it in October 2025 for
      18 February 2026, then moved the date and updated the app to keep what works without the
      cloud, such as setup, grouping and playback controls, alongside Bluetooth, AirPlay, Spotify
      Connect, AUX and, on soundbars, HDMI or optical. Stereo pairing for the SoundTouch 10, Alexa
      voice commands and software and security updates went too, and Bose published its technical specifications and API documentation for independent developers.
    before: Presets and music services played from the SoundTouch app
    after: A local app for setup, grouping and controls, with music sent from other apps
    user_impact: >-
      Owners of SoundTouch speakers and soundbars, a range Bose introduced in 2013, lost the music
      services in the SoundTouch app, Alexa and firmware updates, and could no longer change their
      presets (Bose says some may still play), so music services have to be played from their own apps.
      When it announced the shutdown, Bose offered a trade-in credit of up to $200.
    company_said: >-
      Bose said it was no longer able to sustain the development and support of the cloud
      infrastructure behind this older generation of products.
    severity: 3
    status: in-force
