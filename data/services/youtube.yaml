changes:
  - id: bumper-ads
    date: 2016-04-26
    date_kind: announced
    category: ads
    title: YouTube announces 6-second Bumper ads that can't be skipped
    what_changed: >-
      Google announced Bumper ads for YouTube on 26 April 2016, a 6-second video ad format that
      viewers can't skip. Advertisers could buy them from May 2016, as an extra to YouTube's longer
      ad formats rather than a replacement.
    user_impact: >-
      Viewers got a new kind of ad with no skip button, made for people watching on their phones.
    company_said: >-
      Google said people increasingly turn to their phones first to watch video, and it wanted ad
      formats that fit.
    severity: 1
    status: in-force
    related: [youtube/30-second-unskippable-tv-ads]
    sources:
      - url: https://adwords.blogspot.com/2016/04/bumper-ads-drive-incremental-reach-and-frequency.html
        publisher: Inside AdWords (Google)
        kind: primary
        published: 2016-04-26
        archive: https://web.archive.org/web/20160505053259/http://adwords.blogspot.com/2016/04/bumper-ads-drive-incremental-reach-and-frequency.html
        quote: >-
          That’s why today we’re announcing Bumper ads – a new six-second video format, sold through
          the AdWords auction on a CPM basis.
      - url: https://techcrunch.com/2016/04/26/youtube-bumper-ads/
        publisher: TechCrunch
        kind: press
        published: 2016-04-26
        archive: https://web.archive.org/web/20250319113011/https://techcrunch.com/2016/04/26/youtube-bumper-ads/
        quote: And since they’re so short, the Bumpers won’t be skippable.
    added: 2026-11-18
    updated: 2026-11-18
    sources_checked: 2026-11-18
    status_checked: 2026-11-23

  - id: dislike-count-hidden
    date: 2021-11-10
    date_kind: announced
    category: removed-feature
    title: YouTube hides the public dislike count
    question: When did YouTube hide dislikes?
    what_changed: >-
      YouTube started making dislike counts private across the site on 10 November 2021, after
      testing the change earlier that year. The dislike button stayed, and creators can still see
      their exact counts in YouTube Studio.
    before: Dislike count public on every video
    after: Only the video's creator sees it
    user_impact: >-
      Viewers lost the public count that some used to decide whether a video was worth watching.
    company_said: >-
      YouTube said hiding the count protects creators, smaller channels especially, from harassment
      and dislike attacks.
    severity: 2
    status: in-force
    sources:
      - url: https://blog.youtube/news-and-events/update-to-youtube/
        publisher: YouTube Official Blog
        kind: primary
        published: 2021-11-10
        archive: https://web.archive.org/web/20261111035613/https://blog.youtube/news-and-events/update-to-youtube/
        quote: >-
          We're making the dislike counts private across YouTube, but the dislike button is not
          going away.
    added: 2026-11-18
    updated: 2026-11-18
    sources_checked: 2026-11-18
    status_checked: 2026-11-23

  - id: premium-family-price-2022
    date: 2022-10-20
    date_kind: announced
    category: price-rise
    title: YouTube Premium Family goes from $17.99 to $22.99 in the US
    what_changed: >-
      YouTube raised Premium Family in the US from $17.99 to $22.99 a month on 20 October 2022,
      telling subscribers by email. New subscribers paid it straight away and existing ones from
      their first bill on or after 21 November 2022, while Individual stayed at $11.99. YouTube said
      prices were changing in Canada, the UK, Japan, Indonesia, Brazil, Turkey and Argentina too.
    before: $17.99 a month
    after: $22.99 a month
    user_impact: Households sharing a Premium plan paid $5 a month more, a 28% rise.
    company_said: >-
      YouTube said the new price reflects Premium's full value and will pay for new features and
      support creators and artists.
    severity: 2
    status: in-force
    regions: [US, CA, GB, JP, ID, BR, TR, AR]
    prices:
      - { plan: family-us, from: 17.99, to: 22.99 }
    sources:
      - url: https://9to5google.com/2022/10/20/youtube-premium-price-hike/
        publisher: 9to5Google
        kind: press
        published: 2022-10-20
        archive: https://web.archive.org/web/20221020195638/https://9to5google.com/2022/10/20/youtube-premium-price-hike/
        quote: >-
          To continue delivering great service and features, we will be increasing your Premium
          family plan price from $17.99/month to $22.99/month.
      - url: https://www.theverge.com/2022/10/20/23415258/youtube-premium-family-plan-price-increase-more-expensive-cost
        publisher: The Verge
        kind: press
        published: 2022-10-20
        archive: https://web.archive.org/web/20260530213413/https://www.theverge.com/2022/10/20/23415258/youtube-premium-family-plan-price-increase-more-expensive-cost
        quote: >-
          Prices will be “adjusted” in the US, Canada, Great Britain, Japan, Indonesia, Brazil,
          Turkey, and Argentina, YouTube spokesperson Marni Greenberg said in an email to The Verge.
    added: 2026-11-18
    updated: 2026-11-18
    sources_checked: 2026-11-18
    status_checked: 2026-11-23

  - id: 30-second-unskippable-tv-ads
    date: 2023-05-17
    date_kind: announced
    category: ads
    title: YouTube brings 30-second unskippable ads to TVs
    what_changed: >-
      YouTube said at Brandcast on 17 May 2023 that it would show 30-second ads that can't be
      skipped to people watching its most popular videos on TVs. They take the place of back-to-back
      15-second ads on YouTube Select, its ad package for top content, and YouTube said it would
      also start testing ads on paused videos.
    user_impact: >-
      Viewers without Premium watching popular videos on a TV got a 30-second ad they couldn't skip.
    company_said: >-
      YouTube told advertisers that longer ads suit the big screen and allow richer storytelling.
    severity: 1
    status: in-force
    related: [youtube/longer-unskippable-tv-ads]
    sources:
      - url: https://blog.youtube/news-and-events/brandcast-2023-highlights-trends/
        publisher: YouTube Official Blog
        kind: primary
        published: 2023-05-17
        archive: https://web.archive.org/web/20230518071857/https://blog.youtube/news-and-events/brandcast-2023-highlights-trends/
        quote: First, we’re bringing 30 second non-skips to YouTube Select on CTV.
      - url: https://www.theverge.com/2023/5/18/23728150/youtube-tv-unskippable-ads-premium-pause-commercial
        publisher: The Verge
        kind: press
        published: 2023-05-18
        archive: https://web.archive.org/web/20260908074921/https://www.theverge.com/2023/5/18/23728150/youtube-tv-unskippable-ads-premium-pause-commercial
        quote: >-
          YouTube says viewers will see a single 30-second ad instead of two consecutive 15-second
          ads, though that doesn’t mean that those shorter ads will be disappearing entirely.
    added: 2026-11-18
    updated: 2026-11-19
    sources_checked: 2026-11-18
    status_checked: 2026-11-23

  - id: premium-price-2023
    date: 2023-07-19
    date_kind: reported
    category: price-rise
    title: YouTube Premium goes from $11.99 to $13.99 in the US
    what_changed: >-
      YouTube Premium's US price went from $11.99 to $13.99 a month, first reported on 19 July 2023
      after YouTube changed its signup page without an announcement. The annual plan went up by $20
      to $139.99 and Music Premium from $9.99 to $10.99. Most existing members paid more from their
      next billing cycle, and legacy $9.99 YouTube Red subscribers after a grace period at their old
      rate.
    before: $11.99 a month
    after: $13.99 a month
    user_impact: >-
      Individual members paid $2 a month more, the first rise for that plan since YouTube Red became
      YouTube Premium in 2018.
    company_said: >-
      YouTube said the new price would let it keep delivering great service and features, and
      reflected Premium's value.
    severity: 1
    status: in-force
    regions: [US]
    prices:
      - { plan: individual-us, from: 11.99, to: 13.99 }
      - { plan: music-premium-us, from: 9.99, to: 10.99 }
    sources:
      - url: https://9to5google.com/2023/07/19/youtube-premium-price-increase/
        publisher: 9to5Google
        kind: press
        published: 2023-07-19
        archive: https://web.archive.org/web/20230720051135/https://9to5google.com/2023/07/19/youtube-premium-price-increase/
        quote: >-
          The price of an individual YouTube Premium subscription is increasing by $2 to $13.99 per
          month in the US.
      - url: https://www.theverge.com/2023/7/20/23801390/youtube-premium-music-price-increase
        publisher: The Verge
        kind: press
        published: 2023-07-20
        archive: https://web.archive.org/web/20230720191054/https://www.theverge.com/2023/7/20/23801390/youtube-premium-music-price-increase
        quote: >-
          We’re updating the price for YouTube Premium and YouTube Music Premium subscribers in the
          US to continue delivering great service and features
    added: 2026-11-18
    updated: 2026-11-19
    sources_checked: 2026-11-18
    status_checked: 2026-11-23

  - id: premium-lite-europe-dropped
    date: 2023-09-25
    date_kind: reported
    effective: 2023-10-26
    category: removed-feature
    title: YouTube drops Premium Lite, its €6.99 ad-free plan in 7 European countries
    what_changed: >-
      YouTube emailed Premium Lite subscribers in September 2023 to say it would stop offering the
      €6.99 a month plan after 25 October 2023. Lite had been on trial since 2021 in Belgium,
      Denmark, Finland, Luxembourg, the Netherlands, Norway and Sweden, with ad-free videos but no
      downloads or background play.
    before: Ad-free for €6.99 a month
    after: Full Premium, or ads
    user_impact: >-
      Lite subscribers had to pay for full Premium, which costs more and bundles YouTube Music, or
      go back to watching ads.
    severity: 2
    status: reversed
    reversed:
      date: 2026-08
      what: >-
        YouTube said in August 2026 that it was expanding Premium Lite to all countries where
        Premium is available, and by late August its help page listed the newer Lite plan in
        Belgium, Denmark, Finland, Luxembourg, the Netherlands, Norway and Sweden. It isn't the old
        plan, though: the new Lite makes most videos ad-free, not all of them.
      sources:
        - url: https://9to5google.com/2026/08/10/youtube-premium-lite-expansion-monetization-changes/
          publisher: 9to5Google
          kind: press
          published: 2026-08-10
          archive: https://web.archive.org/web/20261013093201/https://9to5google.com/2026/08/10/youtube-premium-lite-expansion-monetization-changes/
          quote: We are expanding Premium Lite to all countries where Premium is available.
        - url: https://support.google.com/youtube/answer/6307365?hl=en
          publisher: YouTube Help
          kind: primary
          published: 2026-08-26
          archive: https://web.archive.org/web/20260826192949/https://support.google.com/youtube/answer/6307365?hl=en
          quote: >-
            Premium Lite memberships available locations Algeria Argentina Australia Austria
            Bangladesh Belarus Belgium
        - url: https://blog.youtube/news-and-events/introducing-premium-lite/
          publisher: YouTube Official Blog
          kind: primary
          published: 2025-03-05
          archive: https://web.archive.org/web/20261117143854/https://blog.youtube/news-and-events/introducing-premium-lite/
          quote: >-
            Premium Lite gives viewers a new, more affordable way to enjoy most videos on YouTube
            ad-free
    regions: [BE, DK, FI, LU, NL, NO, SE]
    sources:
      - url: https://9to5google.com/2023/09/25/youtube-premium-lite-shut-down/
        publisher: 9to5Google
        kind: press
        published: 2023-09-25
        archive: https://web.archive.org/web/20230926084112/https://9to5google.com/2023/09/25/youtube-premium-lite-shut-down/
        quote: >-
          We’re writing to let you know that after 25 October 2023, we will no longer be offering
          your version of Premium Lite.
      - url: https://www.theverge.com/2023/9/25/23889917/youtube-premium-lite-subscription-discontinued-retired
        publisher: The Verge
        kind: press
        published: 2023-09-25
        archive: https://web.archive.org/web/20230925223752/https://www.theverge.com/2023/9/25/23889917/youtube-premium-lite-subscription-discontinued-retired
        quote: >-
          At €6.99 per month, YouTube’s Premium Lite plan first launched in select European
          countries in 2021
    added: 2026-11-20
    updated: 2026-11-26
    sources_checked: 2026-11-20
    status_checked: 2026-11-26

  - id: ad-blocker-crackdown
    date: 2023-10-31
    date_kind: announced
    category: ads
    title: YouTube starts blocking videos for people using ad blockers worldwide
    question: When did YouTube start blocking ad blockers?
    what_changed: >-
      YouTube confirmed on 31 October 2023 that it had launched a global effort against ad blockers,
      after calling a June 2023 version a small experiment. Viewers using one were told to allow ads
      or try Premium, and some found videos wouldn't play until they did.
    user_impact: >-
      People using an ad blocker on YouTube had to allow ads or pay for Premium to keep watching.
    company_said: >-
      YouTube said ad blockers break its terms of service, and that ads support creators and let
      billions of people watch.
    severity: 3
    status: in-force
    sources:
      - url: https://www.theverge.com/2023/10/31/23940583/youtube-ad-blocker-crackdown-broadening
        publisher: The Verge
        kind: press
        published: 2023-10-31
        archive: https://web.archive.org/web/20260908194741/https://www.theverge.com/2023/10/31/23940583/youtube-ad-blocker-crackdown-broadening
        quote: >-
          The platform has “launched a global effort” to encourage users to allow ads or try YouTube
          Premium, YouTube communications manager Christopher Lawton says in a statement provided to
          The Verge.
    added: 2026-11-18
    updated: 2026-11-19
    sources_checked: 2026-11-18
    status_checked: 2026-11-23

  - id: longer-unskippable-tv-ads
    date: 2024-09
    date_kind: effective
    category: ads
    title: YouTube starts showing longer unskippable ads on TVs
    what_changed: >-
      YouTube started showing more, and longer, unskippable ads on TVs at the start of September
      2024, along with ads on paused videos. Most were 30-second ads in place of back-to-back
      15-second ones, and a source told Tubefilter that YouTube was also offering advertisers
      60-second unskippable ads for TVs.
    user_impact: Viewers without Premium watching on a TV got longer ad breaks they couldn't skip.
    company_said: >-
      YouTube said its data showed 79% of viewers would rather sit through one longer ad break than
      several shorter ones.
    severity: 1
    status: in-force
    related: [youtube/30-second-unskippable-tv-ads]
    sources:
      - url: https://www.tubefilter.com/2024/09/26/youtube-longer-unskippable-ads/
        publisher: Tubefilter
        kind: press
        published: 2024-09-26
        archive: https://web.archive.org/web/20250926014133/https://www.tubefilter.com/2024/09/26/youtube-longer-unskippable-ads/
        quote: >-
          So, we reached out to YouTube, which confirms more unskippable ad formats debuted
          alongside pause-vertising at the beginning of September.
    added: 2026-11-18
    updated: 2026-11-19
    sources_checked: 2026-11-18
    status_checked: 2026-11-23

  - id: family-plan-household-pauses
    date: 2025-09-02
    date_kind: reported
    category: lock-out
    title: YouTube starts pausing Premium Family members it can't confirm live with the manager
    what_changed: >-
      YouTube started warning some Premium Family members in September 2025 that their Premium would
      be paused in 14 days. It said it appeared they may not be in the same household as the plan's
      manager. Its help page already said members must live at the manager's address, which
      TechRadar said YouTube hadn't been strict about until then, and later added that the pause
      alert means YouTube can't confirm you're in the same household.
    user_impact: >-
      Members YouTube flagged keep their place in the family group but lose Premium and go back to
      watching with ads.
    severity: 2
    status: in-force
    related: [netflix/paid-sharing, disney-plus/paid-sharing]
    sources:
      - url: https://support.google.com/youtubemusic/answer/7507349
        publisher: YouTube Help
        kind: primary
        published: 2026-03-02
        archive: https://web.archive.org/web/20260302051541/https://support.google.com/youtubemusic/answer/7507349
        quote: >-
          Tip: If you see an alert in the YouTube app informing you that your Premium access will be
          paused, it is because we cannot confirm that you are in the same household as your family
          manager.
      - url: https://www.techradar.com/computing/software/youtube-has-started-flagging-premium-family-members-who-live-at-different-addresses-just-like-netflixs-password-sharing-crackdown
        publisher: TechRadar
        kind: press
        published: 2025-09-02
        archive: https://web.archive.org/web/20260715173814/https://www.techradar.com/computing/software/youtube-has-started-flagging-premium-family-members-who-live-at-different-addresses-just-like-netflixs-password-sharing-crackdown
        quote: >-
          The email says "your YouTube Premium Family membership will be paused", and warns users
          that they will lose Premium access after 14 days, after which they will only have access
          to ad-supported content.
      - url: https://www.droid-life.com/2025/09/02/youtube-enforcing-family-plan-rules/
        publisher: Droid Life
        kind: press
        published: 2025-09-02
        archive: https://web.archive.org/web/20260710072453/https://www.droid-life.com/2025/09/02/youtube-enforcing-family-plan-rules/
        quote: >-
          Once your access is paused, you will remain in your family group and be able to watch
          YouTube with ads, but will no longer have YouTube Premium benefits.
      - url: https://support.google.com/youtubemusic/answer/7507349
        publisher: YouTube Help
        kind: primary
        published: 2025-04-21
        archive: https://web.archive.org/web/20250421001231/https://support.google.com/youtubemusic/answer/7507349
        quote: Live within the same residential address as the family manager.
    added: 2026-11-20
    updated: 2026-11-20
    sources_checked: 2026-11-20
    status_checked: 2026-11-20

  - id: premium-price-2026
