    date_kind: reported
    category: price-rise
    title: YouTube Premium goes from $13.99 to $15.99 in the US, and every plan rises
    what_changed: >-
      YouTube Premium Individual went from $13.99 to $15.99 a month in the US, reported on 10 April
      2026 as the new prices went live for new subscribers. Family went from $22.99 to $26.99, Lite
      from $7.99 to $8.99 and Music Premium from $10.99 to $11.99, and existing subscribers pay the
      new price from their June 2026 billing date.
    before: $13.99 a month
    after: $15.99 a month
    user_impact: Families sharing a plan got the biggest rise, $4 a month.
    company_said: >-
      Google's email to subscribers said the rise would let it keep improving Premium and support
      the creators and artists they watch.
    severity: 1
    status: in-force
    regions: [US]
    prices:
