changes:
  - id: authorization-control
    date: 2025-03-12
    date_kind: effective
    category: api-restriction
    title: Bambu Lab firmware stops unauthorised software controlling its printers directly
    what_changed: >-
      Bambu Lab's X1 firmware dated 12 March 2025 made its printers reject control commands from
      software it hadn't authorised, as it announced on 16 January. Starting prints, moving the
      axes, calibrating and binding then needed authorised software or its new Bambu Connect, Home
      Assistant could only read some printer information, and Panda Touch's control functions
      stopped working. After feedback from print farm owners it added an optional Developer Mode
      that turns the check off, but only in LAN mode, and the P1 and A1 firmware with the change is
      dated 3 June 2025.
    before: OrcaSlicer, Home Assistant and Panda Touch could send control commands to the printer
    after: Authorised software or Bambu Connect only, unless the printer is in LAN-only Developer Mode
    user_impact: >-
      Owners who updated, which Bambu said during the beta wasn't forced, could no longer control
      their printers from Home Assistant, Panda Touch and other unauthorised tools unless they
      switched to Developer Mode, which needs LAN mode, where the Bambu Handy app isn't available.
    company_said: >-
      Bambu Lab said it was a security measure against remote hacks, that unauthorised requests to
      its cloud, at peaks of 30 million a day, were straining its infrastructure, and that Bambu
      Connect would keep third-party integration going.
    severity: 3
    status: in-force
