changes:
  - id: cloud-shutdown
    date: 2022-04
    date_kind: effective
    category: bricked
    title: Insteon's servers go offline without notice, and the Insteon Hub app stops working
    question: What happened to Insteon?
    what_changed: >-
      Insteon's servers went offline without notice to customers in April 2022, and the Insteon Hub
      app stopped working. Its owner Smartlabs said days later that a sale had fallen through and
      it had been assigned to a financial services firm in March. A group of Insteon users bought
      it, most hubs had begun coming back online by 9 June 2022, and from 15 June it charged $39.95
      a year for app access.
    user_impact: >-
      Insteon Hub owners lost the app and the automation and scheduling that ran through it, though
      physical switches and buttons on Insteon devices kept working.
    company_said: >-
      Smartlabs said supply chain disruption from the pandemic had proved incredibly difficult, and
      that a sale it expected had fallen through.
    severity: 4
    status: reversed
    reversed:
      date: 2022-06-09
      what: >-
        A group of Insteon users bought the company and began bringing the hubs back online, though
        not every function was back at first. From 15 June 2022 it charged $39.95 a year for Hub
        service, covering app access and notifications, with Alexa and Google Assistant to follow.
