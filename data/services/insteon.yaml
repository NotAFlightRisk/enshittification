  - id: hub-subscription
    date: 2022-08-01
    date_kind: effective
    category: paywall
    title: Insteon charges $39.95 a year to use the Insteon Hub app, which had no monthly fees
    question: When did Insteon start charging a subscription?
    what_changed: >-
      Insteon began making Hub owners pay $39.95 a year to keep using the Insteon Hub app after a 1
      August 2022 deadline, rolling it out slowly. It came with the revival by the users who bought
      the company in June, and the app's listing had advertised "no monthly fees". Without a
      subscription the app blocks new logins, and email and push alerts and Alexa and Google
      Assistant stop working.
    before: The Insteon Hub app, with no monthly fees
    after: $39.95 a year, or $69.95 for 2 years at first, or no new app logins
    user_impact: >-
      Insteon Hub owners had to pay to keep using the app, alerts and voice control, though
      Insteon's page today says devices can still be linked and set up by hand without a Hub.
    severity: 3
    status: in-force
    related: [insteon/cloud-shutdown, wink/subscription-required]
    sources:
      - url: https://www.insteon.com/blog/2022/6/9/frequently-asked-questions-addressed
        publisher: Insteon
        kind: primary
        published: 2022-06-18
        archive: https://web.archive.org/web/20230114021203/https://www.insteon.com/blog/2022/6/9/frequently-asked-questions-addressed
        quote: >-
          August 1st was the deadline to purchase a subscription. We have begun enforcing the subscription but it’s being rolled out slowly.
      - url: https://www.insteon.com/blog/2022/6/9/subscription-letter
        publisher: Insteon
        kind: primary
        published: 2022-06-15
        archive: https://web.archive.org/web/20220615174627/https://www.insteon.com/blog/2022/6/9/subscription-letter
        quote: >-
          1-Year Access 39.95 every 12 months Purchase 1 year of Insteon Hub service. Provides mobile app access to Insteon Hub, email and push notifications, voice assistant integrations (Amazon Alexa and Google Assistant), and more.
