changes:
  - id: shutdown
    date: 2021-05-04
    date_kind: effective
    category: removed-feature
    title: Yahoo shuts down Yahoo Answers
    question: When did Yahoo Answers shut down?
    what_changed: >-
      Yahoo shut down Yahoo Answers on 4 May 2021, having announced it on 5 April 2021. New
      questions and answers stopped on 20 April, and from 4 May the site was no longer accessible.
      People could request a download of their own questions, answers and images until 30 June 2021,
      but not anyone else's.
    before: A question and answer site, running since 2005
    after: Site no longer accessible, with a download of your own posts until 30 June 2021
    user_impact: >-
      People who asked and answered questions on Yahoo Answers lost the site, and could keep only a
      download of their own questions, answers and images if they asked for it by 30 June 2021,
      after which Yahoo said their data would be deleted. Posted questions and answers were no
      longer viewable on Yahoo Answers.
    company_said: >-
      Yahoo said Yahoo Answers had declined in popularity as the needs of its members changed, so it
      was shifting resources away from it to products that better served them.
    severity: 4
    status: in-force
    related: [yahoo-groups/shutdown]
