  - id: free-50-notes
    date: 2023-11-29
    date_kind: announced
    effective: 2023-12-04
    category: paywall
    title: Evernote limits free accounts to 50 notes and 1 notebook
    question: When did Evernote limit free accounts to 50 notes?
    what_changed: >-
      Evernote said on 29 November 2023 that from 4 December, new and existing free users could
      have at most 50 notes and 1 notebook. Free users already over the limit could still view,
      edit, export, share and delete what they had, but not add more without paying.
    after: 50 notes and 1 notebook
    user_impact: >-
      Free users with more than 50 notes or a second notebook couldn't add notes without deleting
      old ones or paying for Personal at $14.99 a month.
    company_said: >-
      Evernote said the majority of its free users fell below the new limits, so most would see no
      change day to day.
    severity: 2
    status: in-force
    related: [evernote/price-2023]
    sources:
      - url: https://evernote.com/blog/evernote-free-note-limits
        publisher: Evernote
        kind: primary
        published: 2023-11-29
        archive: https://web.archive.org/web/20261103025405/https://evernote.com/blog/evernote-free-note-limits
        quote: >-
          From December 4, the Evernote Free experience is changing. Going forward, new and existing
          Free users will have a maximum of fifty notes and one notebook per account.
      - url: https://evernote.com/blog/evernote-free-note-limits
        publisher: Evernote
        kind: primary
        published: 2023-11-29
        archive: https://web.archive.org/web/20261103025405/https://evernote.com/blog/evernote-free-note-limits
        quote: >-
          any Free user who currently has more than fifty notes and one notebook will still be able
          to view, edit, export, share, and delete existing notes and notebooks.
      - url: https://evernote.com/blog/evernote-free-note-limits
        publisher: Evernote
        kind: primary
        published: 2023-11-29
        archive: https://web.archive.org/web/20261103025405/https://evernote.com/blog/evernote-free-note-limits
        quote: >-
          When setting the new limits, we considered that the majority of our Free users fall below
          the threshold of fifty notes and one notebook.
      - url: https://techcrunch.com/2023/11/29/its-official-evernote-will-restrict-free-users-to-50-notes/
        publisher: TechCrunch
        kind: press
        published: 2023-11-29
        archive: https://web.archive.org/web/20260125174151/https://techcrunch.com/2023/11/29/its-official-evernote-will-restrict-free-users-to-50-notes/
        quote: >-
          The test was trying to get people to pay the higher limit plans, which are priced at $14.99
          and $17.99 per month.
    added: 2026-11-21
    updated: 2026-11-21
    sources_checked: 2026-11-21
    status_checked: 2026-11-21

  - id: advanced-migration-2025
    date: 2025-07
    date_kind: effective
    category: price-rise
    title: Evernote retires Personal and moves its subscribers to Advanced at $24.99 a month
    what_changed: >-
      From July 2025, Evernote retired Personal and Professional and moved their subscribers to its
      new Advanced plan at renewal, $24.99 a month or $249.99 a year. App store prices could differ,
      and Personal had gone to $14.99 a month or $129.99 a year in 2023. The new Starter plan, $14.99 a month or $99.00 a year, is capped at 1,000
      notes, 20 notebooks and 3 synced devices, and subscribers had to switch to it themselves.
    before: $14.99 a month
    after: $24.99 a month
    user_impact: >-
      Personal subscribers billed by Evernote paid $24.99 a month from their next renewal unless they
      cancelled or moved themselves down to Starter and its note, notebook and device limits.
    company_said: >-
      Evernote said it retired Personal and Professional to offer a more flexible structure aligned
      with current user needs.
    severity: 2
    status: in-force
    related: [evernote/price-2023]
