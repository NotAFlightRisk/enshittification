changes:
  - id: premium-price-2015
    date: 2015-04-29
    date_kind: announced
    category: price-rise
    title: Evernote Premium goes from $5 to $5.99 a month
    what_changed: >-
      Evernote said on 29 April 2015 that Premium would cost $5.99 a month or $49.99 a year,
      alongside a new $2.99 Plus tier. Existing subscribers whose price went up kept their rate
      until their first renewal after 29 April 2016.
    before: $5 a month
    after: $5.99 a month
    user_impact: >-
      New Premium subscribers paid more straight away, and existing ones from their first
      renewal a year later.
    severity: 1
    status: in-force
    regions: [US]
    related: [evernote/price-2016]
    sources:
      - url: https://blog.evernote.com/blog/2015/04/29/introducing-evernote-plus-and-the-new-evernote-premium/
        publisher: Evernote
        kind: primary
        published: 2015-04-29
        archive: https://web.archive.org/web/20170706155447/https://blog.evernote.com/blog/2015/04/29/introducing-evernote-plus-and-the-new-evernote-premium/
        quote: >-
          If you’re currently paying and the price of Premium went up in your region, then we’ve
          locked you into your rate for a year, or more. As long as you continue in your current
          plan, your price will adjust at your first renewal after April 29, 2016.
      - url: https://blog.evernote.com/blog/2015/04/29/introducing-evernote-plus-and-the-new-evernote-premium/
        publisher: Evernote
        kind: primary
        published: 2015-04-29
        archive: https://web.archive.org/web/20170706155447/https://blog.evernote.com/blog/2015/04/29/introducing-evernote-plus-and-the-new-evernote-premium/
        quote: Go Premium for $5.99 per month or $49.99 per year.
      - url: https://techcrunch.com/2015/04/29/evernotes-new-pricing-includes-a-cheaper-middle-tier-and-a-pricier-top-plan/
        publisher: TechCrunch
        kind: press
        published: 2015-04-29
        archive: https://web.archive.org/web/20250804125639/https://techcrunch.com/2015/04/29/evernotes-new-pricing-includes-a-cheaper-middle-tier-and-a-pricier-top-plan/
        quote: >-
          the full-featured premium plan, which is now $5.99 per month, up from the earlier $5 per
          month.
    added: 2026-11-21
    updated: 2026-11-21
    sources_checked: 2026-11-21
    status_checked: 2026-11-21

  - id: price-2016
    date: 2016-06-28
    date_kind: announced
    category: price-rise
    title: Evernote Premium goes from $5.99 to $7.99 a month, and Plus from $2.99 to $3.99
    what_changed: >-
      Evernote said on 28 June 2016 that new Premium subscriptions would cost $7.99 a month or
      $69.99 a year, and Plus $3.99 a month or $34.99 a year. Existing subscribers were given some
      time before the new prices reached them.
    before: $5.99 a month
    after: $7.99 a month
    user_impact: New Plus and Premium subscribers paid about a third more a month.
    company_said: >-
      Evernote said it was asking the people who get the most value from Evernote to help pay for
      improving its core products.
    severity: 2
    status: in-force
    regions: [US]
    related: [evernote/basic-two-devices]
    sources:
