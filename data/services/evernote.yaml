  - id: basic-two-devices
    date: 2016-06-28
    date_kind: announced
    category: paywall
    title: Evernote limits its free Basic plan to 2 devices
    question: When did Evernote limit free accounts to two devices?
    what_changed: >-
      Evernote said on 28 June 2016 that free Basic accounts would only sync notes to 2 devices,
      such as a computer and a phone. The web version didn't count as a device, and syncing more
      meant paying for Plus or Premium.
    after: Basic on 2 devices, plus the web
    user_impact: >-
      Free users who kept their notes on more than 2 phones, tablets or computers had to pick 2 or
      start paying.
    severity: 2
    status: in-force
    related: [evernote/price-2016]
    sources:
      - url: https://blog.evernote.com/blog/2016/06/28/changes-to-evernotes-pricing-plans/
        publisher: Evernote
        kind: primary
        published: 2016-06-28
        archive: https://web.archive.org/web/20180604033109/https://blog.evernote.com/blog/2016/06/28/changes-to-evernotes-pricing-plans/
        quote: >-
          On Basic, you can access notes on up to two devices, such as a computer and phone, two
          computers, or a phone and a tablet, as well as on the web, so you can continue to take
          your notes with you throughout your day.
      - url: https://blog.evernote.com/blog/2016/06/28/changes-to-evernotes-pricing-plans/
        publisher: Evernote
        kind: primary
        published: 2016-06-28
        archive: https://web.archive.org/web/20180604033109/https://blog.evernote.com/blog/2016/06/28/changes-to-evernotes-pricing-plans/
        quote: >-
          To stay in sync across all your devices, consider Evernote Plus.
      - url: https://blog.evernote.com/blog/2016/06/28/changes-to-evernotes-pricing-plans/
        publisher: Evernote
        kind: primary
        published: 2016-06-28
        archive: https://web.archive.org/web/20180604033109/https://blog.evernote.com/blog/2016/06/28/changes-to-evernotes-pricing-plans/
        quote: >-
          You can access Evernote via the web browser from as many computers as you like, even on a
          Basic account.
    added: 2026-11-21
    updated: 2026-11-21
    sources_checked: 2026-11-21
    status_checked: 2026-11-21

  - id: price-2023
    date: 2023-04-28
    date_kind: announced
    effective: 2023-05-01
    category: price-rise
    title: Evernote Personal goes from $7.99 to $14.99 a month
    what_changed: >-
      Evernote said on 28 April 2023 that Personal would go to $14.99 a month or $129.99 a year,
      and Professional to $17.99 or $169.99. New subscribers paid it from 1 May, and existing ones at
      renewals from the end of May, with 28 days' notice.
    before: $7.99 a month
    after: $14.99 a month
    user_impact: >-
      Most Personal subscribers paid nearly double, new ones from 1 May 2023 and existing ones at
      renewals from the end of May.
    company_said: >-
      Evernote said raising prices let it ramp up work on its infrastructure and product
      development.
    severity: 2
    status: in-force
    related: [evernote/free-50-notes]
    sources:
