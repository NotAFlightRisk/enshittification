        quote: >-
          The new prices are effective starting May 1 for new subscribers and starting end of May
          for existing subscribers. We’re notifying all customers who are impacted 28 days before
          their renewal date.
      - url: https://evernote.com/blog/evernote-pricing-upcoming-features-update
