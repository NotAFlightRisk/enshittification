        quote: >-
          Beginning today, the prices for our Plus and Premium tiers will change for new
          subscriptions, and access from Evernote Basic accounts will be limited to two devices
      - url: https://blog.evernote.com/blog/2016/06/28/changes-to-evernotes-pricing-plans/
