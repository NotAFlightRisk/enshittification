changes:
  - id: subscription-required
    date: 2020-05-06
    date_kind: announced
    category: paywall
    title: Wink charges hub owners $4.99 a month to keep cloud control and automations
    what_changed: >-
      Wink said on 6 May 2020 that hub owners would have to pay $4.99 a month from 13 May, or lose
      app, voice and API control and have their automations disabled. It pushed the start back to
      20 May, then indefinitely, and said on 8 July that subscriptions would begin on 27 July 2020,
      with local control of some devices kept for people who didn't pay.
    before: Cloud, voice and API control and automations included with the hub
    after: $4.99 a month, or local control of some devices only
    user_impact: >-
      Wink Hub and Relay owners who didn't subscribe would lose cloud, voice and API control,
      third-party integrations and their automations, and couldn't add new devices or update the
      firmware, keeping local control of only some devices.
    company_said: >-
      Wink said it had relied solely on the one-time fee from hardware sales to cover cloud costs,
      development and support, and that long term costs and recent economic events had strained its
      business.
    severity: 3
    status: in-force
    sources:
