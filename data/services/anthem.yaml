changes:
  - id: servers-shutdown
    date: 2026-01-12
    date_kind: effective
    category: bricked
    title: EA shuts down Anthem's servers, and the online-only game can no longer be played
    question: When did Anthem shut down?
    what_changed: >-
      EA shut down Anthem's servers on 12 January 2026, and the online-only game can no longer be
      played by anyone who owns it. EA announced it on 3 July 2025, when it also stopped selling the
      game's premium currency, and said Anthem had no offline mode to fall back on.
    user_impact: >-
      Owners lost the ability to play Anthem.
    severity: 5
    status: in-force
    sources:
      - url: https://www.ea.com/games/anthem/news/anthem-game-update
        publisher: EA
        kind: primary
        published: 2025-07-03
        archive: https://web.archive.org/web/20250703185925/https://www.ea.com/games/anthem/news/anthem-game-update
        quote: >-
          After careful consideration, we will be sunsetting Anthem on January 12, 2026.
      - url: https://www.ea.com/games/anthem/news/anthem-game-update
        publisher: EA
        kind: primary
