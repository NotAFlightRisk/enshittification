  - id: price-2025
    date: 2025-07-17
    date_kind: announced
    effective: 2025-07-23
    category: price-rise
    title: Peacock Premium goes from $7.99 to $10.99 a month, and Premium Plus to $16.99
    what_changed: >-
      Peacock said on 17 July 2025 that US Premium would go up by $3 to $10.99 a month and Premium
      Plus by $3 to $16.99. New and returning customers paid it from 23 July and current
      subscribers from their next bill on or after 22 August, and Peacock started testing a cheaper
      Select tier at $7.99.
