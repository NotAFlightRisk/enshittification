changes:
  - id: free-tier-new-customers
    date: 2023-01-30
    date_kind: effective
    category: paywall
    title: Peacock stops offering its free tier to new customers
    what_changed: >-
      Peacock stopped offering its free, ad-supported tier to new customers on 30 January 2023.
      New sign-ups had to pay for Premium at $4.99 a month or Premium Plus at $9.99, while existing
      free users kept it, as did paying subscribers who stepped down.
    before: Free with ads for a limited selection of content
    after: $4.99 a month for new customers
    user_impact: >-
      New customers could no longer watch Peacock for free, though existing free accounts kept the
      free tier.
    company_said: >-
      An NBCUniversal source told The Streamable the change would let Peacock better focus on its
      Premium membership offerings.
    severity: 2
    status: in-force
    regions: [US]
    sources:
      - url: https://www.theverge.com/2023/2/1/23581014/peacock-free-membership-new-customers-nbcuniversal-comcast
        publisher: The Verge
        kind: press
        published: 2023-02-01
        archive: https://web.archive.org/web/20230201160446/https://www.theverge.com/2023/2/1/23581014/peacock-free-membership-new-customers-nbcuniversal-comcast
        quote: >-
          As of January 30th, new Peacock customers will now need to subscribe to the Premium plan
          ($4.99 / month) with ads or Premium Plus ($9.99 / month) without ads to access content on
          the platform, as first reported by The Streamable.
      - url: https://www.theverge.com/2023/2/1/23581014/peacock-free-membership-new-customers-nbcuniversal-comcast
        publisher: The Verge
        kind: press
        published: 2023-02-01
        archive: https://web.archive.org/web/20230201160446/https://www.theverge.com/2023/2/1/23581014/peacock-free-membership-new-customers-nbcuniversal-comcast
        quote: >-
          The free membership was supported by ads and gave users access to a limited selection of
          Peacock content. Existing users will continue to have access to the free tier of Peacock,
          as will Premium Peacock subscribers who want to step down from their current paid
          membership.
      - url: https://www.theverge.com/2023/2/1/23581014/peacock-free-membership-new-customers-nbcuniversal-comcast
        publisher: The Verge
        kind: press
        published: 2023-02-01
        archive: https://web.archive.org/web/20230201160446/https://www.theverge.com/2023/2/1/23581014/peacock-free-membership-new-customers-nbcuniversal-comcast
        quote: >-
          said that the membership change would allow Peacock to better focus on its Premium
          membership offerings, which the company feels is the best way for customers to experience
          the service.
    added: 2026-11-23
    updated: 2026-11-23
    sources_checked: 2026-11-23
    status_checked: 2026-11-24

  - id: xfinity-free-premium-end
    date: 2023-02-12
    date_kind: announced
    effective: 2023-06-26
    category: paywall
    title: Xfinity customers lose the Peacock Premium they got at no extra cost
    what_changed: >-
      NBCUniversal confirmed in February 2023 that Xfinity subscribers would lose free Peacock
      Premium on 26 June 2023, which they'd had since its 2020 launch. New Xfinity customers stopped
      getting it from 3 April and got a free trial instead, and Xfinity said it would offer a
      discounted version.
    before: Peacock Premium at no extra cost with Xfinity
    after: Pay for Premium, normally $4.99 a month, or a discounted Xfinity add-on
    user_impact: >-
      Xfinity customers who watched Peacock Premium as part of their package had to pay to keep it,
      as Cox customers already had to since January.
    severity: 2
    status: in-force
    regions: [US]
    sources:
      - url: https://www.theverge.com/2023/2/12/23596786/xfinity-subscribers-peacock-nbcuniversal-comcast
        publisher: The Verge
        kind: press
        published: 2023-02-12
        archive: https://web.archive.org/web/20230212231704/https://www.theverge.com/2023/2/12/23596786/xfinity-subscribers-peacock-nbcuniversal-comcast
        quote: >-
          In a post on Twitter, the Comcast-owned NBCUniversal confirmed plans to stop offering
          free access to Peacock Premium to Xfinity subscribers on June 26th, 2023 (via Variety).
      - url: https://www.theverge.com/2023/2/12/23596786/xfinity-subscribers-peacock-nbcuniversal-comcast
        publisher: The Verge
        kind: press
        published: 2023-02-12
        archive: https://web.archive.org/web/20230212231704/https://www.theverge.com/2023/2/12/23596786/xfinity-subscribers-peacock-nbcuniversal-comcast
        quote: >-
          Peacock Premium, which normally costs $4.99 per month, is an ad-supported plan that has
          been available to Xfinity customers at no extra cost since the service first launched in
          2020.
      - url: https://www.theverge.com/2023/2/12/23596786/xfinity-subscribers-peacock-nbcuniversal-comcast
        publisher: The Verge
        kind: press
        published: 2023-02-12
        archive: https://web.archive.org/web/20230212231704/https://www.theverge.com/2023/2/12/23596786/xfinity-subscribers-peacock-nbcuniversal-comcast
        quote: >-
          The company will also stop offering free Peacock Premium to new Xfinity customers
          starting on April 3rd, and will only provide free, six-month trials going forward.
      - url: https://www.theverge.com/2023/2/12/23596786/xfinity-subscribers-peacock-nbcuniversal-comcast
        publisher: The Verge
        kind: press
        published: 2023-02-12
        archive: https://web.archive.org/web/20230212231704/https://www.theverge.com/2023/2/12/23596786/xfinity-subscribers-peacock-nbcuniversal-comcast
        quote: >-
          As part of the change, Xfinity will start offering a discounted version of Peacock to
          Xfinity subscribers in place of the free subscription.
      - url: https://www.theverge.com/2023/2/12/23596786/xfinity-subscribers-peacock-nbcuniversal-comcast
        publisher: The Verge
        kind: press
        published: 2023-02-12
        archive: https://web.archive.org/web/20230212231704/https://www.theverge.com/2023/2/12/23596786/xfinity-subscribers-peacock-nbcuniversal-comcast
        quote: >-
          The company also ended its agreement with Cox internet and cable customers in January,
          requiring them to pay up for Peacock Premium as well.
    added: 2026-11-23
    updated: 2026-11-23
    sources_checked: 2026-11-23
    status_checked: 2023-02-12

  - id: price-2023
    date: 2023-07-17
    date_kind: announced
    category: price-rise
    title: Peacock Premium goes from $4.99 to $5.99 a month, its first US rise
    what_changed: >-
      Peacock said on 17 July 2023 that US Premium would go from $4.99 to $5.99 a month and Premium
      Plus from $9.99 to $11.99, its first price rise. New customers paid it straight away and
      existing customers from 17 August.
    before: $4.99 a month (Premium)
    after: $5.99 a month (Premium)
    user_impact: US Premium subscribers paid $1 more a month and Premium Plus subscribers $2 more.
    severity: 1
    status: in-force
    regions: [US]
    prices:
      - { plan: premium-us, from: 4.99, to: 5.99 }
      - { plan: premium-plus-us, from: 9.99, to: 11.99 }
    sources:
      - url: https://www.theverge.com/2023/7/17/23798373/peacock-premium-plus-prices-up-raise
        publisher: The Verge
        kind: press
        published: 2023-07-17
        archive: https://web.archive.org/web/20230718024228/https://www.theverge.com/2023/7/17/23798373/peacock-premium-plus-prices-up-raise
        quote: >-
          effective August 17th, with the cheaper Premium plan going up by $1 each month, from $4.99
          to $5.99, and the Premium Plus package that gets rid of ads on most content and adds
          downloads for offline viewing along with access to live, local NBC channels is going up
          by $2, from $9.99 to $11.99 per month.
      - url: https://www.theverge.com/2023/7/17/23798373/peacock-premium-plus-prices-up-raise
        publisher: The Verge
        kind: press
        published: 2023-07-17
