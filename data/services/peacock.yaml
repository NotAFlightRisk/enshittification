  - id: price-2026
    date: 2026-08-18
    date_kind: effective
    category: price-rise
    title: Peacock Premium goes from $10.99 to $12.99 a month, and Premium Plus to $19.99
    what_changed: >-
      Peacock raised US Premium from $10.99 to $12.99 a month and Premium Plus from $16.99 to
      $19.99 for new and returning customers on 18 August 2026. Select went from $7.99 to $8.99, and current
      subscribers paid the new prices from their next bill on or after 17 September.
    before: $10.99 a month (Premium)
    after: $12.99 a month (Premium)
    user_impact: >-
      US Premium subscribers paid $2 more a month, Premium Plus subscribers $3 more and Select
      subscribers $1 more.
    company_said: >-
      Peacock said the rises let it keep creating the best experience for viewers, stay competitive
      and deliver unique content across all genres.
    severity: 1
    status: in-force
    regions: [US]
    prices:
      - { plan: premium-us, from: 10.99, to: 12.99 }
      - { plan: premium-plus-us, from: 16.99, to: 19.99 }
