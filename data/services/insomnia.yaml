service: insomnia
name: Insomnia
company: kong
url: https://insomnia.rest

changes:
  - id: account-required
    date: 2023-09-27
    date_kind: effective
    category: lock-out
    title: Insomnia 8.0 requires an account for projects outside its Scratch Pad
    question: When did Insomnia start requiring an account?
    what_changed: >-
      From Insomnia 8.0, which reached users on 27 September 2023, projects outside the local
      Scratch Pad needed an Insomnia account. The update offered to export them or move them to
      Kong's cloud on signing in, though Git Sync projects never went there. Insomnia 8.3 brought
      back fully local projects on 18 October 2023, but they still need an account, as does most of
      the app.
    before: Fully local projects without an account
    after: An account for projects outside Scratch Pad
    user_impact: >-
      People who updated couldn't get to their existing projects without signing in, unless they
      downgraded or moved collections into Scratch Pad, which doesn't take tests or design specs.
      Kong said the data had not been lost.
    company_said: >-
      Kong said supporting both local and cloud storage for all of Insomnia's data was causing
      issues and migration problems, and that a cloud version would let it offer premium features to
      keep the project running.
    severity: 3
    status: in-force
    sources:
      - url: https://konghq.com/blog/product-releases/insomnia-8-3
        publisher: Kong
        kind: primary
        published: 2023-10-18
        archive: https://web.archive.org/web/20231024150122/https://konghq.com/blog/product-releases/insomnia-8-3
        quote: >-
          We learned after releasing Insomnia 8.0 that for many users using cloud storage for
          projects (encrypted or not) is simply not an option.
      - url: https://konghq.com/blog/product-releases/insomnia-8-3
        publisher: Kong
        kind: primary
        published: 2023-10-18
        archive: https://web.archive.org/web/20231024150122/https://konghq.com/blog/product-releases/insomnia-8-3
        quote: >-
          brought back 100% local storage with no cloud synchronization for your projects, while at
          the same time keeping the same workflow for users who want to collaborate in the cloud.
      - url: https://konghq.com/blog/product-releases/insomnia-8-3
        publisher: Kong
        kind: primary
        published: 2023-10-18
        archive: https://web.archive.org/web/20231024150122/https://konghq.com/blog/product-releases/insomnia-8-3
        quote: >-
