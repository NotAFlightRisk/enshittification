changes:
  - id: beacon
    date: 2007-11-06
    date_kind: announced
    category: tracking
    title: Facebook Beacon shares what people do on other sites with their Facebook friends
    what_changed: >-
      Facebook launched Beacon on 6 November 2007 with 44 sites, sharing things people did there,
      like buying a movie ticket, with their friends on Facebook. It was opt-out at first, so if
      someone forgot to decline, Beacon shared it anyway.
    user_impact: >-
      Facebook users who bought or did something on a participating site, like Fandango or
      Travelocity, could have it shared with their friends unless they declined in time.
    company_said: >-
      Mark Zuckerberg said Facebook made it opt-out so it would be lightweight and people wouldn't
      have to touch it for it to work, and apologised for how it was handled.
    severity: 2
    status: reversed
    reversed:
      date: 2007-12-05
      what: >-
        Facebook made Beacon opt-in the week before 5 December 2007, and that day added a setting to
        turn it off completely, saying it wouldn't store actions people declined to share.
      sources:
        - url: https://blog.facebook.com/blog.php?post=7584397130
          publisher: The Facebook Blog
          kind: primary
          published: 2007-12-05
          archive: https://web.archive.org/web/20080107025500/http://blog.facebook.com/blog.php?post=7584397130
          quote: >-
            Last week we changed Beacon to be an opt-in system, and today we're releasing a privacy
            control to turn off Beacon completely.
    sources:
      - url: https://www.facebook.com/press/releases.php?p=9166
        publisher: Facebook Press Room
        kind: primary
        published: 2007-11-06
        archive: https://web.archive.org/web/20080214193303/http://www.facebook.com/press/releases.php?p=9166
        quote: >-
          Facebook announced today that 44 websites are using Facebook Beacon to allow users to
          share information from other websites for distribution to their friends on Facebook.
      - url: https://www.facebook.com/press/releases.php?p=9166
        publisher: Facebook Press Room
        kind: primary
        published: 2007-11-06
        archive: https://web.archive.org/web/20080214193303/http://www.facebook.com/press/releases.php?p=9166
        quote: >-
          Beacon is a core element of the Facebook Ads system for connecting businesses with users
          and targeting advertising to the audiences they want.
      - url: https://blog.facebook.com/blog.php?post=7584397130
        publisher: The Facebook Blog
        kind: primary
        published: 2007-12-05
        archive: https://web.archive.org/web/20080107025500/http://blog.facebook.com/blog.php?post=7584397130
        quote: >-
          The problem with our initial approach of making it an opt-out system instead of opt-in was
          that if someone forgot to decline to share something, Beacon still went ahead and shared
          it with their friends.
      - url: https://blog.facebook.com/blog.php?post=7584397130
        publisher: The Facebook Blog
        kind: primary
        published: 2007-12-05
        archive: https://web.archive.org/web/20080107025500/http://blog.facebook.com/blog.php?post=7584397130
        quote: >-
          At first we tried to make it very lightweight so people wouldn't have to touch it for it
          to work.
    added: 2026-11-22
    updated: 2026-11-22
    sources_checked: 2026-11-22
    status_checked: 2026-11-22

  - id: messaging-moved-to-messenger
    date: 2014-04-09
    date_kind: announced
    category: removed-feature
    title: Facebook takes messaging out of its mobile app, so chatting needs Messenger
    what_changed: >-
      Facebook began telling users on 9 April 2014 that messaging would leave its iOS and Android
      apps, so they'd need the Messenger app to chat on mobile. Users in a few European countries
      went first, with 2 weeks' notice, and TechCrunch reported on 28 July 2014 that everyone else
      would follow within days.
    user_impact: >-
      Facebook users who messaged in the iPhone or Android app had to install Messenger, or switch
      to Facebook's mobile site, to keep chatting on their phone.
    company_said: >-
      Facebook pointed to Mark Zuckerberg saying messaging as a second-class thing inside the
      Facebook app added friction to replying, so it would rather people use a more focused app.
    severity: 2
    status: in-force
    sources:
      - url: https://techcrunch.com/2014/04/09/facebook-messenger-or-the-highway/
        publisher: TechCrunch
        kind: press
        published: 2014-04-09
        archive: https://web.archive.org/web/20261009090730/https://techcrunch.com/2014/04/09/facebook-messenger-or-the-highway/
        quote: >-
          It’s starting to notify users they’ll no longer have the option to send and receive
          messages in Facebook for iOS and Android, and will instead have to download Facebook
          Messenger to chat on mobile.
      - url: https://techcrunch.com/2014/04/09/facebook-messenger-or-the-highway/
        publisher: TechCrunch
        kind: press
        published: 2014-04-09
        archive: https://web.archive.org/web/20261009090730/https://techcrunch.com/2014/04/09/facebook-messenger-or-the-highway/
        quote: >-
          we found that having it as a second-class thing inside the Facebook app makes it so
          there’s more friction to replying to messages
      - url: https://techcrunch.com/2014/04/09/facebook-messenger-or-the-highway/
        publisher: TechCrunch
        kind: press
        published: 2014-04-09
        archive: https://web.archive.org/web/20261009090730/https://techcrunch.com/2014/04/09/facebook-messenger-or-the-highway/
        quote: >-
          The only way to escape the migration is to either have a low-end Android with an OS too
          old to run Messenger, use Facebook’s mobile web site, or use Facebook’s standalone content
          reader app Paper.
      - url: https://www.theverge.com/2014/4/9/5598440/facebook-will-turn-off-messaging-in-its-mobile-app-forcing-you-to-download-messenger
        publisher: The Verge
        kind: press
        published: 2014-04-09
        archive: https://web.archive.org/web/20260925190205/https://www.theverge.com/2014/4/9/5598440/facebook-will-turn-off-messaging-in-its-mobile-app-forcing-you-to-download-messenger
        quote: >-
          the company began notifying users in a few European countries that in two weeks, they
          won’t be able to message friends through the Facebook app anymore.
      - url: https://techcrunch.com/2014/07/28/facebook-moving-messages/
        publisher: TechCrunch
        kind: press
        published: 2014-07-28
        archive: https://web.archive.org/web/20260904234831/https://techcrunch.com/2014/07/28/facebook-moving-messages/
        quote: >-
          Over the next few days, Facebook will stop allowing messaging in its main iPhone and Android
          apps, and force all their users around the world to download its standalone Messenger app
    added: 2026-11-22
    updated: 2026-11-22
    sources_checked: 2026-11-22
    status_checked: 2026-11-22

  - id: two-factor-numbers-for-ads
    date: 2018-09-26
    date_kind: reported
    category: tracking
    title: Facebook uses phone numbers given for 2FA login to target ads
    what_changed: >-
      Gizmodo reported on 26 September 2018 that advertisers could target phone numbers people gave
      Facebook for 2FA login. Facebook confirmed it to TechCrunch the next day.
    user_impact: >-
      Facebook users who added a phone number to secure their account could be targeted with ads
      through it, unless they used 2FA without a phone number.
    company_said: >-
      Facebook said it uses the information people provide to offer a better, more personalized
      experience on Facebook, including ads.
    severity: 2
    status: reversed
    reversed:
      date: 2019-07-24
      what: >-
        The FTC's 2019 order against Facebook prohibited it from using phone numbers obtained for a
        security feature, like two-factor authentication, for advertising.
      sources:
        - url: https://www.ftc.gov/news-events/press-releases/2019/07/ftc-imposes-5-billion-penalty-sweeping-new-privacy-restrictions
          publisher: US Federal Trade Commission
          kind: press
          published: 2019-07-24
          archive: https://web.archive.org/web/20220307194809/https://www.ftc.gov/news-events/press-releases/2019/07/ftc-imposes-5-billion-penalty-sweeping-new-privacy-restrictions
          quote: >-
            Facebook is prohibited from using telephone numbers obtained to enable a security
            feature (e.g., two-factor authentication) for advertising
    sources:
      - url: https://techcrunch.com/2018/09/27/yes-facebook-is-using-your-2fa-phone-number-to-target-you-with-ads/
        publisher: TechCrunch
        kind: press
        published: 2018-09-27
        archive: https://web.archive.org/web/20261018105344/https://techcrunch.com/2018/09/27/yes-facebook-is-using-your-2fa-phone-number-to-target-you-with-ads/
        quote: >-
          Facebook has confirmed it does in fact use phone numbers that users provided it for
          security purposes to also target them with ads.
      - url: https://techcrunch.com/2018/09/27/yes-facebook-is-using-your-2fa-phone-number-to-target-you-with-ads/
        publisher: TechCrunch
        kind: press
        published: 2018-09-27
        archive: https://web.archive.org/web/20261018105344/https://techcrunch.com/2018/09/27/yes-facebook-is-using-your-2fa-phone-number-to-target-you-with-ads/
        quote: >-
          We use the information people provide to offer a better, more personalized experience on
          Facebook, including ads.
      - url: https://techcrunch.com/2018/09/27/yes-facebook-is-using-your-2fa-phone-number-to-target-you-with-ads/
        publisher: TechCrunch
        kind: press
        published: 2018-09-27
        archive: https://web.archive.org/web/20261018105344/https://techcrunch.com/2018/09/27/yes-facebook-is-using-your-2fa-phone-number-to-target-you-with-ads/
        quote: >-
          A spokesman also told us that users can opt out of this ad-based repurposing of their
          security digits by not using phone number based 2FA.
      - url: https://gizmodo.com/facebook-is-giving-advertisers-access-to-your-shadow-co-1828476051
        publisher: Gizmodo
        kind: press
        published: 2018-09-26
        archive: https://web.archive.org/web/20180927003624/https://gizmodo.com/facebook-is-giving-advertisers-access-to-your-shadow-co-1828476051
        quote: >-
          They found that when a user gives Facebook a phone number for two-factor authentication
          or in order to receive alerts about new log-ins to a user’s account, that phone number
          became targetable by an advertiser within a couple of weeks.
    added: 2026-11-22
    updated: 2026-11-22
    sources_checked: 2026-11-22
    status_checked: 2026-11-22

  - id: meta-ai-search-bar
    date: 2024-04-18
    date_kind: announced
    category: ai
    title: Meta AI goes into Facebook's search bar, with no way to turn it off
    what_changed: >-
      Meta said on 18 April 2024 it was rolling out Meta AI in search on Facebook, Instagram,
      WhatsApp and Messenger, in English in the US and 13 other countries. There was no button to
      turn it off, though people could still search as they normally would.
    user_impact: >-
      Facebook users who got it had Meta AI in the search bar whether they wanted it or not, with
      ordinary search still working underneath.
    company_said: >-
      Meta said people could search as they normally would and choose between Meta AI's answers and
      other results.
    severity: 1
    status: in-force
    related: [instagram/meta-ai-search-bar]
    sources:
      - url: https://about.fb.com/news/2024/04/meta-ai-assistant-built-with-llama-3/
        publisher: Meta Newsroom
        kind: primary
        published: 2024-04-18
        archive: https://web.archive.org/web/20261031082055/https://about.fb.com/news/2024/04/meta-ai-assistant-built-with-llama-3/
        quote: Meta AI is also available in search across Facebook, Instagram, WhatsApp and Messenger.
      - url: https://apnews.com/article/meta-ai-instagram-facebook-turn-off-disable-fd778171e2a1e7098d7b3756deb5587b
        publisher: AP News
        kind: press
        published: 2024-05-30
        archive: https://web.archive.org/web/20260720003322/https://apnews.com/article/meta-ai-instagram-facebook-turn-off-disable-fd778171e2a1e7098d7b3756deb5587b
        quote: >-
          The bad news is there’s no one button to turn off Meta AI on Facebook, Instagram,
          Messenger or WhatsApp.
      - url: https://apnews.com/article/meta-ai-instagram-facebook-turn-off-disable-fd778171e2a1e7098d7b3756deb5587b
        publisher: AP News
        kind: press
        published: 2024-05-30
        archive: https://web.archive.org/web/20260720003322/https://apnews.com/article/meta-ai-instagram-facebook-turn-off-disable-fd778171e2a1e7098d7b3756deb5587b
        quote: >-
          Meta AI is so far only available in the United States and 13 other countries including
          Australia, Canada, Ghana, Jamaica, Malawi, New Zealand, Nigeria, Pakistan, Singapore, South
          Africa, Uganda, Zambia and Zimbabwe.
      - url: https://apnews.com/article/meta-ai-instagram-facebook-turn-off-disable-fd778171e2a1e7098d7b3756deb5587b
        publisher: AP News
        kind: press
        published: 2024-05-30
        archive: https://web.archive.org/web/20260720003322/https://apnews.com/article/meta-ai-instagram-facebook-turn-off-disable-fd778171e2a1e7098d7b3756deb5587b
        quote: >-
          “You can search how you normally would and choose to engage with a variety of results —
          ones from Meta AI or others that appear as you type,” the spokesperson said in a statement.
