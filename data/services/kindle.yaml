        archive: https://web.archive.org/web/20260716234236/https://blog.the-ebook-reader.com/2023/05/12/kindle-unlimited-price-increase-heres-how-to-get-the-old-price/
        quote: >-
          The Kindle Unlimited price increase to $11.99 per month officially went into effect on May
          11th, 2023
      - url: https://blog.the-ebook-reader.com/2023/05/12/kindle-unlimited-price-increase-heres-how-to-get-the-old-price/
