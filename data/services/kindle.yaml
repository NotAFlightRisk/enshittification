changes:
  - id: unlimited-price-2023
    date: 2023-05-11
    date_kind: announced
    category: price-rise
    title: Kindle Unlimited goes from $9.99 to $11.99 a month in the US, its first rise
    what_changed: >-
      Amazon started emailing US Kindle Unlimited members on 11 May 2023 that the monthly price was
      going from $9.99 to $11.99, its first rise since the 2014 launch. Monthly members paid it from
      their next charge, and until 31 July 2023 they could lock in $9.99 by buying 6 or 12 months
      up front.
    before: $9.99 a month
    after: $11.99 a month
    user_impact: US members on a monthly Kindle Unlimited plan were charged $11.99 instead of $9.99 from their next renewal.
    severity: 1
    status: in-force
    regions: [US]
    prices:
      - { plan: unlimited-us, from: 9.99, to: 11.99 }
    sources:
      - url: https://blog.the-ebook-reader.com/2023/05/12/kindle-unlimited-price-increase-heres-how-to-get-the-old-price/
        publisher: The eBook Reader Blog
