changes:
  - id: cloud-shutdown
    date: 2026-01-31
    date_kind: effective
    category: bricked
    title: Belkin shuts down Wemo's app and cloud, and most Wemo devices lose their smart features
    question: When did Wemo stop working?
    what_changed: >-
      Belkin shut down the Wemo app and cloud on 31 January 2026, and with them the remote access and
      voice control Wemo devices relied on. Belkin had announced it on 10 July 2025. Devices set up
      in Apple HomeKit, and Thread models, kept local control, and products under warranty may have
      been eligible for a partial refund, which BGR says Belkin has since closed.
    user_impact: >-
      Owners of Wemo plugs, switches and bulbs not set up in HomeKit lost Belkin's app, remote and
      voice control, including people who used them through Google Home, and BGR says Belkin
      recommends disposing of anything they can't get working.
    company_said: >-
      Belkin said that as technology evolves, it must focus its resources on different parts of
      the Belkin business.
    severity: 4
    status: in-force
    sources:
