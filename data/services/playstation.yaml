  - id: helldivers-2-psn-link
    date: 2024-05-03
    date_kind: reported
    category: lock-out
    title: Helldivers 2 on Steam to require a PSN account, dropped 3 days later
    what_changed: >-
      Helldivers 2 players on Steam were told in May 2024 that they'd have to link a PSN account,
      from 6 May for new players and later for current ones. PSN isn't available
      in every country, so players there could have been locked out of a game they'd bought, and
      Steam stopped selling it in countries without PSN.
    user_impact: >-
      Steam players would have needed a PSN account to keep playing a game they'd already bought.
    company_said: >-
      Arrowhead said linking had always been meant to be required, to protect players from
      griefing and other abuse.
    severity: 2
    status: reversed
    reversed:
      date: 2024-05-06
      what: >-
        After the game got 84,000 negative reviews on Steam in a day, Sony said on 6 May 2024 that
        the update adding the requirement wasn't going ahead.
      sources:
        - url: https://www.theverge.com/2024/5/6/24149918/sony-backtracks-now-says-it-wont-make-helldivers-2-players-on-steam-link-a-psn-account
          publisher: The Verge
          kind: press
          published: 2024-05-06
          archive: https://web.archive.org/web/20240601025749/https://www.theverge.com/2024/5/6/24149918/sony-backtracks-now-says-it-wont-make-helldivers-2-players-on-steam-link-a-psn-account
          quote: >-
            The May 6 update, which would have required Steam and PlayStation Network account
            linking for new players and for current players beginning May 30, will not be moving
            forward.
    sources:
      - url: https://www.theverge.com/2024/5/3/24148144/helldivers-2-steam-psn-account-link-review-bombing
        publisher: The Verge
        kind: press
        published: 2024-05-03
        archive: https://web.archive.org/web/20240504221329/https://www.theverge.com/2024/5/3/24148144/helldivers-2-steam-psn-account-link-review-bombing
        quote: >-
          According to the announcement , all new players on Steam will be required to link to a
          PSN account starting May 6th, while current players will have a little bit longer, with
          mandatory enforcement delayed until June 4th.
      - url: https://www.theverge.com/2024/5/3/24148144/helldivers-2-steam-psn-account-link-review-bombing
        publisher: The Verge
        kind: press
        published: 2024-05-03
        archive: https://web.archive.org/web/20240504221329/https://www.theverge.com/2024/5/3/24148144/helldivers-2-steam-psn-account-link-review-bombing
        quote: >-
          PSN isn’t available everywhere, and this move could potentially lock players in certain
          countries out of their game permanently.
      - url: https://www.theverge.com/2024/5/3/24148144/helldivers-2-steam-psn-account-link-review-bombing
        publisher: The Verge
        kind: press
        published: 2024-05-03
        archive: https://web.archive.org/web/20240504221329/https://www.theverge.com/2024/5/3/24148144/helldivers-2-steam-psn-account-link-review-bombing
        quote: >-
          According to Helldivers 2 developer Arrowhead Game Studios, linking to a PSN account was
          always going to be a requirement for Steam players, and the policy is there to ensure
          players are protected from griefing and other in-game abuses.
      - url: https://www.theverge.com/2024/5/11/24154412/steam-refunding-ghost-of-tsushima-preorders-psn-network-unavailable
        publisher: The Verge
        kind: press
        published: 2024-05-11
        archive: https://web.archive.org/web/20240603045743/https://www.theverge.com/2024/5/11/24154412/steam-refunding-ghost-of-tsushima-preorders-psn-network-unavailable
        quote: >-
          Earlier this month, Sony announced it would add mandatory PSN account linking to
          Helldivers 2, which had already been available to buy in non-PSN countries for almost
          three months. Steam quickly restricted where the game could be sold to only countries
          where PSN was available.
