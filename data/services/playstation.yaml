  - id: ps-plus-annual-price-2023
    date: 2023-08-30
    date_kind: announced
    effective: 2023-09-06
    category: price-rise
    title: PlayStation Plus 12-month plans go up, US Essential from $59.99 to $79.99
    what_changed: >-
      Sony said on 30 August 2023 that 12-month PlayStation Plus plans would cost new buyers more
      from 6 September, with US Essential going from $59.99 to $79.99. US Extra went from $99.99 to $134.99
      and Premium from $119.99 to $159.99, and current 12-month members paid it from their first
      renewal on or after 6 November 2023.
    before: Essential $59.99 a year
    after: Essential $79.99 a year
    user_impact: >-
      Everyone on a 12-month plan paid more, new buyers and plan changes from 6 September and current
      members from their first renewal on or after 6 November 2023.
    company_said: >-
      Sony said the rise would let it keep bringing high-quality games and value-added benefits to
      PlayStation Plus.
    severity: 2
    status: in-force
    prices:
      - { plan: essential-annual-us, from: 59.99, to: 79.99 }
      - { plan: extra-annual-us, from: 99.99, to: 134.99 }
      - { plan: premium-annual-us, from: 119.99, to: 159.99 }
