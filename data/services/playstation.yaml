  - id: plus-collection-ends
    date: 2023-02-01
    date_kind: announced
    effective: 2023-05-09
    category: removed-feature
    title: PlayStation Plus drops the PlayStation Plus Collection of PS4 games for PS5 owners
    what_changed: >-
      Sony said on 1 February 2023 that PS5 owners with PlayStation Plus would lose the PlayStation
      Plus Collection of classic PS4 games on 9 May 2023. Games already redeemed from it stayed
      playable for as long as the member kept paying for PlayStation Plus.
    user_impact: >-
      PS5 owners who joined PlayStation Plus after 9 May 2023, or hadn't redeemed the games by
      then, couldn't get them.
    severity: 1
    status: in-force
    sources:
      - url: https://blog.playstation.com/2023/02/01/playstation-plus-monthly-games-for-february-evil-dead-the-game-olliolliworld-destiny-2-beyond-light-mafia-definitive-edition/
        publisher: PlayStation Blog
        kind: primary
        published: 2023-02-01
        archive: https://web.archive.org/web/20230203000747/https://blog.playstation.com/2023/02/01/playstation-plus-monthly-games-for-february-evil-dead-the-game-olliolliworld-destiny-2-beyond-light-mafia-definitive-edition/
        quote: >-
          On May 9 the PlayStation Plus Collection will no longer be offered. If you haven’t
          redeemed the titles in this collection yet, you can still do so before May 9, which will
          enable you to access those titles even after this date for as long as you remain a
          PlayStation Plus member.
      - url: https://blog.playstation.com/2023/02/01/playstation-plus-monthly-games-for-february-evil-dead-the-game-olliolliworld-destiny-2-beyond-light-mafia-definitive-edition/
