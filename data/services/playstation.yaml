  - id: discovery-removal
    date: 2023-12
    date_kind: reported
    effective: 2023-12-31
    category: bricked
    title: PlayStation Store says bought Discovery shows will be deleted, then keeps them
    what_changed: >-
      PlayStation Store said in December 2023 that buyers would lose the Discovery shows they'd
      bought on 31 December, removed from their video libraries. Ars Technica counted 1,318 seasons
      on Sony's list and found no mention of refunds.
    user_impact: >-
      Anyone who'd bought Discovery shows on the PlayStation Store would have lost them.
    company_said: Sony said it was due to its content licensing arrangements with content providers.
    severity: 4
    status: reversed
    regions: [US]
    reversed:
      date: 2023-12-21
      what: >-
        Sony updated the notice on 21 December 2023 to say that, due to updated licensing
        arrangements, the removal planned for 31 December was no longer happening.
      sources:
        - url: https://www.playstation.com/en-us/legal/psvideocontent/
          publisher: PlayStation (US)
          kind: primary
          published: 2023-12-21
          archive: https://web.archive.org/web/20240308174949/https://www.playstation.com/en-us/legal/psvideocontent/
          quote: >-
            Due to updated licensing arrangements, the Discovery content removal planned for
            December 31, 2023 is no longer occurring.
    related: [playstation/studiocanal-removal-2022, playstation/studiocanal-removal-2026]
    sources:
      - url: https://www.playstation.com/en-us/legal/psvideocontent/
        publisher: PlayStation (US)
        kind: primary
        published: 2023-12-02
        archive: https://web.archive.org/web/20231202233603/https://www.playstation.com/en-us/legal/psvideocontent/
        quote: >-
          As of 31 December 2023, due to our content licensing arrangements with content providers,
