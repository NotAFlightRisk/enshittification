  - id: ps-plus-monthly-price-2026
    date: 2026-05-18
    date_kind: announced
    effective: 2026-05-20
    category: price-rise
    title: PlayStation Plus 1-month plans go up for new and lapsed members, Essential to $10.99
    what_changed: >-
      Sony said on 18 May 2026 that PlayStation Plus would cost new customers more in some regions
      from 20 May, with US 1-month Essential going to $10.99. Its post only gave Essential's prices,
      but 1-month Extra went from $14.99 to $16.99 and Premium from $17.99 to $19.99 too, while
      12-month plans stayed the same.
    before: Essential $9.99 a month
    after: Essential $10.99 a month
    user_impact: >-
      New and lapsed members in the US and UK paid more for 1-month plans, while people already on a
      rolling plan kept their price as long as it didn't lapse.
    company_said: Sony put it down to ongoing market conditions.
    severity: 1
    status: in-force
    regions: [US, GB]
    prices:
      - { plan: essential-monthly-us, from: 9.99, to: 10.99 }
      - { plan: extra-monthly-us, from: 14.99, to: 16.99 }
      - { plan: premium-monthly-us, from: 17.99, to: 19.99 }
      - { plan: extra-monthly-uk, from: 10.99, to: 11.99 }
      - { plan: premium-monthly-uk, from: 13.49, to: 14.99 }
