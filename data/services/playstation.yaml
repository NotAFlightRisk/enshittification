changes:
  - id: ps-plus-price-2016
    date: 2016-09-22
    date_kind: effective
    category: price-rise
    title: PlayStation Plus goes from $49.99 to $59.99 a year in the US, its first rise
    what_changed: >-
      PlayStation Plus went from $49.99 to $59.99 for 12 months in the US on 22 September 2016,
      while the monthly plan stayed at $9.99. Sony said it was the first US rise since the service
      launched in 2010, and current members paid it from their first renewal on or after that date.
    before: $49.99 a year
    after: $59.99 a year
    user_impact: >-
      US and Canadian members on 12-month plans paid more, current ones from their first renewal on
      or after 22 September 2016.
    company_said: >-
      Sony said the new pricing reflected current market conditions while letting it keep giving
      members exceptional value.
    severity: 1
    status: in-force
    regions: [US, CA]
    prices:
      - { plan: essential-annual-us, from: 49.99, to: 59.99 }
    sources:
      - url: https://blog.us.playstation.com/2016/07/27/playstation-plus-free-games-for-august-2016/
        publisher: PlayStation Blog
        kind: primary
        published: 2016-07-27
        archive: https://web.archive.org/web/20160921110037/https://blog.us.playstation.com/2016/07/27/playstation-plus-free-games-for-august-2016/
        quote: >-
          Starting on September 22, 2016, prices for PlayStation Plus memberships will change to
          $59.99 USD/ $69.99 CAD for twelve months and $24.99 USD/$29.99 CAD for three months.
      - url: https://blog.us.playstation.com/2016/07/27/playstation-plus-free-games-for-august-2016/
        publisher: PlayStation Blog
        kind: primary
        published: 2016-07-27
        archive: https://web.archive.org/web/20160921110037/https://blog.us.playstation.com/2016/07/27/playstation-plus-free-games-for-august-2016/
        quote: >-
          If you are a current member, the new prices will take effect if your membership renews on
          or after this date.
      - url: https://blog.us.playstation.com/2016/07/27/playstation-plus-free-games-for-august-2016/
        publisher: PlayStation Blog
        kind: primary
        published: 2016-07-27
        archive: https://web.archive.org/web/20160921110037/https://blog.us.playstation.com/2016/07/27/playstation-plus-free-games-for-august-2016/
        quote: >-
          This marks the first time that PS Plus membership prices will increase in the U.S. and
          Canada since the launch of the service in 2010. The new pricing reflects the current
          market conditions while enabling us to continue providing exceptional value to our
          members.
    added: 2026-11-22
    updated: 2026-11-22
    sources_checked: 2026-11-22
    status_checked: 2026-11-22

  - id: ps3-vita-store-closure
    date: 2021-03
    date_kind: announced
    category: removed-feature
    title: Sony plans to close the PS3, PSP and Vita stores, then keeps PS3 and Vita open
    what_changed: >-
      Sony said in March 2021 that it would close the PlayStation Store on PS3 on 2 July and on
      Vita on 27 August 2021, and end PSP purchases on 2 July. Games already bought could still be
      downloaded, but new ones couldn't be bought unless they had cross-buy support.
    user_impact: >-
      PS3 and Vita owners would only have got new digital games through cross-buy, and PSP
      purchases were still set to end on 2 July 2021.
    company_said: >-
      Sony said it came from commerce support challenges for older devices and wanting to focus
      more of its resources on newer ones.
    severity: 1
    status: reversed
    reversed:
      date: 2021-04-19
      what: >-
        Sony's Jim Ryan said it had made the wrong decision and would keep the store running on PS3
        and Vita, though PSP purchases would still end on 2 July 2021 as planned.
      sources:
        - url: https://blog.playstation.com/2021/04/19/playstation-store-on-ps3-and-ps-vita-will-continue-operations/
          publisher: PlayStation Blog
          kind: primary
          published: 2021-04-19
          archive: https://web.archive.org/web/20210420145507/https://blog.playstation.com/2021/04/19/playstation-store-on-ps3-and-ps-vita-will-continue-operations/
          quote: >-
            So today I’m happy to say that we will be keeping the PlayStation Store operational for
            PS3 and PS Vita devices. PSP commerce functionality will retire on July 2, 2021 as
            planned.
    sources:
      - url: https://blog.playstation.com/2021/04/19/playstation-store-on-ps3-and-ps-vita-will-continue-operations/
        publisher: PlayStation Blog
        kind: primary
        published: 2021-04-19
        archive: https://web.archive.org/web/20210420145507/https://blog.playstation.com/2021/04/19/playstation-store-on-ps3-and-ps-vita-will-continue-operations/
        quote: >-
          When we initially came to the decision to end purchasing support for PS3 and PS Vita, it
          was born out of a number of factors, including commerce support challenges for older
          devices and the ability for us to focus more of our resources on newer devices where a
          majority of our gamers are playing on.
      - url: https://www.theverge.com/2021/3/29/22356791/sony-playstation-store-close-ps3-vita-psp-game-downloads
        publisher: The Verge
        kind: press
        published: 2021-03-29
        archive: https://web.archive.org/web/20210331071030/https://www.theverge.com/2021/3/29/22356791/sony-playstation-store-close-ps3-vita-psp-game-downloads
        quote: >-
          Sony is officially closing its PlayStation Store for the PlayStation 3 on July 2nd, with
          the store shuttering for Vita devices on August 27th.
      - url: https://www.theverge.com/2021/3/29/22356791/sony-playstation-store-close-ps3-vita-psp-game-downloads
        publisher: The Verge
        kind: press
        published: 2021-03-29
        archive: https://web.archive.org/web/20210331071030/https://www.theverge.com/2021/3/29/22356791/sony-playstation-store-close-ps3-vita-psp-game-downloads
        quote: >-
          Sony is also removing the remaining purchase functionality for its PlayStation Portable
          (PSP) on July 2nd.
      - url: https://www.theverge.com/2021/3/29/22356791/sony-playstation-store-close-ps3-vita-psp-game-downloads
        publisher: The Verge
        kind: press
        published: 2021-03-29
        archive: https://web.archive.org/web/20210331071030/https://www.theverge.com/2021/3/29/22356791/sony-playstation-store-close-ps3-vita-psp-game-downloads
        quote: >-
          The only thing that’s really changing here is you won’t be able to buy new digital games
          and content unless the games have cross-buy support.
    added: 2026-11-22
    updated: 2026-11-22
    sources_checked: 2026-11-22
    status_checked: 2026-11-22

  - id: studiocanal-removal-2022
    date: 2022-08-31
    date_kind: effective
    category: bricked
    title: PlayStation pulls bought StudioCanal films from libraries in Germany and Austria
    what_changed: >-
      Sony said bought StudioCanal films and shows would leave PlayStation video libraries in
      Germany and Austria on 31 August 2022. Its notices listed the affected titles and gave its
      content licensing agreements as the reason.
    user_impact: >-
      People in Germany and Austria who'd bought StudioCanal titles on the PlayStation Store lost
      access to them.
    company_said: Sony said it was down to its content licensing agreements.
    severity: 4
    status: in-force
    regions: [DE, AT]
    related: [playstation/studiocanal-removal-2026, playstation/discovery-removal]
