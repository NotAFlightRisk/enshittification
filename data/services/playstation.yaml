  - id: disc-production-ends
    date: 2026-07-01
    date_kind: announced
    effective: 2028-01
    category: removed-feature
    title: Sony stops making discs for new PlayStation games from January 2028
    what_changed: >-
      Sony said on 1 July 2026 that it would stop producing discs for all new PlayStation console
      games from January 2028. After that, new games are sold digitally only, on PlayStation Store
      and at retailers, while games released on disc before then aren't affected.
    before: New games on disc or digital
    after: New PlayStation console games digital only
    user_impact: >-
      Anyone who buys new PlayStation games on disc will have to buy them digitally from January
      2028.
    company_said: >-
      Sony said consumer preferences and the wider entertainment industry were moving from physical
      discs to digital.
    severity: 2
    status: scheduled
    sources:
      - url: https://blog.playstation.com/2026/07/01/physical-disc-production-ending-in-january-2028-for-new-games-releasing-on-playstation-consoles/
        publisher: PlayStation Blog
        kind: primary
        published: 2026-07-01
        archive: https://web.archive.org/web/20261120200916/https://blog.playstation.com/2026/07/01/physical-disc-production-ending-in-january-2028-for-new-games-releasing-on-playstation-consoles/
        quote: >-
          physical game disc production for all new games releasing on PlayStation consoles will be
          discontinued starting January 2028
      - url: https://blog.playstation.com/2026/07/01/physical-disc-production-ending-in-january-2028-for-new-games-releasing-on-playstation-consoles/
        publisher: PlayStation Blog
        kind: primary
        published: 2026-07-01
        archive: https://web.archive.org/web/20261120200916/https://blog.playstation.com/2026/07/01/physical-disc-production-ending-in-january-2028-for-new-games-releasing-on-playstation-consoles/
        quote: >-
          Following this date, new games will be available on PlayStation Store and at retailers in
          digital formats only.
      - url: https://blog.playstation.com/2026/07/01/physical-disc-production-ending-in-january-2028-for-new-games-releasing-on-playstation-consoles/
        publisher: PlayStation Blog
        kind: primary
        published: 2026-07-01
