changes:
  - id: originals-pulled
    date: 2022-08
    date_kind: reported
    category: removed-feature
    title: HBO Max pulls 36 titles including its own originals, then Westworld and The Nevers
    what_changed: >-
      HBO Max pulled 36 titles in August 2022, 20 of them its own in-house productions, as Warner
      Bros. Discovery got ready to merge it with Discovery+. In December 2022 WBD said over 10
      original series, Westworld and The Nevers among them, were leaving for free ad-supported
      services, which NPR tied to a tax write-off on content costs.
    user_impact: >-
      Subscribers lost shows HBO Max had made itself, like Generation and The Not-Too-Late Show with
      Elmo, and some of the December titles had no new streaming home lined up.
    company_said: >-
      HBO Max said it was bringing its content catalogs together under one platform, which would
      include removing some content from both HBO Max and Discovery+.
    severity: 2
    status: in-force
    regions: [US]
    sources:
      - url: https://techcrunch.com/2022/08/18/hbo-max-is-removing-36-titles-and-creators-are-not-happy/
        publisher: TechCrunch
        kind: press
        published: 2022-08-18
        archive: https://web.archive.org/web/20240424125442/https://techcrunch.com/2022/08/18/hbo-max-is-removing-36-titles-and-creators-are-not-happy/
        quote: >-
          HBO Max is continuing its content removal spree with 36 titles going off the service this
          week including 20 of its in-house productions.
      - url: https://www.npr.org/2022/08/19/1118344173/hbo-max-cuts-shows
        publisher: NPR
        kind: press
        published: 2022-08-19
        archive: https://web.archive.org/web/20260608225901/https://www.npr.org/2022/08/19/1118344173/hbo-max-cuts-shows
        quote: >-
          The content set to disappear includes HBO Max originals like the teen drama Generation and
          Sesame Street spinoff The Not-Too-Late Show with Elmo
      - url: https://techcrunch.com/2022/08/18/hbo-max-is-removing-36-titles-and-creators-are-not-happy/
        publisher: TechCrunch
        kind: press
        published: 2022-08-18
        archive: https://web.archive.org/web/20240424125442/https://techcrunch.com/2022/08/18/hbo-max-is-removing-36-titles-and-creators-are-not-happy/
        quote: >-
          As we work toward bringing our content catalogs together under one platform, we will be
          making changes to the content offering available on both HBO Max and Discovery+. That will
          include the removal of some content from both platforms,
      - url: https://techcrunch.com/2022/12/13/westworld-removed-from-hbo-max/
        publisher: TechCrunch
        kind: press
        published: 2022-12-13
        archive: https://web.archive.org/web/20260720194007/https://techcrunch.com/2022/12/13/westworld-removed-from-hbo-max/
        quote: >-
          Warner Bros. Discovery confirmed today that it will be moving over 10 HBO Max original
          series to third-party free ad-supported streaming TV (FAST) services.
      - url: https://techcrunch.com/2022/12/15/here-are-the-13-shows-leaving-hbo-max/
        publisher: TechCrunch
        kind: press
        published: 2022-12-15
        archive: https://web.archive.org/web/20251114051843/https://techcrunch.com/2022/12/15/here-are-the-13-shows-leaving-hbo-max/
        quote: >-
          The remaining titles — “Gordita Chronicles” (S1), “The Garcias” (S1), “Love Life” (S1,
          S2), “Made for Love” (S1, S2) and “Minx” (S1, S2) — are not guaranteed to have new
          streaming homes.
      - url: https://www.npr.org/2022/12/17/1143901911/popular-titles-are-vanishing-from-hbo-max-after-merger
        publisher: NPR
        kind: press
        published: 2022-12-17
        archive: https://web.archive.org/web/20260911125109/https://www.npr.org/2022/12/17/1143901911/popular-titles-are-vanishing-from-hbo-max-after-merger
        quote: >-
          So the company expects to write off something up to $3.5 billion connected to content
