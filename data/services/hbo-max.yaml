  - id: ad-free-price-2023
    date: 2023-01-12
    date_kind: announced
    category: price-rise
    title: HBO Max ad-free goes from $14.99 to $15.99 a month, its first US rise
    what_changed: >-
      HBO Max said on 12 January 2023 that its US ad-free plan would go from $14.99 to $15.99 a
      month, its first rise since launching in May 2020. Existing subscribers paid it from their
      first bill on or after 11 February 2023.
    before: $14.99 a month
    after: $15.99 a month
    user_impact: >-
      Ad-free subscribers paid $1 more a month, existing ones from their first bill on or after 11
      February 2023.
    company_said: >-
      HBO Max said the rise would let it keep investing in more culture-defining programming and a
      better experience for all users.
    severity: 1
    status: in-force
    regions: [US]
    prices:
      - { plan: ad-free-us, from: 14.99, to: 15.99 }
    sources:
      - url: https://techcrunch.com/2023/01/12/hbo-maxs-ad-free-monthly-subscription-price-is-increasing-by-1/
        publisher: TechCrunch
        kind: press
        published: 2023-01-12
        archive: https://web.archive.org/web/20230112164214/https://techcrunch.com/2023/01/12/hbo-maxs-ad-free-monthly-subscription-price-is-increasing-by-1/
        quote: >-
          HBO Max is raising the price of its ad-free monthly subscription in the U.S. from $14.99
          to $15.99 plus applicable taxes. The change marks the first time that HBO Max has
          increased the price of its service since launching in May 2020.
      - url: https://techcrunch.com/2023/01/12/hbo-maxs-ad-free-monthly-subscription-price-is-increasing-by-1/
        publisher: TechCrunch
        kind: press
        published: 2023-01-12
        archive: https://web.archive.org/web/20230112164214/https://techcrunch.com/2023/01/12/hbo-maxs-ad-free-monthly-subscription-price-is-increasing-by-1/
        quote: >-
          “Existing subscribers who are currently paying $14.99/month will see their monthly rate
          increase to $15.99 effective their next billing cycle on or after Saturday, February 11,
          2023,” the company said in a statement. “This price increase of one dollar will allow us
          to continue to invest in providing even more culture-defining programming and improving
          our customer experience for all users.”
    added: 2026-11-21
    updated: 2026-11-21
    sources_checked: 2026-11-21
    status_checked: 2026-11-21

  - id: 4k-ultimate-only
    date: 2023-04-12
    date_kind: announced
    effective: 2023-12-05
    category: paywall
    title: Max moves 4K and a third stream from its ad-free plan to a $19.99 Ultimate plan
    what_changed: >-
      WBD said on 12 April 2023 that Max's $15.99 ad-free plan would stream in 1080p on 2 devices
      at once, with 4K and 4 streams only on its $19.99 Ultimate plan. HBO Max's ad-free plan had
      included 4K titles and a third stream, and existing subscribers lost both from their first
      bill on or after 5 December 2023, at the same price.
    before: 4K titles on the $15.99 ad-free plan
    after: 4K only on the $19.99 Ultimate plan
    user_impact: >-
      Ad-free subscribers who watched in 4K or on more than 2 devices at once had to pay $19.99 a
      month for Ultimate to keep doing so.
