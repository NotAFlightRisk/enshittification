  - id: price-2024
    date: 2024-06-04
    date_kind: announced
    category: price-rise
    title: Max Ad-Free goes from $15.99 to $16.99 and Ultimate from $19.99 to $20.99
    what_changed: >-
      Max raised its US Ad-Free plan from $15.99 to $16.99 a month and Ultimate Ad-Free from $19.99
      to $20.99 on 4 June 2024, for new subscribers straight away. Yearly plans went from $149.99 to
      $169.99 and from $199.99 to $209.99, existing subscribers paid it from their renewal on or
      after 4 July, and the $9.99 plan with ads stayed the same.
    before: $15.99 a month for Ad-Free, $19.99 for Ultimate
    after: $16.99 a month for Ad-Free, $20.99 for Ultimate
    user_impact: >-
      Ad-free subscribers paid 6% more a month, or 13% more on a yearly Ad-Free plan, while the plan
      with ads kept its price.
