        archive: https://web.archive.org/web/20250108111539/https://electrek.co/2020/02/07/tesla-takes-away-autopilot-used-car-sold-dealer/
        quote: >-
          Tesla has recently identified instances of customers being incorrectly configured for
          Autopilot versions that they did not pay for. Since, there was an audit done to correct
          these instances.
      - url: https://electrek.co/2020/02/07/tesla-takes-away-autopilot-used-car-sold-dealer/
        publisher: Electrek
        kind: press
        published: 2020-02-07
        archive: https://web.archive.org/web/20250108111539/https://electrek.co/2020/02/07/tesla-takes-away-autopilot-used-car-sold-dealer/
        quote: >-
          Alec still doesn’t have the features, and he is apparently not alone in this situation
          based on other reports on Tesla forums
