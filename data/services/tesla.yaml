  - id: autopilot-not-standard
    date: 2026-01-23
    date_kind: reported
    category: paywall
    title: Tesla drops Autosteer as standard on new Model 3 and Model Y, leaving it to FSD
    question: When did Tesla stop including Autopilot as standard?
    what_changed: >-
      Electrek reported on 23 January 2026 that Tesla had dropped Basic Autopilot as standard on new
      Model 3 and Model Y orders in North America. New cars kept Traffic-Aware Cruise Control, but
      Autosteer lane keeping, standard for nearly 7 years, now needed Full Self-Driving, at $99 a
      month or $8,000 before it went subscription only. The Netherlands followed in May 2026.
    before: Traffic-Aware Cruise Control and Autosteer standard
    after: Traffic-Aware Cruise Control only, Autosteer with Full Self-Driving
    user_impact: >-
      New Model 3 and Model Y buyers had to pay for Full Self-Driving to get the lane keeping that
      earlier cars had included.
    severity: 2
    status: in-force
    regions: [US, NL]
