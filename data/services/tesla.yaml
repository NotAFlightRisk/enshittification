        quote: >-
          Starting April 2024, any vehicle APIs not part of this list will be phased out.
      - url: https://developer.tesla.com/docs/fleet-api/billing-and-limits
        publisher: Tesla Fleet API
        kind: primary
        published: 2026-11-17
        archive: https://web.archive.org/web/20261117164931/https://developer.tesla.com/docs/fleet-api/billing-and-limits
        quote: >-
          A monthly discount of $10 is provided to support individual developers/small applications.
      - url: https://electrek.co/2024/11/28/tesla-releases-api-pricing-dev-says-would-cost-60-million-per-year-to-run-his-3rd-party-app/
        publisher: Electrek
        kind: press
        published: 2024-11-28
        archive: https://web.archive.org/web/20250722232251/https://electrek.co/2024/11/28/tesla-releases-api-pricing-dev-says-would-cost-60-million-per-year-to-run-his-3rd-party-app/
        quote: >-
          It doesn’t mean much to me, but the developer of the Tessie app
      - url: https://electrek.co/2024/11/28/tesla-releases-api-pricing-dev-says-would-cost-60-million-per-year-to-run-his-3rd-party-app/
        publisher: Electrek
        kind: press
        published: 2024-11-28
        archive: https://web.archive.org/web/20250722232251/https://electrek.co/2024/11/28/tesla-releases-api-pricing-dev-says-would-cost-60-million-per-year-to-run-his-3rd-party-app/
        quote: >-
          a third-party Tesla analytics and automation app, used it and said on Reddit that it would
