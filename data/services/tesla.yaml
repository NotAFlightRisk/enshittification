  - id: standard-connectivity-eight-years
    date: 2022-07-27
    date_kind: reported
    category: paywall
    title: Tesla limits free Standard Connectivity to 8 years on cars ordered after 20 July 2022
    what_changed: >-
      Electrek reported on 27 July 2022 that Tesla had put an 8 year limit on free Standard
      Connectivity, which covers maps and navigation. Cars ordered by 20 July 2022 keep it for life,
      while later orders, and used cars bought after that date, get it until 8 years from first
      delivery. Tesla said some connectivity features may be changed or removed after that.
    before: Standard Connectivity for the life of the car
    after: Standard Connectivity until 8 years from first delivery
    user_impact: >-
      People ordering a Tesla, or buying a used one, after 20 July 2022 face losing some connected
      features once the car is 8 years old, and Electrek said Tesla only mentioned buying Premium
      Connectivity after that.
    severity: 1
    status: in-force
    sources:
      - url: https://www.tesla.com/support/connectivity
        publisher: Tesla Support
        kind: primary
        published: 2022-08-02
        archive: https://web.archive.org/web/20220802070201/https://www.tesla.com/support/connectivity
        quote: >-
          Standard Connectivity is included in your vehicle, at no additional cost, for eight years
          beginning on the first day your vehicle was delivered as new by Tesla, or the first day it
          is put into service
      - url: https://www.tesla.com/support/connectivity
        publisher: Tesla Support
        kind: primary
        published: 2022-08-02
        archive: https://web.archive.org/web/20220802070201/https://www.tesla.com/support/connectivity
        quote: >-
          All new Tesla vehicles ordered on or before July 20, 2022, will have Standard Connectivity
          features at no cost for the lifetime of the vehicle
      - url: https://www.tesla.com/support/connectivity
        publisher: Tesla Support
        kind: primary
        published: 2022-08-02
        archive: https://web.archive.org/web/20220802070201/https://www.tesla.com/support/connectivity
        quote: >-
          All used Tesla vehicles purchased after July 20, 2022, will have Standard Connectivity for
          the remainder of the eight years from the first day your vehicle was delivered as new by
          Tesla
      - url: https://www.tesla.com/support/connectivity
        publisher: Tesla Support
        kind: primary
        published: 2022-08-02
        archive: https://web.archive.org/web/20220802070201/https://www.tesla.com/support/connectivity
        quote: >-
          Without Standard Connectivity, access to some connectivity features, including those that
          use cellular data or third-party licenses, may be changed or removed.
      - url: https://electrek.co/2022/07/27/tesla-end-unlimited-standard-connectivity-8-year-limit/
        publisher: Electrek
        kind: press
        published: 2022-07-27
        archive: https://web.archive.org/web/20231201034943/https://electrek.co/2022/07/27/tesla-end-unlimited-standard-connectivity-8-year-limit/
        quote: >-
          Tesla has finally put an end to its unlimited “Standard Connectivity” internet connection
          included in all Tesla vehicles with now a new generous eight-year time limit.
      - url: https://electrek.co/2022/07/27/tesla-end-unlimited-standard-connectivity-8-year-limit/
        publisher: Electrek
        kind: press
        published: 2022-07-27
        archive: https://web.archive.org/web/20231201034943/https://electrek.co/2022/07/27/tesla-end-unlimited-standard-connectivity-8-year-limit/
        quote: >-
          Interestingly, it doesn’t sound like Tesla planned to offer an option to buy Standard
          Connectivity after the eight-year period is over as Tesla only mentions buying Premium
          Connectivity after that
    added: 2026-11-25
    updated: 2026-11-25
    sources_checked: 2026-11-25
    status_checked: 2026-11-25

  - id: fleet-api-pay-per-use
    date: 2024-11-27
    date_kind: announced
    effective: 2025-01-01
    category: api-restriction
    title: Tesla starts charging third-party apps per use of its Fleet API
    what_changed: >-
      Tesla said on 27 November 2024 that its Fleet API, free since launch, would charge apps per
      use from 1 January 2025. Apps from countries where it couldn't take payment got limited usage
      instead. It had said in March that Fleet API was the only supported API and that other vehicle
      APIs would be phased out from April 2024. The developer of the Tessie app said the new pricing
      would cost him about $60m a year.
    before: Fleet API free for third-party apps
    after: Pay per use, with a $10 monthly discount for individual developers and small apps
    user_impact: >-
      Owners who used third-party apps like Tessie saw them face per-use API bills, which Electrek
      said would likely kill some useful third-party apps.
    severity: 3
    status: in-force
    sources:
      - url: https://developer.tesla.com/docs/fleet-api/announcements
        publisher: Tesla Fleet API
        kind: primary
        published: 2024-11-27
        archive: https://web.archive.org/web/20261112170154/https://developer.tesla.com/docs/fleet-api/announcements
        quote: >-
          Since launch, Fleet API has been made available to partners free of charge as part of the
          discovery period. Beginning January 1, 2025, Fleet API will begin charging for access.
      - url: https://developer.tesla.com/docs/fleet-api/announcements
        publisher: Tesla Fleet API
        kind: primary
        published: 2024-11-27
        archive: https://web.archive.org/web/20261112170154/https://developer.tesla.com/docs/fleet-api/announcements
        quote: >-
          Applications created from countries that do not support payment will have limited usage
          beginning in January 2025.
      - url: https://developer.tesla.com/docs/fleet-api/announcements
        publisher: Tesla Fleet API
        kind: primary
        published: 2024-03-26
        archive: https://web.archive.org/web/20261112170154/https://developer.tesla.com/docs/fleet-api/announcements
        quote: >-
          Fleet API is Tesla's official 3rd party API and the only supported API for vehicle
