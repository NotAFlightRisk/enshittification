changes:
  - id: premium-connectivity-paid
    date: 2018-06-23
    date_kind: reported
    effective: 2018-07-01
    category: paywall
    title: Tesla puts live traffic view, music streaming and the browser behind a subscription
    what_changed: >-
      Electrek reported on 23 June 2018 that Tesla cars ordered from 1 July would need paid Premium
      Connectivity for the live traffic view, streaming and the browser. The free Standard
      Connectivity kept maps and navigation. Model S, Model X and premium-interior Model 3 orders
      got a year of Premium free, cars ordered by 30 June 2018 kept it for life, and Tesla's page
      later put it at $9.99 a month or $99 a year.
    before: Live traffic, satellite maps, music streaming and the browser included
    after: A subscription, $9.99 a month by 2022, or maps and navigation only
    user_impact: >-
      People ordering a Tesla from July 2018 had to pay a subscription for the live traffic view,
      satellite maps, in-car streaming and the browser, after a free year on the models that got
      one.
    company_said: >-
      Electrek said Tesla was introducing the package to support the in-car internet features of its
      growing fleet.
    severity: 2
    status: in-force
    sources:
      - url: https://electrek.co/2018/06/23/tesla-new-paid-premium-connectivity-package-in-car-internet-features/
        publisher: Electrek
        kind: press
        published: 2018-06-23
        archive: https://web.archive.org/web/20260615050247/https://electrek.co/2018/06/23/tesla-new-paid-premium-connectivity-package-in-car-internet-features/
        quote: >-
          All current Tesla owners and those who order a Model S, Model X, or Model 3 before July
          1st will never have to pay to maintain the current level of internet connectivity in their
          cars.
      - url: https://electrek.co/2018/06/23/tesla-new-paid-premium-connectivity-package-in-car-internet-features/
        publisher: Electrek
        kind: press
        published: 2018-06-23
        archive: https://web.archive.org/web/20260615050247/https://electrek.co/2018/06/23/tesla-new-paid-premium-connectivity-package-in-car-internet-features/
        quote: >-
          they will not have access to the satellite maps or the live traffic visualization.
      - url: https://electrek.co/2018/06/23/tesla-new-paid-premium-connectivity-package-in-car-internet-features/
        publisher: Electrek
        kind: press
        published: 2018-06-23
        archive: https://web.archive.org/web/20260615050247/https://electrek.co/2018/06/23/tesla-new-paid-premium-connectivity-package-in-car-internet-features/
        quote: >-
          It will also include in-car streaming music and media, which has so far been included with
          apps like Slacker and Spotify. The internet browser will now be a part of the premium
          package
      - url: https://electrek.co/2018/06/23/tesla-new-paid-premium-connectivity-package-in-car-internet-features/
        publisher: Electrek
        kind: press
        published: 2018-06-23
        archive: https://web.archive.org/web/20260615050247/https://electrek.co/2018/06/23/tesla-new-paid-premium-connectivity-package-in-car-internet-features/
        quote: >-
          Tesla also says that Model S and Model X vehicles ordered on or after July 1st will
          receive a year of free ‘Premium Connectivity package’. Model 3 vehicles with the premium
          interior, which is a $5,000 option and the only current Model 3 interior in production,
          will also get the same deal.
      - url: https://electrek.co/2018/06/23/tesla-new-paid-premium-connectivity-package-in-car-internet-features/
        publisher: Electrek
        kind: press
        published: 2018-06-23
        archive: https://web.archive.org/web/20260615050247/https://electrek.co/2018/06/23/tesla-new-paid-premium-connectivity-package-in-car-internet-features/
        quote: >-
          Tesla is introducing a new paid ‘premium connectivity’ package to support the in-car
          internet features of its growing fleet.
      - url: https://www.tesla.com/support/connectivity
        publisher: Tesla Support
        kind: primary
        published: 2022-08-02
        archive: https://web.archive.org/web/20220802070201/https://www.tesla.com/support/connectivity
        quote: >-
          All vehicles ordered on or before June 30, 2018 receive Premium Connectivity automatically
          for the lifetime of the vehicle
      - url: https://www.tesla.com/support/connectivity
        publisher: Tesla Support
        kind: primary
        published: 2022-08-02
        archive: https://web.archive.org/web/20220802070201/https://www.tesla.com/support/connectivity
        quote: >-
          Premium Connectivity currently is available as a monthly subscription of $9.99 plus
          applicable tax or as an annual subscription of $99 plus applicable tax
    added: 2026-11-25
    updated: 2026-11-25
    sources_checked: 2026-11-25
    status_checked: 2026-11-25

  - id: battery-update-range-cut
    date: 2019-06-20
    date_kind: reported
    category: removed-feature
    title: Tesla's battery update cuts the range of older Model S and Model X cars
    what_changed: >-
      Electrek reported on 20 June 2019 that owners of older Model S and Model X cars with 85 kWh
      packs had lost 12 to 30 miles of range after the 2019.16 updates. Tesla confirmed the range
      reduction was due to the update, having said on 15 May that it was revising charge and thermal
      settings over the air after several Model S fires.
    before: Range before the 2019.16 updates
    after: 12 to 30 miles less range for some 85 kWh cars
    user_impact: >-
      Some owners of older Model S and Model X cars with 85 kWh packs lost range on cars they
      already owned, which Tesla said was only a small percentage of owners, and Electrek later
      reported slower Supercharging too.
    company_said: >-
      Tesla said the update was out of an abundance of caution, to help protect the battery and
      improve battery longevity.
    severity: 2
    status: reversed
    reversed:
      date: 2021-07-30
      what: >-
        Electrek reported that Tesla had pushed software updates to restore the capacity, though
        some owners still had battery capacity issues, as it moved to settle a US class action over
        it.
      sources:
        - url: https://electrek.co/2021/07/30/tesla-agrees-pay-owners-battery-throttling-class-action-lawsuit/
          publisher: Electrek
          kind: press
          published: 2021-07-30
          archive: https://web.archive.org/web/20250922032242/https://electrek.co/2021/07/30/tesla-agrees-pay-owners-battery-throttling-class-action-lawsuit/
          quote: >-
            Two years later, Tesla has pushed some software updates to restore the capacity, and it
            is now ready to settle the matter.
        - url: https://electrek.co/2021/07/30/tesla-agrees-pay-owners-battery-throttling-class-action-lawsuit/
          publisher: Electrek
          kind: press
          published: 2021-07-30
          archive: https://web.archive.org/web/20250922032242/https://electrek.co/2021/07/30/tesla-agrees-pay-owners-battery-throttling-class-action-lawsuit/
          quote: >-
            who confirmed that his own car saw its capacity restored, but he is aware of some owners
            who still have had battery capacity issues since the update.
    sources:
      - url: https://electrek.co/2019/06/20/tesla-battery-range-drop-software-update-longevity/
        publisher: Electrek
        kind: press
        published: 2019-06-20
        archive: https://web.archive.org/web/20260614202258/https://electrek.co/2019/06/20/tesla-battery-range-drop-software-update-longevity/
        quote: >-
          Over the last week, we received several reports from Tesla owners about seeing significant
          drops in range from 12 to 30 miles over a short period of time.
      - url: https://electrek.co/2019/06/20/tesla-battery-range-drop-software-update-longevity/
        publisher: Electrek
        kind: press
        published: 2019-06-20
        archive: https://web.archive.org/web/20260614202258/https://electrek.co/2019/06/20/tesla-battery-range-drop-software-update-longevity/
        quote: >-
          Only Model S and Model X vehicles with 85 kWh battery packs, which were discontinued in
          2016, seem to be affected at this point.
      - url: https://electrek.co/2019/06/20/tesla-battery-range-drop-software-update-longevity/
        publisher: Electrek
        kind: press
        published: 2019-06-20
        archive: https://web.archive.org/web/20260614202258/https://electrek.co/2019/06/20/tesla-battery-range-drop-software-update-longevity/
        quote: >-
          For most owners, the range drop happened after updating to Tesla’s 2019.16.1 and .2
          software updates.
      - url: https://electrek.co/2019/06/20/tesla-battery-range-drop-software-update-longevity/
        publisher: Electrek
        kind: press
        published: 2019-06-20
        archive: https://web.archive.org/web/20260614202258/https://electrek.co/2019/06/20/tesla-battery-range-drop-software-update-longevity/
        quote: >-
          We contacted Tesla about the issue and the company confirmed to Electrek that the range
          reduction is due to the software update.
      - url: https://electrek.co/2019/06/20/tesla-battery-range-drop-software-update-longevity/
        publisher: Electrek
        kind: press
        published: 2019-06-20
        archive: https://web.archive.org/web/20260614202258/https://electrek.co/2019/06/20/tesla-battery-range-drop-software-update-longevity/
        quote: >-
          it resulted in a range loss for only “a small percentage of owners.”
      - url: https://electrek.co/2019/05/15/tesla-fiire-update-battery-software/
        publisher: Electrek
        kind: press
        published: 2019-05-15
        archive: https://web.archive.org/web/20231216025906/https://electrek.co/2019/05/15/tesla-fiire-update-battery-software/
        quote: >-
          As we continue our investigation of the root cause, out of an abundance of caution, we are
          revising charge and thermal management settings on Model S and Model X vehicles via an
          over-the-air software update that will begin rolling out today, to help further protect
          the battery and improve battery longevity.
      - url: https://electrek.co/2021/07/30/tesla-agrees-pay-owners-battery-throttling-class-action-lawsuit/
        publisher: Electrek
        kind: press
        published: 2021-07-30
        archive: https://web.archive.org/web/20250922032242/https://electrek.co/2021/07/30/tesla-agrees-pay-owners-battery-throttling-class-action-lawsuit/
        quote: >-
          On top of the range loss, the DC fast-charging rate at Supercharger stations has also been
          reduced.
    added: 2026-11-25
    updated: 2026-11-25
    sources_checked: 2026-11-25
    status_checked: 2026-11-25

  - id: used-car-autopilot-removed
    date: 2020-02-06
    date_kind: reported
    category: removed-feature
    title: Tesla removes paid Autopilot and Full Self-Driving from a used Model S over the air
    what_changed: >-
      Jalopnik reported on 6 February 2020 that Tesla had remotely removed Autopilot and Full
      Self-Driving from a used 2017 Model S. Tesla had sold it at auction with both on the sticker,
      worth $8,000 together, audited it 3 days later, and a later software update took them away
      from the owner who then bought it from the dealer.
    before: Enhanced Autopilot and Full Self-Driving, as listed when the car was sold
    after: Both removed, with Tesla offering to sell them again
    user_impact: >-
      The owner lost features listed on the car he bought, and Electrek said he was apparently not
      alone, going by other reports on Tesla's forums.
    company_said: >-
      Tesla's customer service said an audit had corrected cars incorrectly configured for Autopilot
      versions that hadn't been paid for, and offered to sell the owner the upgrade.
    severity: 3
    status: reversed
    reversed:
      date: 2020-02-13
      what: >-
        The Verge reported that Tesla had restored the features days after Jalopnik's story, and
        that a Tesla rep told the owner it had been a miscommunication.
      sources:
        - url: https://www.theverge.com/2020/2/13/21136699/tesla-autopilot-used-model-s-owner-restored-assistance-features
          publisher: The Verge
          kind: press
          published: 2020-02-13
          archive: https://web.archive.org/web/20260907164246/https://www.theverge.com/2020/2/13/21136699/tesla-autopilot-used-model-s-owner-restored-assistance-features
          quote: >-
            Tesla has restored the Autopilot driver assistance features it remotely disabled on a
            used Model S, just days after Jalopnik published a story about the customer's ordeal.
        - url: https://www.theverge.com/2020/2/13/21136699/tesla-autopilot-used-model-s-owner-restored-assistance-features
          publisher: The Verge
          kind: press
          published: 2020-02-13
          archive: https://web.archive.org/web/20260907164246/https://www.theverge.com/2020/2/13/21136699/tesla-autopilot-used-model-s-owner-restored-assistance-features
          quote: >-
            Alec said he was contacted by a Tesla customer experience rep who "apologized for my
            troubles, told me that Tesla has restored all missed options" and "cited a
            miscommunication"
    sources:
      - url: https://jalopnik.com/tesla-remotely-removes-autopilot-features-from-customer-1841472617
        publisher: Jalopnik
        kind: press
        published: 2020-02-06
        archive: https://web.archive.org/web/20200206215223/https://jalopnik.com/tesla-remotely-removes-autopilot-features-from-customer-1841472617
        quote: >-
          When the dealer bought the car at auction from Tesla on November 15, it was optioned with
          both Enhanced Autopilot and Tesla’s confusingly-named Full Self Driving Capability;
          together, these options totaled $8,000.
      - url: https://jalopnik.com/tesla-remotely-removes-autopilot-features-from-customer-1841472617
        publisher: Jalopnik
        kind: press
        published: 2020-02-06
        archive: https://web.archive.org/web/20200206215223/https://jalopnik.com/tesla-remotely-removes-autopilot-features-from-customer-1841472617
        quote: On November 18, Tesla seems to have conducted an “audit” of the car remotely.
      - url: https://electrek.co/2020/02/07/tesla-takes-away-autopilot-used-car-sold-dealer/
        publisher: Electrek
        kind: press
        published: 2020-02-07
        archive: https://web.archive.org/web/20250108111539/https://electrek.co/2020/02/07/tesla-takes-away-autopilot-used-car-sold-dealer/
        quote: >-
          Tesla has remotely deactivated Autopilot features in a Model S that it sold to a
          third-party dealer who then sold it to the owner.
      - url: https://electrek.co/2020/02/07/tesla-takes-away-autopilot-used-car-sold-dealer/
        publisher: Electrek
        kind: press
        published: 2020-02-07
        archive: https://web.archive.org/web/20250108111539/https://electrek.co/2020/02/07/tesla-takes-away-autopilot-used-car-sold-dealer/
        quote: >-
          November 15: Tesla sells a 2017 Model S with Autopilot and FSD to a third-party dealer
