changes:
  - id: third-party-apps-blocked
    date: 2023-10-25
    date_kind: announced
    category: api-restriction
    title: Chamberlain blocks Home Assistant and other unofficial apps from myQ garage doors
    what_changed: >-
      Chamberlain said on 25 October 2023 that it was blocking unauthorised third-party apps from
      myQ, which broke Home Assistant and Homebridge. Home Assistant, which had a MyQ integration
      since 2017, said it would remove it on 6 December 2023, as it wouldn't pay the partnership fee
      Chamberlain's authorised partners pay. Chamberlain pointed owners to those partners, which The
      Verge said were mostly security companies with monthly subscriptions and car makers.
    before: Home Assistant, Homebridge and other apps could run myQ garage doors
    after: The myQ app, Chamberlain's own integrations and paying partners, with unofficial apps blocked
    user_impact: >-
      Owners who ran their garage doors through Home Assistant, Homebridge and other unofficial
      apps lost those integrations, which Chamberlain said came from 0.2% of myQ users.
    company_said: >-
      Chamberlain said unauthorised integrations had made up more than half of myQ's traffic, at
      times a substantial DDoS, and that blocking them would improve myQ's performance and
      reliability.
    severity: 4
    status: in-force
    sources:
      - url: https://chamberlaingroup.com/press/a-message-about-our-decision-to-prevent-unauthorized-usage-of-myq
        publisher: Chamberlain Group
        kind: primary
        published: 2023-10-25
        archive: https://web.archive.org/web/20260811122350/https://chamberlaingroup.com/press/a-message-about-our-decision-to-prevent-unauthorized-usage-of-myq
        quote: >-
          Chamberlain Group recently made the decision to prevent unauthorized usage of our myQ
