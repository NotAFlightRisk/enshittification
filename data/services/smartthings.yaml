  - id: groovy-shutdown
    date: 2022-08-17
    date_kind: announced
    effective: 2023-01
    category: api-restriction
    title: SmartThings ends Groovy SmartApps and custom device handlers
    what_changed: >-
      SmartThings said on 17 August 2022 that it would retire Groovy, which ran custom device
      handlers and SmartApps, and later set 31 December 2022 to end both. It pushed that into early
      2023, said in January 2023 that it would start shutting down Groovy SmartApps the following
      week, and said in March 2023 that devices on community-made handlers would move to its own
      drivers, or a placeholder, from 15 April 2023.
    user_impact: >-
      Community-made SmartApps and the cloud-connected devices that relied on them would no longer
      work unless their maker moved them to the newer platform, and devices with no newer driver
      could end up as a placeholder that no longer works in the app.
    company_said: >-
      SmartThings said its newer platform had increased reliability, decreased latency and reduced
      the need for data to leave the home.
    severity: 4
    status: in-force
    related: [smartthings/hub-v1-shutdown]
    sources:
      - url: https://community.smartthings.com/t/the-end-of-groovy-has-arrived/246280
        publisher: SmartThings Community
        kind: primary
        published: 2022-08-17
        archive: https://web.archive.org/web/20221204080037/https://community.smartthings.com/t/the-end-of-groovy-has-arrived/246280/
        quote: >-
          On October 15th 2022 certain functions of the legacy developer IDE, such as the creation of
          new DTH’s, Smartapps, and debugging tools will be removed from the SmartThings platform and
          will no longer be supported.
      - url: https://community.smartthings.com/t/the-end-of-groovy-has-arrived/246280
        publisher: SmartThings Community
        kind: primary
        published: 2022-08-17
        archive: https://web.archive.org/web/20221204080037/https://community.smartthings.com/t/the-end-of-groovy-has-arrived/246280/
        quote: >-
