changes:
  - id: hub-v1-shutdown
    date: 2021-03
    date_kind: announced
    effective: 2021-07
    category: bricked
    title: SmartThings discontinues its original 2013 hub and the Link for Nvidia Shield
    what_changed: >-
      SmartThings said in March 2021 that its original 2013 hub and the Link for Nvidia Shield would
      stop working after 30 June 2021. Eligible owners got a limited-time offer of an Aeotec Smart
      Home Hub for $35, and US owners still under warranty could apply for a refund that depended on
      the hub's age. There was no migration tool, so every device on the old hub had to be unpaired
      and paired again with the new one.
    user_impact: >-
      Owners of those hubs would no longer be able to control or automate their Zigbee, Z-Wave or LAN
      devices in SmartThings without a new hub, and automations that relied on the old one could be
      deleted.
    company_said: >-
      SmartThings had listed retiring select legacy hubs in a 2020 plan to move to services it said
      offered lower latency, higher reliability and local execution.
    severity: 5
    status: in-force
    related: [smartthings/groovy-shutdown]
    sources:
      - url: https://support.smartthings.com/hc/en-us/articles/360055814272
        publisher: SmartThings Support
        kind: primary
        published: 2021-03-01
        archive: https://web.archive.org/web/20210301155517/https://support.smartthings.com/hc/en-us/articles/360055814272
        quote: >-
          What happens to my SmartThings hub after June 30, 2021? Your SmartThings Hub (2013) or
          SmartThings Link for NVIDIA® SHIELD™ will no longer work
      - url: https://support.smartthings.com/hc/en-us/articles/360055814272
        publisher: SmartThings Support
        kind: primary
        published: 2021-03-01
        archive: https://web.archive.org/web/20210301155517/https://support.smartthings.com/hc/en-us/articles/360055814272
        quote: >-
          However, without a SmartThings hub, you will no longer be able to automate and control
          Zigbee, Z-Wave, or LAN devices. To continue using these smart home devices, eligible
          customers may opt to purchase a new SmartThings compatible Aeotec Smart Home Hub for $35 --
          that is 65% off the retail price.
      - url: https://support.smartthings.com/hc/en-us/articles/360055814272
        publisher: SmartThings Support
        kind: primary
