  - id: block-shows-public-posts-2024
    date: 2024-11
    date_kind: effective
    category: removed-feature
    title: X lets accounts you've blocked see your public posts
    question: Can blocked accounts see my posts on X?
    what_changed: >-
      X started rolling out a change to blocking in November 2024 so that accounts you block can see
      your public posts, though they still can't engage with them.
    user_impact: >-
      Accounts people had blocked could read their public posts while logged in, which blocking used
      to stop.
    company_said: >-
      X said blocking could be used to share and hide harmful or private information about the people
      doing the blocking.
    severity: 2
    status: in-force
    sources:
