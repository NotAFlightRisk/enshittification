  - id: grok-training-default-2024
    date: 2024-07-26
    date_kind: reported
    category: ai
    title: X opts users in to training its Grok AI on their public posts
    what_changed: >-
      X was found in July 2024 to have turned on a setting for every account, without telling anyone,
      that let it train its Grok AI on people's posts. Its help page said posts and Grok chats may be
      used for training and fine-tuning, with an opt-out that at first was only on the website.
    user_impact: >-
      Public posts could be used to train Grok unless people found the setting and turned it off, or
      made their account private.
    company_said: >-
      X said it used posts and Grok chats to improve Grok's understanding of language and the answers
      it gives.
    severity: 1
    status: in-force
    sources:
      - url: https://help.x.com/en/using-x/about-grok
        publisher: X Help Center
        kind: primary
        published: 2024-08-04
        archive: https://web.archive.org/web/20240804041616/https://help.x.com/en/using-x/about-grok
        quote: >-
          To continuously improve your experience, we may utilize your X posts as well as your user
          interactions, inputs and results with Grok for training and fine-tuning purposes.
      - url: https://help.x.com/en/using-x/about-grok
        publisher: X Help Center
        kind: primary
        published: 2024-08-04
        archive: https://web.archive.org/web/20240804041616/https://help.x.com/en/using-x/about-grok
        quote: >-
