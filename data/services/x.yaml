    sources_checked: 2026-11-20
    status_checked: 2026-11-20

  - id: legacy-checkmarks-removed-2023
    date: 2023-04-20
    date_kind: effective
    category: paywall
    title: Twitter removes free blue checks, keeping them only for paying subscribers
    question: When did Twitter remove legacy blue checks?
    what_changed: >-
      Twitter removed blue checkmarks from accounts verified under its old free programme on 20 April
      2023, unless they paid for Twitter Blue. It had said accounts verified as active, notable and
      authentic would not keep the check without a subscription.
    user_impact: >-
      Accounts verified for free, such as people in media and government and others at risk of
      impersonation, lost the check unless they paid for Twitter Blue.
    severity: 1
    status: in-force
    sources:
      - url: https://help.twitter.com/en/managing-your-account/about-twitter-verified-accounts
        publisher: Twitter Help Center
        kind: primary
        published: 2023-04-25
        archive: https://web.archive.org/web/20230425215746/https://help.twitter.com/en/managing-your-account/about-twitter-verified-accounts
        quote: >-
          Starting April 1, we’ll be winding down our legacy Verification program and accounts that
          were verified under the previous criteria (active, notable, and authentic) will not retain a
          blue checkmark unless they are subscribed to Twitter Blue.
      - url: https://www.cnbc.com/2023/04/20/twitter-finally-removes-legacy-verification-checkmarks.html
        publisher: CNBC
        kind: press
        published: 2023-04-20
        archive: https://web.archive.org/web/20230422024908/https://www.cnbc.com/2023/04/20/twitter-finally-removes-legacy-verification-checkmarks.html
        quote: >-
          Twitter removed blue legacy check marks from nonpaying users' accounts on Thursday, weeks
          after the Elon Musk-owned company initially announced that the changes would begin.
      - url: https://www.cnbc.com/2023/04/20/twitter-finally-removes-legacy-verification-checkmarks.html
        publisher: CNBC
        kind: press
        published: 2023-04-20
        archive: https://web.archive.org/web/20230422024908/https://www.cnbc.com/2023/04/20/twitter-finally-removes-legacy-verification-checkmarks.html
        quote: >-
          Before Elon Musk acquired the platform, verification was given out to users in media and
          government, or those at heightened risk of impersonation.
    added: 2026-11-20
    updated: 2026-11-20
    sources_checked: 2026-11-20
    status_checked: 2026-11-20

