changes:
  - id: blue-price-2022
    date: 2022-07-28
    date_kind: announced
    category: price-rise
    title: Twitter Blue goes from $2.99 to $4.99 a month, its first US rise
    what_changed: >-
      Twitter raised US Twitter Blue from $2.99 to $4.99 a month on 28 July 2022. New subscribers
      paid it at once and existing ones from October.
    before: $2.99 a month
    after: $4.99 a month
    user_impact: >-
      US Twitter Blue subscribers paid the new price from October at the latest, and the same rise
      came in Canada, Australia and New Zealand.
    company_said: >-
      Twitter told subscribers the change would help it build the features they'd asked for,
      improve the current ones and sustain its mission of supporting journalism.
    severity: 2
    status: in-force
    regions: [US, CA, AU, NZ]
    prices:
      - { plan: premium-us, from: 2.99, to: 4.99 }
    sources:
      - url: https://techcrunch.com/2022/07/28/twitter-is-increasing-the-price-of-twitter-blue-from-2-99-to-4-99-per-month/
        publisher: TechCrunch
        kind: press
        published: 2022-07-28
        archive: https://web.archive.org/web/20220729050704/https://techcrunch.com/2022/07/28/twitter-is-increasing-the-price-of-twitter-blue-from-2-99-to-4-99-per-month/
        quote: >-
          Twitter is increasing the price of its subscription service, Twitter Blue, from $2.99 to
          $4.99 per month. Starting in October, existing subscribers will have to pay more.
      - url: https://help.twitter.com/en/using-twitter/twitter-blue
        publisher: Twitter Help Center
        kind: primary
        published: 2022-07-28
        archive: https://web.archive.org/web/20220814114448/https://help.twitter.com/en/using-twitter/twitter-blue
        quote: >-
          Twitter Blue subscriptions are paid on a monthly basis, and priced regionally based on
          the current US price of $4.99.
    added: 2026-11-20
    updated: 2026-11-20
    sources_checked: 2026-11-20
    status_checked: 2026-11-20

  - id: blue-price-2022-12
    date: 2022-12-10
    date_kind: announced
    effective: 2022-12-12
    category: price-rise
    title: Twitter Blue goes from $4.99 to $8 a month on the web and $11 on iOS
    what_changed: >-
      Twitter said on 10 December 2022 that Twitter Blue would relaunch that Monday at $8 a month on
      the web and $11 on iOS, up from $4.99. People who'd subscribed on iOS at $2.99 or $4.99 had to
      move to the new price or lose their subscription.
    before: $4.99 a month
    after: $8 a month on the web, $11 on iOS
    user_impact: >-
      Blue subscribers on iOS paid more: the old $2.99 and $4.99 ones had to upgrade or lose it, and
      those who'd joined for $7.99 were renewed at $11 a month unless they cancelled.
    severity: 2
    status: in-force
    regions: [US]
    prices:
      - { plan: premium-us, from: 4.99, to: 8 }
    sources:
      - url: https://techcrunch.com/2022/12/11/twitter-blue-to-relaunch-with-actual-verification-process-higher-price-for-apple-users/
        publisher: TechCrunch
        kind: press
        published: 2022-12-11
        archive: https://web.archive.org/web/20221211234850/https://techcrunch.com/2022/12/11/twitter-blue-to-relaunch-with-actual-verification-process-higher-price-for-apple-users/
        quote: >-
          Web sign-ups will cost $8 per month and iOS sign ups will cost $11 per month for "access
          to subscriber-only features, including the blue checkmark," per a tweet from the company
          account.
      - url: https://help.twitter.com/en/using-twitter/twitter-blue
        publisher: Twitter Help Center
        kind: primary
        published: 2022-12
        archive: https://web.archive.org/web/20221213233736/https://help.twitter.com/en/using-twitter/twitter-blue
        quote: >-
          Those who initially subscribed on iOS for $2.99 or $4.99/month will need to upgrade their
          subscription for $8/month on web or $11/month on iOS, or lose their subscription.
    added: 2026-11-20
    updated: 2026-11-20
    sources_checked: 2026-11-20
    status_checked: 2026-11-20

  - id: third-party-clients-cut-off
    date: 2023-01-12
    date_kind: effective
    category: api-restriction
    title: Twitter cuts off third-party apps like Tweetbot and Twitterrific, then bans them
    question: When did Twitter stop third-party apps?
    what_changed: >-
      Twitter cut off third-party apps such as Tweetbot and Twitterrific from 12 January 2023, with
      no word to their developers. On 19 January it added a clause to its developer agreement
      banning apps that substitute for its own.
    user_impact: >-
      People using Tweetbot, Twitterrific, Fenix and other third-party apps had to move to Twitter's
      own apps, and Twitterrific was discontinued.
    company_said: Twitter said it was "enforcing long-standing API rules", without saying which.
    severity: 4
    status: in-force
    sources:
      - url: https://developer.twitter.com/en/developer-terms/agreement-and-policy
        publisher: Twitter Developer Platform
        kind: primary
        published: 2023-01-19
        archive: https://web.archive.org/web/20230125003826/https://developer.twitter.com/en/developer-terms/agreement-and-policy
        quote: >-
          use or access the Licensed Materials to create or attempt to create a substitute or similar
          service or product to the Twitter Applications
      - url: https://www.theverge.com/2023/1/19/23562947/twitter-third-party-client-tweetbot-twitterific-ban-rules
        publisher: The Verge
        kind: press
        published: 2023-01-19
        archive: https://web.archive.org/web/20260904221350/https://www.theverge.com/2023/1/19/23562947/twitter-third-party-client-tweetbot-twitterific-ban-rules
        quote: >-
          The rule change comes after Twitter silently broke several popular third-party Twitter
          clients like Tweetbot and Twitterific starting on January 12th.
      - url: https://www.engadget.com/twitter-new-developer-terms-ban-third-party-clients-211247096.html
        publisher: Engadget
        kind: press
        published: 2023-01-19
        archive: https://web.archive.org/web/20261117193154/https://www.engadget.com/twitter-new-developer-terms-ban-third-party-clients-211247096.html
        quote: >-
          Twitter previously said it was "enforcing long-standing API rules," but hadn't cited which
          rules developers were violating.
    added: 2026-11-20
    updated: 2026-11-20
    sources_checked: 2026-11-20
    status_checked: 2026-11-20

  - id: sms-2fa-paywall
    date: 2023-02-15
    date_kind: announced
    effective: 2023-03-20
    category: paywall
    title: Twitter makes text-message 2FA a Twitter Blue feature
    what_changed: >-
      Twitter said on 15 February 2023 that only Twitter Blue subscribers could use text-message
      2FA to log in. Non-subscribers using it had until 20 March to switch to an app or security
      key, after which their text-message 2FA was turned off.
    before: Text-message 2FA free for everyone
    after: Text-message 2FA for subscribers only
    user_impact: >-
      In December 2021, 74 percent of the 2.6 percent of users with 2FA on used text messages, and
      free app and key methods stayed.
    company_said: >-
      Twitter said it had seen phone-number based 2FA used, and abused, by bad actors.
    severity: 1
    status: in-force
    sources:
      - url: https://blog.twitter.com/en_us/topics/product/2023/an-update-on-two-factor-authentication-using-sms-on-twitter
        publisher: Twitter Blog
        kind: primary
        published: 2023-02-15
        archive: https://web.archive.org/web/20231209050143/https://blog.twitter.com/en_us/topics/product/2023/an-update-on-two-factor-authentication-using-sms-on-twitter
        quote: >-
          After 20 March 2023, we will no longer permit non-Twitter Blue subscribers to use text
          messages as a 2FA method.
      - url: https://help.x.com/en/managing-your-account/two-factor-authentication
        publisher: X Help Center
        kind: primary
        published: 2026-11-16
        archive: https://web.archive.org/web/20261116191912/https://help.x.com/en/managing-your-account/two-factor-authentication
        quote: >-
          Effective March 20, 2023, we will no longer support two-factor authentication using text
          messages for non-Premium subscribers.
      - url: https://www.theverge.com/2023/2/17/23605073/twitter-blue-charge-sms-2fa
        publisher: The Verge
        kind: press
        published: 2023-02-17
        archive: https://web.archive.org/web/20261021194058/https://www.theverge.com/2023/2/17/23605073/twitter-blue-charge-sms-2fa
        quote: >-
          Twitter's own transparency data shows that as of December 2021, only 2.6 percent of Twitter
          users had 2FA turned on, and 74 percent of those users were using SMS as their 2FA method.
    added: 2026-11-20
    updated: 2026-11-20
    sources_checked: 2026-11-20
    status_checked: 2026-11-20

  - id: free-api-ends
    date: 2023-03-29
    date_kind: announced
    category: api-restriction
    title: Twitter ends free read access to its API and charges $100 a month for Basic
    what_changed: >-
      Twitter announced paid API tiers on 29 March 2023, leaving a write-only free tier and charging
      $100 a month for Basic. It had said on 2 February that free access would end, and announced no
      dedicated replacement for academic access.
    before: Free read and write access to the API
    after: Free is write-only, Basic costs $100 a month
    user_impact: >-
      Hobby bots, small tools and researchers lost free read access, and some developers said they'd
      shut their projects or pass the fees on to users.
    company_said: >-
      Elon Musk said the free API was "being abused badly" by "bot scammers & opinion manipulators".
    severity: 4
    status: in-force
    related: [x/third-party-clients-cut-off]
    sources:
