changes:
  - id: servers-shutdown
    date: 2024-04-01
    date_kind: effective
    category: bricked
    title: Ubisoft shuts down The Crew's servers, and the game stops working on every platform
    question: When did The Crew shut down?
    what_changed: >-
      Ubisoft shut down The Crew's servers on 1 April 2024, and the online-only game can no longer
      be played on any platform. Ubisoft announced it on 14 December 2023, when it took the
      game and its virtual currency packs off sale, and pointed recent buyers to their store's
      refund policy. By 12 April 2024 it had also revoked the game's licence for people who owned it
      on Ubisoft Connect.
    user_impact: >-
      All owners lost access to The Crew on every platform, including its single-player campaign.
    company_said: >-
      Ubisoft said shutting it down had become a necessity due to upcoming server infrastructure
      and licensing constraints.
    severity: 5
    status: in-force
    sources:
