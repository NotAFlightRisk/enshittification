  - id: new-outlook-imap-sync
    date: 2023-11-10
    date_kind: reported
    category: tracking
    title: The new Outlook for Windows sends IMAP passwords to Microsoft and syncs mail through it
    what_changed: >-
      Heise's c't magazine reported on 10 November 2023 that the new Outlook for Windows sends IMAP
      account passwords to Microsoft. It sends the server, user name and password, and Microsoft's
      cloud then syncs the mail. Microsoft told heise it stores those credentials, encrypted, in the
      user's mailbox. The new Outlook replaced Windows Mail and Calendar, which stopped sending and
      receiving email after 31 December 2024.
    user_impact: >-
      People who added an IMAP account that signs in with a password to the new Outlook had the
      password and a copy of their mail stored by Microsoft, and Windows Mail users were pointed to
      the new Outlook when Mail stopped working.
    company_said: >-
      Microsoft said syncing IMAP accounts gives a consistent experience for every account added to
      Outlook, such as mail search being able to mark emails as read or unread.
    severity: 2
    status: in-force
    sources:
      - url: https://www.heise.de/en/news/Microsoft-lays-hands-on-login-data-Beware-of-the-new-Outlook-9608798.html
        publisher: heise online
        kind: press
        published: 2023-11-10
        archive: https://web.archive.org/web/20240126130534/https://www.heise.de/en/news/Microsoft-lays-hands-on-login-data-Beware-of-the-new-Outlook-9608798.html
        quote: >-
          When creating an IMAP account, c't was able to sniff the traffic between new Outlook and
          the Microsoft servers. It contained the target server, log-in name and password which were
          sent to those Servers of Microsoft.
      - url: https://support.microsoft.com/en-us/office/sync-your-account-in-outlook-to-the-microsoft-cloud-985f9e19-d308-4e85-9d1d-0c6f32f8e981
        publisher: Microsoft Support
        kind: primary
        published: 2026-05-10
        archive: https://web.archive.org/web/20260510010508/https://support.microsoft.com/en-us/office/sync-your-account-in-outlook-to-the-microsoft-cloud-985f9e19-d308-4e85-9d1d-0c6f32f8e981
        quote: >-
          Syncing your account to the Microsoft Cloud means that a copy of your email, calendar, and
          contacts will be synchronized between your email provider and Microsoft data centers.
      - url: https://www.heise.de/news/Neues-Outlook-Microsoft-bezieht-Stellung-zur-Uebertragung-von-Zugangsdaten-9528869.html
        publisher: heise online
        kind: press
        published: 2023-11-15
        archive: https://web.archive.org/web/20231115183052/https://www.heise.de/news/Neues-Outlook-Microsoft-bezieht-Stellung-zur-Uebertragung-von-Zugangsdaten-9528869.html
        quote: >-
          Zugangsdaten zu IMAP-Anbietern, deren Server Microsoft mit dem BasicAuth-Verfahren
          kontakiert, speichern wir als Benutzertoken in verschlüsselter Form in der Mailbox der
          Anwender
      - url: https://www.heise.de/news/Neues-Outlook-Microsoft-bezieht-Stellung-zur-Uebertragung-von-Zugangsdaten-9528869.html
        publisher: heise online
        kind: press
        published: 2023-11-15
        archive: https://web.archive.org/web/20231115183052/https://www.heise.de/news/Neues-Outlook-Microsoft-bezieht-Stellung-zur-Uebertragung-von-Zugangsdaten-9528869.html
        quote: >-
          Das Synchronisieren der IMAP-Konten der Nutzer hilft, eine konsistente Nutzererfahrung für
          alle in Outlook hinzugefügte Konten zu liefern.
      - url: https://support.microsoft.com/en-us/office/outlook-for-windows-the-future-of-mail-calendar-and-people-on-windows-11-715fc27c-e0f4-4652-9174-47faa751b199
        publisher: Microsoft Support
