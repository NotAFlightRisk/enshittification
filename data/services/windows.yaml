  - id: start-menu-store-apps
    date: 2024-04-23
    date_kind: announced
    effective: 2024-05-14
    category: ads
    title: Windows 11 puts Microsoft Store apps in the Start menu's Recommended section
    question: Can you turn off ads in the Windows 11 Start menu?
    what_changed: >-
      Microsoft said on 23 April 2024 that the Recommended section of the Windows 11 Start menu
      would show some Microsoft Store apps. They come from a small set of curated developers, and
      they show unless you turn off "Show recommendations for tips, app promotions, and more" in
      Settings > Personalization > Start. It came in an optional update first, then in the May
      2024 security update.
    user_impact: >-
      Windows 11 users on versions 22H2 and 23H2 started getting app promotions in the Start menu as
      the change rolled out, unless they turned the setting off.
    company_said: Microsoft said it would help people discover some of the great apps that are available.
    severity: 1
    status: in-force
    sources:
      - url: https://support.microsoft.com/en-us/topic/april-23-2024-kb5036980-os-builds-22621-3527-and-22631-3527-preview-5a0d6c49-e42e-4eb4-8541-33a7139281ed
