  - id: onedrive-backup-at-setup
    date: 2024-06-24
    date_kind: reported
    category: tracking
    title: Windows 11 setup turns on OneDrive folder backup without asking
    question: Why is OneDrive backing up my desktop in Windows 11?
    what_changed: >-
      Neowin reported on 24 June 2024 that Windows 11 setup was turning on OneDrive folder backup
      without asking when you sign in with a Microsoft account. People reached the desktop with
      folders like Desktop, Documents and Pictures already syncing to OneDrive, where before you had
      to turn backup on yourself. It can be turned off afterwards, and isn't turned on for local
      accounts or existing installs.
    user_impact: >-
      People setting up a new Windows 11 PC with a Microsoft account could find their folders
      syncing to OneDrive without being asked, and anyone who filled its free 5GB was prompted to
      pay for more.
    severity: 2
    status: in-force
    sources:
      - url: https://www.theregister.com/2024/06/26/microsoft_makes_onedrive_avoidance_trickier/
        publisher: The Register
        kind: press
        published: 2024-06-26
        archive: https://web.archive.org/web/20240626185406/https://www.theregister.com/2024/06/26/microsoft_makes_onedrive_avoidance_trickier/
        quote: >-
          a change in Windows 11's setup for new devices has resulted in OneDrive being fired up for
          automatic folder backup without first asking for authorization.
      - url: https://www.theregister.com/2024/06/26/microsoft_makes_onedrive_avoidance_trickier/
        publisher: The Register
        kind: press
        published: 2024-06-26
        archive: https://web.archive.org/web/20240626185406/https://www.theregister.com/2024/06/26/microsoft_makes_onedrive_avoidance_trickier/
        quote: >-
          The feature can be turned off – and won't be turned on for users able to dodge the
          Microsoft Account requirement or for existing Windows 11 installations
      - url: https://www.theregister.com/2024/06/26/microsoft_makes_onedrive_avoidance_trickier/
        publisher: The Register
        kind: press
        published: 2024-06-26
        archive: https://web.archive.org/web/20240626185406/https://www.theregister.com/2024/06/26/microsoft_makes_onedrive_avoidance_trickier/
        quote: >-
          This will be particularly annoying when OneDrive's 5GB of free personal storage is
          exhausted, and the user is prompted to set up a subscription to add more capacity.
      - url: https://www.pcworld.com/article/2376883/attention-microsoft-activates-this-feature-in-windows-11-without-asking-you.html
        publisher: PCWorld
        kind: press
        published: 2024-06-25
        archive: https://web.archive.org/web/20240626011309/https://www.pcworld.com/article/2376883/attention-microsoft-activates-this-feature-in-windows-11-without-asking-you.html
        quote: >-
          Previously, you had to explicitly activate automatic folder backups, and Microsoft would
          ping you with recurring notifications to remind you of the feature if it wasn't enabled.
      - url: https://www.neowin.net/news/windows-11-is-now-automatically-enabling-onedrive-folder-backup-without-asking-permission/
        publisher: Neowin
        kind: press
        published: 2024-06-24
        archive: https://web.archive.org/web/20240624212128/https://www.neowin.net/news/windows-11-is-now-automatically-enabling-onedrive-folder-backup-without-asking-permission/
        quote: >-
          will get to their desktops with OneDrive already syncing stuff from folders like Desktop
          Pictures, Documents, Music, and Videos.
    added: 2026-11-19
    updated: 2026-11-19
    sources_checked: 2026-11-19
    status_checked: 2026-11-19

  - id: settings-game-pass-ad
    date: 2024-06-25
    date_kind: announced
    effective: 2024-07-09
    category: ads
    title: Windows 11 adds a Game Pass ad to the Settings home page
    what_changed: >-
      Microsoft said on 25 June 2024 that Windows 11 would add a Game Pass recommendation card to
      the Settings home page. It shows on Home and Pro editions signed in with a Microsoft account,
      if you actively play games on the PC. It came in an optional update first, then in the July
      2024 security update, rolling out gradually.
    user_impact: >-
      Windows 11 Home and Pro users who play games on their PC started seeing an ad for Microsoft's
      Game Pass subscription in the Settings app as it rolled out.
    severity: 1
    status: in-force
    sources:
      - url: https://support.microsoft.com/en-us/topic/june-25-2024-kb5039302-os-builds-22621-3810-and-22631-3810-preview-0ab34e3f-bca9-4a52-a1a4-404bf8162f58
        publisher: Microsoft Support
        kind: primary
        published: 2024-06-25
        archive: https://web.archive.org/web/20240625214406/https://support.microsoft.com/en-us/topic/june-25-2024-kb5039302-os-builds-22621-3810-and-22631-3810-preview-0ab34e3f-bca9-4a52-a1a4-404bf8162f58
        quote: >-
          This update adds a new Game Pass recommendation card on the Settings home page. This home
          page shows on Home and Pro editions when you sign in to Windows using your Microsoft
          account. The card appears if you actively play games on your PC.
      - url: https://support.microsoft.com/en-us/topic/july-9-2024-kb5040442-os-builds-22621-3880-and-22631-3880-0864308e-61cc-413b-8194-0294331aba52
