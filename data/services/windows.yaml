  - id: windows-11-pro-account
    date: 2022-09-20
    date_kind: effective
    category: lock-out
    title: Windows 11 Pro needs a Microsoft account and internet to set up for personal use
    what_changed: >-
      From the Windows 11 2022 Update on 20 September 2022, Windows 11 Pro set up for personal use
      needed internet and a Microsoft account, as Home already did. Windows Central
      reported that setup no longer offered the "I don't have internet" option that let you carry on
      with a local account.
    before: A local account at setup
