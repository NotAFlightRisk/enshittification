  - id: windows-10-new-pc-ads
    date: 2024-11-20
    date_kind: reported
    category: ads
    title: Windows 10 shows full-screen prompts to buy a new Windows 11 PC
    what_changed: >-
      The Verge reported on 20 November 2024 that Windows 10 was showing full-screen prompts telling
      people to buy a new Windows 11 PC. They said to "level up to the new Copilot Plus PCs", and
      the link went to a promotional site with links to new PCs. Microsoft had used similar
      prompts earlier in 2024 to warn about the end of Windows 10 support.
    user_impact: >-
      Some Windows 10 users had their whole screen taken over by an ad for new Windows 11 PCs.
    severity: 1
    status: in-force
    sources:
      - url: https://www.theverge.com/2024/11/20/24301768/microsoft-windows-10-upgrade-prompt-copilot-plus-pcs
        publisher: The Verge
        kind: press
        published: 2024-11-20
        archive: https://web.archive.org/web/20241120210347/https://www.theverge.com/2024/11/20/24301768/microsoft-windows-10-upgrade-prompt-copilot-plus-pcs
        quote: >-
          Earlier this year, Microsoft started using fullscreen prompts to warn Windows 10 users
          about the support cutoff, and now it's using similar prompts to try and tempt people to
          buy a new Windows 11 PC instead.
      - url: https://www.theverge.com/2024/11/20/24301768/microsoft-windows-10-upgrade-prompt-copilot-plus-pcs
        publisher: The Verge
        kind: press
        published: 2024-11-20
        archive: https://web.archive.org/web/20241120210347/https://www.theverge.com/2024/11/20/24301768/microsoft-windows-10-upgrade-prompt-copilot-plus-pcs
        quote: >-
          Like the prompts earlier this year, the read more link goes to a promotional site that
          includes links to new Windows 11 PCs.
      - url: https://www.pcworld.com/article/2528510/windows-10-gets-fullscreen-ads-that-say-buy-a-new-pc-already.html
        publisher: PCWorld
