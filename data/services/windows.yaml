  - id: edgedeflector-blocked
    date: 2021-11-22
    date_kind: effective
    category: lock-out
    title: Windows 11 stops apps like EdgeDeflector opening its Edge links in other browsers
    what_changed: >-
      An optional Windows 11 update on 22 November 2021 stopped apps like EdgeDeflector opening
      Windows' microsoft-edge: links in another browser. Windows 11 opened Start menu search results
      and the Widgets panel's links in Edge whatever your default browser, and those apps were the
      way round it. In the EEA, Microsoft made Windows search and Widgets use the default browser in
      2025.
    user_impact: >-
      People using EdgeDeflector, which its developer said had 500,000 users, had Start menu search
      and Widgets links open in Edge again.
    company_said: >-
      Microsoft said search from the taskbar is an end-to-end experience that isn't designed to be
      redirected.
    severity: 1
    status: in-force
    related: [windows/cortana-search-edge-only]
    sources:
