  - id: windows-11-home-account
    date: 2021-10-05
    date_kind: effective
    category: lock-out
    title: Windows 11 Home needs a Microsoft account and internet to set up
    question: Does Windows 11 need a Microsoft account?
    what_changed: >-
      Windows 11 came out on 5 October 2021, and its Home edition needed an internet connection and
      a Microsoft account to finish setting up a new PC. On earlier versions of Windows you could
      choose a local account instead, though the option wasn't always easy to find.
    before: A local account at setup
    after: A Microsoft account and internet at setup
    user_impact: >-
      Anyone setting up a new Windows 11 Home PC had to be online and sign in with a Microsoft
      account to finish.
    severity: 2
    status: in-force
    related: [windows/windows-11-pro-account]
    sources:
      - url: https://www.microsoft.com/en-us/windows/windows-11-specifications
        publisher: Microsoft
        kind: primary
        published: 2021-06-24
        archive: https://web.archive.org/web/20210624155416/https://www.microsoft.com/en-us/windows/windows-11-specifications
        quote: >-
          Windows 11 Home edition requires internet connectivity and a Microsoft account to complete
          device setup on first use.
      - url: https://blogs.windows.com/windowsexperience/2021/10/04/windows-11-a-new-era-for-the-pc-begins-today/
        publisher: Microsoft
        kind: primary
        published: 2021-10-04
        archive: https://web.archive.org/web/20211004201814/https://blogs.windows.com/windowsexperience/2021/10/04/windows-11-a-new-era-for-the-pc-begins-today/
        quote: >-
          As the day becomes October 5 in each time zone around the world, availability of Windows 11
          begins through a free upgrade on eligible Windows 10 PCs and on new PCs pre-installed with
          Windows 11
      - url: https://www.windowscentral.com/youll-need-internet-connection-and-microsoft-account-set-windows-11-home
        publisher: Windows Central
        kind: press
        published: 2021-06-25
        archive: https://web.archive.org/web/20210625120247/https://www.windowscentral.com/youll-need-internet-connection-and-microsoft-account-set-windows-11-home
        quote: >-
          On previous versions of Windows, you could choose to use a local account rather than a
          Microsoft account. It wasn't always easy to find that option
      - url: https://www.microsoft.com/en-us/windows/windows-11-specifications
        publisher: Microsoft
        kind: primary
        published: 2026-11-09
        archive: https://web.archive.org/web/20261109174001/https://www.microsoft.com/en-us/windows/windows-11-specifications
        quote: >-
          Windows 11 Pro for personal use and Windows 11 Home require internet connectivity and a
          Microsoft account during initial device setup.
    added: 2026-11-19
