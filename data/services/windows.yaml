changes:
  - id: diagnostic-data-always-on
    date: 2015-07-29
    date_kind: effective
    category: tracking
    title: Windows 10 sends diagnostic data to Microsoft that Home and Pro users can't turn off
    question: Can you turn off telemetry in Windows 10?
    what_changed: >-
      Windows 10 came out on 29 July 2015 sending diagnostic data to Microsoft, which Home and Pro
      users could turn down to Basic but never off. Microsoft's November 2015 guide for IT staff
      offered a lower Security level only on Enterprise, Education and IoT Core, and its current
      guide still only lets Server, Enterprise and Education turn diagnostic data off.
    user_impact: >-
      Windows 10 Home and Pro users could turn diagnostic data down to Basic, which tells Microsoft
      about their device, what's installed on it and whether Windows is working, but had no setting
      to turn it off.
    company_said: >-
      Microsoft said Basic data was vital to the operation of Windows and helped keep Windows and
      apps running properly.
    severity: 2
    status: in-force
    sources:
      - url: https://technet.microsoft.com/en-us/library/mt577208(v=vs.85).aspx
        publisher: Microsoft TechNet
        kind: primary
        published: 2015-11-12
        archive: https://web.archive.org/web/20151117072049/https://technet.microsoft.com/en-us/library/mt577208(v=vs.85).aspx
        quote: >-
          Security (only available on Windows 10 Enterprise, Windows 10 Education, and Windows 10
          IoT Core (IoT Core) editions)
      - url: https://windows.microsoft.com/en-us/windows-10/feedback-diagnostics-privacy-faq
        publisher: Microsoft
        kind: primary
        published: 2015-08-06
        archive: https://web.archive.org/web/20150806073511/https://windows.microsoft.com/en-us/windows-10/feedback-diagnostics-privacy-faq
        quote: >-
          Basic information is data that is vital to the operation of Windows. This data helps keep
          Windows and apps running properly by letting Microsoft know the capabilities of your
          device, what is installed, and whether Windows is operating correctly.
      - url: https://news.microsoft.com/2015/06/01/windows-10-available-as-a-free-upgrade-on-july-29/
        publisher: Microsoft
        kind: primary
        published: 2015-06-01
        archive: https://web.archive.org/web/20150731063036/https://news.microsoft.com/2015/06/01/windows-10-available-as-a-free-upgrade-on-july-29/
        quote: On Monday, Microsoft Corp. announced that Windows 10 will be available July 29 in 190 countries.
      - url: https://learn.microsoft.com/en-us/windows/privacy/configure-windows-diagnostic-data-in-your-organization
        publisher: Microsoft Learn
        kind: primary
        published: 2025-09-11
        archive: https://web.archive.org/web/20261028150527/https://learn.microsoft.com/en-us/windows/privacy/configure-windows-diagnostic-data-in-your-organization
        quote: >-
          When you configure this setting, no Windows diagnostic data is sent from your device. This
          is only available on Windows Server, Windows Enterprise, and Windows Education editions.
    added: 2026-11-19
    updated: 2026-11-19
    sources_checked: 2026-11-19
    status_checked: 2026-11-19

  - id: cortana-search-edge-only
    date: 2016-04-28
    date_kind: announced
    category: lock-out
    title: Windows 10 opens web searches from the Cortana box only in Edge
    question: Why does Windows search open in Edge?
    what_changed: >-
      Microsoft said on 28 April 2016 that Edge would be the only browser to open when you searched
      from the Cortana box on the Windows 10 taskbar. It stopped the browser extensions and other
      tricks people had used to send those searches to Google instead of Bing. Outside the EEA,
      Windows search still opens Edge and Bing whatever your default browser, while in the EEA it
      has used the default browser since 2025.
    user_impact: >-
      People who used another browser or search engine got their Cortana box searches in Edge and
      Bing instead.
    company_said: >-
      Microsoft said the only way it could deliver its personalised, end-to-end search was through
      Cortana, Edge and Bing working together.
    severity: 2
    status: in-force
    related: [windows/edgedeflector-blocked]
    sources:
      - url: https://blogs.windows.com/windowsexperience/2016/04/28/delivering-personalized-search-experiences-in-windows-10-through-cortana/
        publisher: Microsoft
        kind: primary
        published: 2016-04-28
        archive: https://web.archive.org/web/20160430045222/https://blogs.windows.com/windowsexperience/2016/04/28/delivering-personalized-search-experiences-in-windows-10-through-cortana/
        quote: >-
          Starting today, to ensure we can deliver the integrated search experience designed for
          Windows 10, Microsoft Edge will be the only browser that will launch when you search from
          the Cortana box.
      - url: https://blogs.windows.com/windowsexperience/2016/04/28/delivering-personalized-search-experiences-in-windows-10-through-cortana/
        publisher: Microsoft
        kind: primary
        published: 2016-04-28
        archive: https://web.archive.org/web/20160430045222/https://blogs.windows.com/windowsexperience/2016/04/28/delivering-personalized-search-experiences-in-windows-10-through-cortana/
        quote: >-
          The only way we can confidently deliver this personalized, end-to-end search experience is
          through the integration of Cortana, Microsoft Edge and Bing
      - url: https://www.theverge.com/2016/4/28/11532474/windows-10-block-google-search-cortana-bing-edge
        publisher: The Verge
        kind: press
        published: 2016-04-28
        archive: https://web.archive.org/web/20160429003157/https://www.theverge.com/2016/4/28/11532474/windows-10-block-google-search-cortana-bing-edge
        quote: >-
          which used browser extensions or even registry edits to establish Google as the default
          engine for Cortana searches instead of Bing
      - url: https://www.windowscentral.com/microsoft/windows-11/windows-11s-taskbar-search-might-finally-use-google-and-chrome-if-thats-what-you-want
        publisher: Windows Central
        kind: press
        published: 2025-09-29
        archive: https://web.archive.org/web/20250929135836/https://www.windowscentral.com/microsoft/windows-11/windows-11s-taskbar-search-might-finally-use-google-and-chrome-if-thats-what-you-want
        quote: >-
          In non-EEA markets, Windows is set to open Edge and use Bing whenever you type an internet
          search query into the search box, regardless of what browser you have set as default.
      - url: https://blogs.windows.com/windows-insider/2025/06/02/updates-to-windows-for-the-digital-markets-act/
        publisher: Microsoft
        kind: primary
        published: 2025-06-02
        archive: https://web.archive.org/web/20250731005843/https://blogs.windows.com/windows-insider/2025/06/02/updates-to-windows-for-the-digital-markets-act/
        quote: >-
          The Microsoft Bing app, which is a provider of web search experiences in Windows Search,
          now opens web content with the default browser in the EEA.
    added: 2026-11-19
    updated: 2026-11-19
    sources_checked: 2026-11-19
    status_checked: 2026-11-19

  - id: file-explorer-onedrive-ads
    date: 2017-03-09
    date_kind: reported
    category: ads
    title: Windows 10 shows OneDrive ads inside File Explorer
    what_changed: >-
      The Verge reported on 9 March 2017 that Windows 10 was showing OneDrive ads at the top of File
      Explorer's Quick Access screen. The ad showed the service's price and a button to learn more,
      and a week later The Verge said they were encouraging people to pay $6.99 for an Office 365
      subscription.
    user_impact: >-
      Windows 10 users who saw it got a Microsoft subscription ad in File Explorer. It could be
      dismissed, but turning it off for good seemed to mean losing all notifications from file sync
      providers.
    company_said: >-
      Microsoft said the tips were designed to help Windows 10 customers with quick, easy
      information on storage and cloud file management, and that customers could opt out.
    severity: 1
    status: in-force
    sources:
      - url: https://www.theverge.com/2017/3/9/14872464/windows-10-onedrive-ads-inside-file-explorer
        publisher: The Verge
        kind: press
        published: 2017-03-09
        archive: https://web.archive.org/web/20170309225802/https://www.theverge.com/2017/3/9/14872464/windows-10-onedrive-ads-inside-file-explorer
        quote: >-
          But a newer prompt is clearly an ad, with Microsoft displaying the service's price and
          letting people click a button to "learn more" about it.
      - url: https://arstechnica.com/information-technology/2017/03/microsoft-put-gross-ads-in-windows-explorer-and-i-dont-have-the-energy-to-be-angry/
        publisher: Ars Technica
        kind: press
        published: 2017-03-09
        archive: https://web.archive.org/web/20170309231722/https://arstechnica.com/information-technology/2017/03/microsoft-put-gross-ads-in-windows-explorer-and-i-dont-have-the-energy-to-be-angry/
        quote: >-
          The new tips notifications within the File Explorer in Windows 10 were designed to help
          Windows 10 customers by providing quick, easy information to enhance the experience
          relative to storage and cloud file management.
      - url: https://arstechnica.com/information-technology/2017/03/microsoft-put-gross-ads-in-windows-explorer-and-i-dont-have-the-energy-to-be-angry/
        publisher: Ars Technica
        kind: press
        published: 2017-03-09
        archive: https://web.archive.org/web/20170309231722/https://arstechnica.com/information-technology/2017/03/microsoft-put-gross-ads-in-windows-explorer-and-i-dont-have-the-energy-to-be-angry/
        quote: >-
          it seems that you can only do so as collateral damage from killing off all notifications
          from file sync providers
      - url: https://www.theverge.com/2017/3/17/14956540/microsoft-windows-10-ads-taskbar-file-explorer
        publisher: The Verge
        kind: press
        published: 2017-03-17
        archive: https://web.archive.org/web/20170317160655/https://www.theverge.com/2017/3/17/14956540/microsoft-windows-10-ads-taskbar-file-explorer
        quote: >-
          encouraging them to pay $6.99 for an Office 365 subscription
