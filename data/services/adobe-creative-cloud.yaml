  - id: animate-discontinued-2026
    date: 2026-02-02
    date_kind: announced
    category: removed-feature
    title: Adobe says it will discontinue Animate and end access to its files, then backs down
    what_changed: >-
      Adobe said on 2 February 2026 that Animate would be discontinued on 1 March 2026 and no longer
      be available on Adobe.com. Non-enterprise customers would lose the app, support and access to their Animate files
      on 1 March 2027.
    before: Animate in Creative Cloud
    after: App and file access to end on 1 March 2027
    user_impact: >-
      Animate users were told to export their FLA and XFL files to other formats before they lost
      access, until Adobe backed down.
    company_said: >-
      Adobe said new platforms and paradigms had emerged that better serve the needs of users.
    severity: 2
    status: reversed
    reversed:
      date: 2026-02-04
      what: >-
        Adobe said it was not discontinuing or removing access to Animate after all, and put it in
        maintenance mode, with security and bug fixes but no new features.
      sources:
        - url: https://helpx.adobe.com/animate/kb/maintenance-mode.html
          publisher: Adobe Help Center
          kind: primary
          published: 2026-02-04
          archive: https://web.archive.org/web/20260204044527/https://helpx.adobe.com/animate/kb/maintenance-mode.html
          quote: We are not discontinuing or removing access to Adobe Animate.
        - url: https://helpx.adobe.com/animate/kb/maintenance-mode.html
          publisher: Adobe Help Center
          kind: primary
          published: 2026-02-04
          archive: https://web.archive.org/web/20260204044527/https://helpx.adobe.com/animate/kb/maintenance-mode.html
          quote: >-
            Maintenance mode means we will continue to support the application and provide ongoing
            security and bug fixes, but we are no longer adding new features.
    sources:
      - url: https://helpx.adobe.com/animate/kb/end-of-life.html
        publisher: Adobe Help Center
        kind: primary
        published: 2026-02-02
        archive: https://web.archive.org/web/20260202202634/https://helpx.adobe.com/animate/kb/end-of-life.html
        quote: >-
          Adobe Animate will be discontinued effective March 1 , 2026 , and will no longer be
          available on Adobe.com .
      - url: https://helpx.adobe.com/animate/kb/end-of-life.html
        publisher: Adobe Help Center
        kind: primary
        published: 2026-02-02
        archive: https://web.archive.org/web/20260202202634/https://helpx.adobe.com/animate/kb/end-of-life.html
        quote: >-
          For all other customers, technical support, application access, and the ability to
