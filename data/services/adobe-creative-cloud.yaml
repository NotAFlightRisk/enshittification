      - url: https://helpx.adobe.com/animate/kb/end-of-life.html
        publisher: Adobe Help Center
        kind: primary
        published: 2026-02-02
        archive: https://web.archive.org/web/20260202202634/https://helpx.adobe.com/animate/kb/end-of-life.html
