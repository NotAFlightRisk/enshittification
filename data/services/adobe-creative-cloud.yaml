  - id: creative-cloud-pro-price-2025
    date: 2025-05-15
    date_kind: announced
    effective: 2025-06-17
    category: price-rise
    title: Creative Cloud All Apps becomes Creative Cloud Pro and goes to $69.99 a month
    what_changed: >-
      Adobe said on 15 May 2025 that in North America All Apps would be renamed Creative Cloud Pro
      on 17 June 2025, at $69.99 a month from each member's next renewal. Members could switch to a
      new Creative Cloud Standard plan at $54.99 with limited AI features.
    before: $59.99 a month
    after: $69.99 a month
    user_impact: >-
      All Apps members in the US, Canada and Mexico were moved to Pro at the higher price on renewal
      unless they chose to switch to Standard.
    company_said: >-
      Adobe said Pro's price was going up to reflect new benefits like unlimited standard image
      generation and non-Adobe AI models.
    severity: 1
    status: in-force
    regions: [US, CA, MX]
    prices:
      - { plan: all-apps-us, from: 59.99, to: 69.99 }
    sources:
