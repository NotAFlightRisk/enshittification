  - id: generative-credits-2025
    date: 2025-06-17
    date_kind: effective
    category: paywall
    title: Adobe cuts new single-app and Photography plans to 25 AI credits a month, from 500
    what_changed: >-
      From 17 June 2025, people joining Photography 1TB or a Creative Cloud single-app plan got 25
      generative credits a month, down from 500. Adobe's FAQ no longer says paid members who run out
      can keep generating more slowly, it points them to a Firefly plan instead, and PetaPixel
      confirmed standard features can be switched off.
    before: 500 credits a month, then slower generations
    after: 25 credits a month for new subscribers, then a Firefly plan
    user_impact: >-
      Anyone joining a single-app or Photography 1TB plan from 17 June 2025 got 25 credits a month
      instead of 500, and people on those plans who run out can have standard AI features switched
      off unless they buy a Firefly plan.
    company_said: >-
      Adobe said credits reflect the additional cost and value of its generative features.
    severity: 2
    status: in-force
    sources:
      - url: https://helpx.adobe.com/firefly/get-set-up/learn-the-basics/generative-credits-faq.html
        publisher: Adobe Help Center
        kind: primary
        published: 2025-07-01
        archive: https://web.archive.org/web/20250705035453/https://helpx.adobe.com/firefly/get-set-up/learn-the-basics/generative-credits-faq.html
        quote: >-
          Creative Cloud Single App Photoshop, Illustrator, Premiere Pro, InDesign, After Effects
          Audition, Animate, Dreamweaver, XD Photography 1TB Standard 500 25
      - url: https://helpx.adobe.com/firefly/get-set-up/learn-the-basics/generative-credits-faq.html
        publisher: Adobe Help Center
        kind: primary
        published: 2025-07-01
        archive: https://web.archive.org/web/20250705035453/https://helpx.adobe.com/firefly/get-set-up/learn-the-basics/generative-credits-faq.html
        quote: Monthly generative credits Subscribed on or after June 17, 2025
      - url: https://helpx.adobe.com/firefly/get-set-up/learn-the-basics/generative-credits-faq.html
        publisher: Adobe Help Center
        kind: primary
        published: 2025-07-01
        archive: https://web.archive.org/web/20250705035453/https://helpx.adobe.com/firefly/get-set-up/learn-the-basics/generative-credits-faq.html
        quote: >-
          Paid Creative Cloud plan users may purchase a Firefly plan for additional credits to use
          on premium generative features . Firefly plans will also unlock unlimited access to
          standard generative features.
      - url: https://helpx.adobe.com/firefly/get-set-up/learn-the-basics/generative-credits-faq.html
        publisher: Adobe Help Center
        kind: primary
        published: 2025-07-01
        archive: https://web.archive.org/web/20250705035453/https://helpx.adobe.com/firefly/get-set-up/learn-the-basics/generative-credits-faq.html
        quote: >-
          Generative credits provide a way to reflect the additional cost and value of our
          generative features
      - url: https://helpx.adobe.com/firefly/using/generative-credits-faq.html
        publisher: Adobe Help Center
        kind: primary
        published: 2024-08-30
        archive: https://web.archive.org/web/20240906210826/https://helpx.adobe.com/firefly/using/generative-credits-faq.html
        quote: >-
          Creative Cloud and Adobe Stock paid users can keep taking generative AI actions but using
          generative AI features to create vector graphics or standard-resolution images
      - url: https://petapixel.com/2025/06/24/adobe-is-now-tracking-generative-credit-use-what-you-need-to-know/
        publisher: PetaPixel
        kind: press
        published: 2025-06-24
        archive: https://web.archive.org/web/20250718150541/https://petapixel.com/2025/06/24/adobe-is-now-tracking-generative-credit-use-what-you-need-to-know/
        quote: >-
          These plans offer 500 monthly generative credits for users who subscribed before June 17,
