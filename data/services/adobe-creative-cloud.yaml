changes:
  - id: creative-suite-ends-2013
    date: 2013-05-06
    date_kind: announced
    category: removed-feature
    title: Adobe stops making new Creative Suite versions, so new releases need Creative Cloud
    question: When did Adobe go subscription only?
    what_changed: >-
      Adobe said on 6 May 2013 it had no plans for future releases of Creative Suite, so its new
      apps would only come with a Creative Cloud membership. CS6 stayed on sale and supported.
    before: New versions sold outright as Creative Suite
    after: New versions only with a Creative Cloud membership
    user_impact: >-
      Anyone who bought Adobe's apps outright had to subscribe to get new versions, though CS6 kept
      working and stayed on sale.
    company_said: >-
      Adobe said focusing development on Creative Cloud would speed up how fast it could innovate.
    severity: 2
    status: in-force
    sources:
      - url: https://www.adobe.com/aboutadobe/pressroom/pressreleases/201305/050613AdobeAcceleratesShifttotheCloud.html
        publisher: Adobe
        kind: primary
        published: 2013-05-06
        archive: https://web.archive.org/web/20130507031731/https://www.adobe.com/aboutadobe/pressroom/pressreleases/201305/050613AdobeAcceleratesShifttotheCloud.html
        quote: >-
          While Adobe Creative Suite® 6 products will continue to be supported and available for
          purchase, the company has no plans for future releases of Creative Suite or other CS
          products.
      - url: https://www.adobe.com/aboutadobe/pressroom/pressreleases/201305/050613AdobeAcceleratesShifttotheCloud.html
        publisher: Adobe
        kind: primary
        published: 2013-05-06
        archive: https://web.archive.org/web/20130507031731/https://www.adobe.com/aboutadobe/pressroom/pressreleases/201305/050613AdobeAcceleratesShifttotheCloud.html
        quote: >-
          Focusing development on Creative Cloud will not only accelerate the rate at which Adobe
          can innovate but also broaden the type of innovation the company can offer the creative
          community.
    added: 2026-11-20
    updated: 2026-11-20
    sources_checked: 2026-11-20
    status_checked: 2026-11-20

  - id: lightroom-standalone-ends-2017
    date: 2017-10-18
    date_kind: announced
    category: removed-feature
    title: Lightroom 6 is the last Lightroom sold outside Creative Cloud
    what_changed: >-
      Adobe said on 18 October 2017 that Lightroom 6 was the last standalone Lightroom, with no
      Lightroom 7 sold outright. In 2013 it had promised perpetual licences indefinitely.
    before: Lightroom sold outright with a perpetual licence
    after: New Lightroom versions only with a Creative Cloud membership
    user_impact: >-
      Photographers who bought Lightroom outright had to subscribe for new versions, and Lightroom 6
      stopped getting camera support and bug fixes after 2017.
    company_said: >-
      Adobe said customers were overwhelmingly choosing the Creative Cloud Photography plan to get
      Lightroom.
    severity: 2
    status: in-force
    related: [adobe-creative-cloud/creative-suite-ends-2013]
    sources:
      - url: https://blogs.adobe.com/photoshop/2017/10/introducing-lightroom-cc-lightroom-classic-cc-and-more.html
        publisher: Adobe Photoshop Blog
        kind: primary
        published: 2017-10-18
        archive: https://web.archive.org/web/20171018222224/https://blogs.adobe.com/photoshop/2017/10/introducing-lightroom-cc-lightroom-classic-cc-and-more.html
        quote: >-
          Lightroom 6 is the last standalone version of Lightroom that can be purchased outside of
          a Creative Cloud membership. There will not be a Lightroom 7 perpetual offering.
      - url: https://blogs.adobe.com/photoshop/2017/10/introducing-lightroom-cc-lightroom-classic-cc-and-more.html
        publisher: Adobe Photoshop Blog
        kind: primary
        published: 2017-10-18
        archive: https://web.archive.org/web/20171018222224/https://blogs.adobe.com/photoshop/2017/10/introducing-lightroom-cc-lightroom-classic-cc-and-more.html
        quote: >-
          Lightroom 6 will remain for sale for an undetermined amount of time, but will no longer be
          updated with camera support or bug fixes after the end of 2017.
      - url: https://blogs.adobe.com/lightroomjournal/2013/05/lightroom-and-the-creative-cloud.html
        publisher: Lightroom Journal
        kind: primary
        published: 2013-05-06
        archive: https://web.archive.org/web/20130608171215/https://blogs.adobe.com/lightroomjournal/2013/05/lightroom-and-the-creative-cloud.html
        quote: >-
          Future versions of Lightroom will be made available via traditional perpetual licenses
          indefinitely.
      - url: https://blogs.adobe.com/lightroomjournal/2017/10/answering-your-questions-on-lightroom-cc-lightroom-classic-cc-and-more.html
        publisher: Lightroom Journal
        kind: primary
        published: 2017-10-19
        archive: https://web.archive.org/web/20171022045034/https://blogs.adobe.com/lightroomjournal/2017/10/answering-your-questions-on-lightroom-cc-lightroom-classic-cc-and-more.html
        quote: >-
          Customers are overwhelmingly choosing the Creative Cloud Photography plan as the
          preferred way to get access to Lightroom.
    added: 2026-11-20
    updated: 2026-11-20
    sources_checked: 2026-11-20
    status_checked: 2026-11-20

  - id: creative-cloud-price-2018
    date: 2018-04-16
    date_kind: effective
    category: price-rise
    title: Creative Cloud All Apps goes from $49.99 to $52.99 a month in the US, its first rise
    what_changed: >-
      Adobe raised Creative Cloud prices in the US, Canada and Mexico from 16 April 2018. All Apps
      went from $49.99 to $52.99 a month and single apps like Photoshop from $19.99 to $20.99, on the
      annual plan paid monthly.
    before: $49.99 a month
    after: $52.99 a month
    user_impact: >-
      All Apps and single app members in North America paying monthly paid more, new ones from 16
      April and existing ones at the end of their annual term.
    company_said: >-
      Adobe said it hadn't changed prices in North America since Creative Cloud launched more than 5
      years before.
    severity: 1
    status: in-force
    regions: [US, CA, MX]
    prices:
      - { plan: all-apps-us, from: 49.99, to: 52.99 }
      - { plan: photoshop-us, from: 19.99, to: 20.99 }
    sources:
      - url: https://helpx.adobe.com/x-productkb/policy-pricing/subscription-price-increase.html
        publisher: Adobe Help Center
        kind: primary
        published: 2018-03-14
        archive: https://web.archive.org/web/20180314135543/https://helpx.adobe.com/x-productkb/policy-pricing/subscription-price-increase.html
        quote: >-
          Creative Cloud for individuals Single App plans will increase to US$20.99 per month from
          US$19.99 per month, a $1 per month increase. Creative Cloud for individuals All Apps plans
          will increase to US$52.99 per month from US$49.99 per month, a $3 per month increase.
      - url: https://helpx.adobe.com/x-productkb/policy-pricing/subscription-price-increase.html
        publisher: Adobe Help Center
        kind: primary
        published: 2018-03-14
        archive: https://web.archive.org/web/20180314135543/https://helpx.adobe.com/x-productkb/policy-pricing/subscription-price-increase.html
        quote: >-
          Since launching Creative Cloud more than five years ago, we have not changed prices for
          customers in North America (United States, Canada, and Mexico).
      - url: https://helpx.adobe.com/x-productkb/policy-pricing/subscription-price-increase.html
        publisher: Adobe Help Center
        kind: primary
        published: 2018-03-14
        archive: https://web.archive.org/web/20180314135543/https://helpx.adobe.com/x-productkb/policy-pricing/subscription-price-increase.html
        quote: >-
          Pay monthly — the new price goes into effect at the end of your annual term that ends on
          or after April 16, 2018.
    added: 2026-11-20
    updated: 2026-11-20
    sources_checked: 2026-11-20
    status_checked: 2026-11-20

  - id: older-versions-pulled-2019
    date: 2019-05-08
    date_kind: announced
    category: lock-out
    title: Adobe pulls older Creative Cloud app versions and warns of third-party claims
    what_changed: >-
      Adobe said on 8 May 2019 that Creative Cloud members could only download the most recent major
      versions of its apps. Some members still on older versions were then emailed that they were no
      longer licensed to use certain older versions.
    before: Members could download older versions of the apps
    after: Only the most recent major versions to download
    user_impact: >-
      Members on some older versions were told they were no longer licensed to use them, and could
      face infringement claims from third parties if they carried on.
    company_said: >-
      Adobe said focusing on its latest major releases, which most customers already used, would
      let it build the features customers asked for most.
    severity: 2
    status: in-force
    sources:
      - url: https://theblog.adobe.com/changes-to-creative-cloud-download-availability/
        publisher: Adobe Blog
        kind: primary
        published: 2019-05-08
        archive: https://web.archive.org/web/20190510121916/https://theblog.adobe.com/changes-to-creative-cloud-download-availability/
        quote: >-
          Please note that going forward, Creative Cloud customers will only have direct download
          access (from the Creative Cloud Desktop app and Adobe.com) to the two most recent major
          versions of Creative Cloud desktop applications.
      - url: https://theblog.adobe.com/changes-to-creative-cloud-download-availability/
        publisher: Adobe Blog
        kind: primary
        published: 2019-05-08
        archive: https://web.archive.org/web/20190510121916/https://theblog.adobe.com/changes-to-creative-cloud-download-availability/
        quote: >-
          Focusing our efforts on the latest two major releases of Creative Cloud applications,
          which the vast majority of Adobe customers are already using, will further enable us to
          develop the features and functionality most requested by customers
      - url: https://petapixel.com/2019/05/14/adobe-warns-that-using-older-cc-apps-could-get-you-sued/
        publisher: PetaPixel
        kind: press
        published: 2019-05-14
        archive: https://web.archive.org/web/20190514163149/https://petapixel.com/2019/05/14/adobe-warns-that-using-older-cc-apps-could-get-you-sued/
        quote: >-
          For customers who have not yet updated to the latest version of Creative Cloud, please
          note that you are no longer licensed to use certain older versions of the applications or
          deploy packages containing these older versions
      - url: https://petapixel.com/2019/05/14/adobe-warns-that-using-older-cc-apps-could-get-you-sued/
        publisher: PetaPixel
        kind: press
        published: 2019-05-14
        archive: https://web.archive.org/web/20190514163149/https://petapixel.com/2019/05/14/adobe-warns-that-using-older-cc-apps-could-get-you-sued/
        quote: >-
          Should you continue to use or deploy these unauthorized versions, you may be at risk of
          potential claims of infringement by third parties.
    added: 2026-11-20
    updated: 2026-11-20
    sources_checked: 2026-11-20
    status_checked: 2026-11-20

  - id: all-apps-price-2022
    date: 2022-03-22
    date_kind: announced
    effective: 2022-04-27
    category: price-rise
    title: Creative Cloud All Apps goes from $52.99 to $54.99 a month in the US
    what_changed: >-
      Adobe said on 22 March 2022 that All Apps for individuals would go from $52.99 to $54.99 a
      month on the annual plan paid monthly. It applied at renewal or billing dates from 27 April
      2022, month-to-month went from $79.49 to $82.49, and single app plans didn't change.
    before: $52.99 a month
    after: $54.99 a month
    user_impact: >-
      All Apps members paying monthly paid more from their next renewal or billing date on or after
      27 April 2022, while prepaid annual members didn't.
    severity: 1
    status: in-force
    regions: [US]
    prices:
      - { plan: all-apps-us, from: 52.99, to: 54.99 }
    sources:
      - url: https://blog.adobe.com/en/publish/2022/03/22/creative-cloud-offering-price-update
        publisher: Adobe Blog
        kind: primary
        published: 2022-03-22
        archive: https://web.archive.org/web/20220326001001/https://blog.adobe.com/en/publish/2022/03/22/creative-cloud-offering-price-update
        quote: >-
          USD$2.00 increase for the annual billed monthly option Previously USD$52.99, will be
          USD$54.99 per month USD$3.00 increase for the month-to-month option Previously USD$79.49,
          will be USD$82.49 per month
      - url: https://blog.adobe.com/en/publish/2022/03/22/creative-cloud-offering-price-update
        publisher: Adobe Blog
        kind: primary
        published: 2022-03-22
        archive: https://web.archive.org/web/20220326001001/https://blog.adobe.com/en/publish/2022/03/22/creative-cloud-offering-price-update
        quote: >-
          Existing members will see these changes reflected on select plans at your next renewal or
          billing date on or after April 27, 2022.
      - url: https://blog.adobe.com/en/publish/2022/03/22/creative-cloud-offering-price-update
        publisher: Adobe Blog
        kind: primary
        published: 2022-03-22
        archive: https://web.archive.org/web/20220326001001/https://blog.adobe.com/en/publish/2022/03/22/creative-cloud-offering-price-update
        quote: No changes to any Creative Cloud single app plan for individuals
    added: 2026-11-20
    updated: 2026-11-20
    sources_checked: 2026-11-20
    status_checked: 2026-11-20

  - id: pantone-colour-books-2022
    date: 2022-11-01
    date_kind: reported
    category: paywall
    title: Most Pantone colour books leave Photoshop, Illustrator and InDesign for a paid plugin
    what_changed: >-
      Ars Technica reported on 1 November 2022 that Adobe was phasing most Pantone colour books out
      of Photoshop, Illustrator and InDesign. Adobe said that after November 2022 only the Pantone +
      CMYK and Metallic books would remain, and the rest would need a paid Pantone Connect licence.
    before: Pantone colour books included in the apps
    after: Most Pantone colours need a Pantone Connect licence
    user_impact: >-
      Designers who used Pantone colours had to pay Pantone on top of Creative Cloud, and some found
      Pantone colours in old Photoshop files replaced with black.
    company_said: >-
      Adobe said Pantone's licensing with Adobe had changed, so customers would need to buy Pantone
      Connect licences.
    severity: 2
    status: in-force
    sources:
      - url: https://helpx.adobe.com/illustrator/kb/pantone-color-books-illustrator.html
        publisher: Adobe Help Center
        kind: primary
        published: 2022-09-12
        archive: https://web.archive.org/web/20221101185606/https://helpx.adobe.com/illustrator/kb/pantone-color-books-illustrator.html
        quote: >-
          Standardized pre-loaded Color libraries, also known as Pantone Color books, will be
          phased out of Illustrator, InDesign, and Photoshop in software updates released after
          August 16, 2022
      - url: https://helpx.adobe.com/illustrator/kb/pantone-color-books-illustrator.html
        publisher: Adobe Help Center
        kind: primary
        published: 2022-09-12
        archive: https://web.archive.org/web/20221101185606/https://helpx.adobe.com/illustrator/kb/pantone-color-books-illustrator.html
        quote: >-
          Pantone’s licensing with Adobe was adjusted. Due to this change, customers will need to
          purchase Pantone Connect licenses to access Pantone colors in Adobe Creative Cloud
          products.
      - url: https://arstechnica.com/gadgets/2022/11/pantone-wants-15-month-for-the-privilege-of-using-its-colors-in-photoshop/
        publisher: Ars Technica
        kind: press
        published: 2022-11-01
        archive: https://web.archive.org/web/20221101184113/https://arstechnica.com/gadgets/2022/11/pantone-wants-15-month-for-the-privilege-of-using-its-colors-in-photoshop/
        quote: >-
          Some users have already encountered Photoshop error messages informing them of the
          change, and that Pantone colors in old Photoshop files are being replaced with black when
          they're opened in newer versions of the software.
    added: 2026-11-20
    updated: 2026-11-20
    sources_checked: 2026-11-20
    status_checked: 2026-11-20

  - id: creative-cloud-price-2023
    date: 2023-09-13
    date_kind: announced
    effective: 2023-11-01
    category: price-rise
    title: Creative Cloud All Apps goes from $54.99 to $59.99 a month in the US
    what_changed: >-
      Adobe said on 13 September 2023 that All Apps would go from $54.99 to $59.99 a month and
      single apps from $20.99 to $22.99 from 1 November 2023. Single apps include Photoshop, and the
      rise covered the Americas and Europe, on the annual plan paid monthly.
    before: $54.99 a month
    after: $59.99 a month
    user_impact: >-
      All Apps and single app members in the Americas and Europe paid more, while Photography plans
      and student plans stayed the same.
    company_said: >-
      Adobe said the rise reflected the value it had already added and the new costs of generative
      AI content.
    severity: 1
    status: in-force
    regions: [US]
    prices:
      - { plan: all-apps-us, from: 54.99, to: 59.99 }
      - { plan: photoshop-us, from: 20.99, to: 22.99 }
    sources:
      - url: https://blog.adobe.com/en/publish/2023/09/13/ai-creative-cloud-release-pricing-update
        publisher: Adobe Blog
        kind: primary
        published: 2023-09-13
        archive: https://web.archive.org/web/20230913140452/https://blog.adobe.com/en/publish/2023/09/13/ai-creative-cloud-release-pricing-update
        quote: >-
          USD$5 increase for the annual billed monthly option Previously USD$54.99, will be USD$59.99
          per month
      - url: https://blog.adobe.com/en/publish/2023/09/13/ai-creative-cloud-release-pricing-update
        publisher: Adobe Blog
        kind: primary
        published: 2023-09-13
        archive: https://web.archive.org/web/20230913140452/https://blog.adobe.com/en/publish/2023/09/13/ai-creative-cloud-release-pricing-update
        quote: >-
          USD$2 increase for the annual billed monthly option Previously USD$20.99, will be USD$22.99
          per month
      - url: https://blog.adobe.com/en/publish/2023/09/13/ai-creative-cloud-release-pricing-update
        publisher: Adobe Blog
        kind: primary
        published: 2023-09-13
        archive: https://web.archive.org/web/20230913140452/https://blog.adobe.com/en/publish/2023/09/13/ai-creative-cloud-release-pricing-update
        quote: >-
          Starting November 1, 2023, the price of specific Creative Cloud plans will increase in
          North America, Central America, South America and Europe.
      - url: https://blog.adobe.com/en/publish/2023/09/13/ai-creative-cloud-release-pricing-update
        publisher: Adobe Blog
        kind: primary
        published: 2023-09-13
        archive: https://web.archive.org/web/20230913140452/https://blog.adobe.com/en/publish/2023/09/13/ai-creative-cloud-release-pricing-update
        quote: >-
          No changes to Adobe Acrobat plans, Adobe Stock plans, Adobe Substance plans, Creative Cloud
          Photography Plans and Adobe Express plans.
      - url: https://blog.adobe.com/en/publish/2023/09/13/ai-creative-cloud-release-pricing-update
        publisher: Adobe Blog
        kind: primary
        published: 2023-09-13
        archive: https://web.archive.org/web/20230913140452/https://blog.adobe.com/en/publish/2023/09/13/ai-creative-cloud-release-pricing-update
        quote: >-
          To reflect the increased value that we have already delivered to our members and given new
          costs associated with producing generative AI content, today we’re announcing price updates
          for our individual and business offerings.
    added: 2026-11-20
    updated: 2026-11-20
    sources_checked: 2026-11-20
    status_checked: 2026-11-20

  - id: photography-20gb-price-2025
    date: 2024-12-15
    date_kind: announced
    effective: 2025-01-15
    category: price-rise
    title: Photography plan (20GB) goes from $9.99 to $14.99 a month, its first rise
    what_changed: >-
      Adobe said on 15 December 2024 that the 20GB Photography plan would go from $9.99 to $14.99 a
      month at renewal from 15 January 2025. That's the annual plan paid monthly, and the prepaid
      year stayed at $119.88.
    before: $9.99 a month
    after: $14.99 a month
    user_impact: >-
      Existing 20GB Photography members paying monthly paid 50% more unless they switched to paying
      $119.88 a year up front.
    company_said: >-
      Adobe said it hadn't changed the price of its photography plans for more than a decade, and
      the update better reflected the value of the apps.
    severity: 2
    status: in-force
    prices:
      - { plan: photography-20gb-us, from: 9.99, to: 14.99 }
    related: [adobe-creative-cloud/photography-20gb-closed-2025]
    sources:
      - url: https://helpx.adobe.com/creative-cloud/faq/ccpp-20gb.html
        publisher: Adobe Help Center
        kind: primary
        published: 2024-12-15
        archive: https://web.archive.org/web/20241217104102/https://helpx.adobe.com/creative-cloud/faq/ccpp-20gb.html
        quote: >-
          Starting January 15, 2025, the price of the Adobe Creative Cloud Photography plan with 20GB
          storage will increase in all countries. Annual billed monthly: Increase of US$5, from
          US$9.99 to US$14.99 per month Annual prepaid: No increase, the price will remain US$119.88
          per year
      - url: https://blog.adobe.com/en/publish/2024/12/15/all-new-photography-innovations-pricing-updates
        publisher: Adobe Blog
        kind: primary
        published: 2024-12-15
        archive: https://web.archive.org/web/20241216084828/https://blog.adobe.com/en/publish/2024/12/15/all-new-photography-innovations-pricing-updates
        quote: >-
          For more than a decade, we’ve brought photographers hundreds of innovative features in
          Lightroom and Photoshop without changing the price of our photography plans. Today we’re
          announcing an update to these plans to better reflect the value that the apps deliver.
    added: 2026-11-20
    updated: 2026-11-20
    sources_checked: 2026-11-20
