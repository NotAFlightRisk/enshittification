changes:
  - id: dynamic-security-2023
    date: 2023-03-09
    date_kind: reported
    category: lock-out
    title: HP printer owners report updates blocking their third-party ink cartridges
    what_changed: >-
      In March 2023 HP printer owners reported firmware updates blocking the third-party ink
      cartridges with non-HP chips they'd been using. Complaints included the OfficeJet 7740 and
      OfficeJet Pro 6970, and HP's Dynamic Security page says its updates can
      block cartridges with a non-HP chip, including ones that work today.
    before: Some third-party cartridges with non-HP chips worked
    after: Some blocked after firmware updates
    user_impact: >-
      Owners who'd used third-party cartridges for years found them blocked after an update, and
      some said they'd have to buy HP ink instead.
    company_said: >-
      HP said it uses dynamic security to protect the quality of its customer experience, the
      integrity of its printing systems and its intellectual property.
    severity: 3
    status: in-force
    sources:
      - url: https://support.hp.com/us-en/document/ish_7470520-7449625-16
        publisher: HP Support
        kind: primary
        published: 2023-05-24
        archive: https://web.archive.org/web/20230524082309/https://support.hp.com/us-en/document/ish_7470520-7449625-16
        quote: >-
          Updates can improve, enhance, or extend the printer's functionality and features, protect
          against security threats, and serve other purposes, but these updates can also block
          cartridges using a non-HP chip or modified or non-HP circuitry from working in the
          printer, including cartridges that work today.
      - url: https://support.hp.com/us-en/document/ish_7470520-7449625-16
        publisher: HP Support
        kind: primary
        published: 2023-05-24
        archive: https://web.archive.org/web/20230524082309/https://support.hp.com/us-en/document/ish_7470520-7449625-16
        quote: >-
          HP uses dynamic security measures to protect the quality of our customer experience,
          maintain the integrity of our printing systems, and protect our intellectual property.
