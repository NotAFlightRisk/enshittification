changes:
  - id: shutdown
    date: 2017-01-17
    date_kind: effective
    category: removed-feature
    title: Twitter shuts down Vine's social network and turns the app into Vine Camera
    question: When did Vine shut down?
    what_changed: >-
      Twitter shut down Vine's social network on 17 January 2017, turning off sharing, liking,
      commenting and revining. An update turned the iOS and Android app into Vine Camera, which made
      short looping videos to save to the phone or post to Twitter, and the Windows Phone app was
      discontinued. Twitter had announced on 27 October 2016 that it would discontinue the mobile
      app, and in December it said people could download their Vines from the app or the website,
      and that all of them would stay on the vine.co website.
    user_impact: >-
      Vine's users could no longer share, like, comment on or revine videos, and creators could no
      longer post to Vine or share new videos with followers there, though they could download their
      Vines first.
    severity: 4
    status: in-force
