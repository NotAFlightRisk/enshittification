service: bing-search-api
name: Bing Search APIs
company: microsoft
url: https://learn.microsoft.com/en-us/previous-versions/bing/search-apis/

changes:
  - id: apis-retired
    date: 2025-08-11
    date_kind: effective
    category: api-restriction
    title: Microsoft retires the Bing Search APIs and points developers to AI agents
    question: When did the Bing Search API shut down?
    what_changed: >-
      Microsoft retired the public Bing Search APIs on 11 August 2025, having said in May that
      existing instances would be decommissioned completely. It told customers to move to Grounding
      with Bing Search in Azure AI Agents, which feeds web data into answers generated by an LLM.
      DuckDuckGo, which uses Bing's results, said it would keep access.
    before: Bing web, image, news and video search results through an API
    after: Grounding with Bing Search, for Azure AI Agents
    user_impact: >-
      Third-party app developers and smaller rival search engines that used Bing's results lost the
      API on 11 August 2025, though DuckDuckGo said it would keep access.
    severity: 4
    status: in-force
    sources:
      - url: https://learn.microsoft.com/en-us/lifecycle/announcements/bing-search-api-retirement
        publisher: Microsoft Learn
        kind: primary
        published: 2025-05-16
        archive: https://web.archive.org/web/20250521111939/https://learn.microsoft.com/en-us/lifecycle/announcements/bing-search-api-retirement
        quote: >-
          Any existing instances of Bing Search APIs will be decommissioned completely, and the
          product will no longer be available to be used or new customer signup.
      - url: https://learn.microsoft.com/en-us/lifecycle/announcements/bing-search-api-retirement
        publisher: Microsoft Learn
        kind: primary
        published: 2025-05-16
        archive: https://web.archive.org/web/20250521111939/https://learn.microsoft.com/en-us/lifecycle/announcements/bing-search-api-retirement
        quote: >-
          Customers are encouraged to migrate to Grounding with Bing Search as part of Azure AI
          Agents
      - url: https://learn.microsoft.com/en-us/lifecycle/announcements/bing-search-api-retirement
        publisher: Microsoft Learn
        kind: primary
        published: 2025-05-16
        archive: https://web.archive.org/web/20250521111939/https://learn.microsoft.com/en-us/lifecycle/announcements/bing-search-api-retirement
        quote: >-
          Grounding with Bing Search allows Azure AI Agents to incorporate real-time public web data
