    status_checked: 2026-11-20

  - id: works-with-nest-shutdown
    date: 2019-05-07
    date_kind: announced
    effective: 2023-09-29
    category: api-restriction
    title: Google shuts down Works with Nest, which let other apps and devices control Nest
    what_changed: >-
      Google said on 7 May 2019 that it would shut down Works with Nest, and the last connections
      stopped working on 29 September 2023. On 16 May 2019 it let existing connections keep running
      on Nest accounts, but none could be added after 31 August 2019, and moving to a Google account
      cut them off.
    user_impact: >-
      Owners lost the Works with Nest connections they'd set up with other apps and devices,
      including IFTTT applets and the original Nest skill for Alexa, which Google replaced with a
      skill for the Google Home app.
    company_said: >-
      Google said retiring it would unify third-party devices on a single platform and give people
      more control over how their data is shared.
    severity: 4
    status: in-force
    related: [google-nest/revolv-shutdown]
    sources:
      - url: https://blog.google/products/google-nest/helpful-home/
        publisher: The Keyword (Google)
        kind: primary
        published: 2019-05-07
        archive: https://web.archive.org/web/20190513044349/https://blog.google/products/google-nest/helpful-home/
        quote: >-
          we’re winding down the Works with Nest developer program on August 31, 2019, and
          delivering a single consumer and developer experience through the Works with Google
          Assistant program
      - url: https://blog.google/products/google-nest/updates-works-with-nest/
        publisher: The Keyword (Google)
        kind: primary
        published: 2019-05-16
        archive: https://web.archive.org/web/20190516181652/https://blog.google/products/google-nest/updates-works-with-nest/
        quote: >-
          Your existing devices and integrations will continue working with your Nest Account,
          however you won’t have access to new features that will be available with a Google
          Account.
      - url: https://www.googlenestcommunity.com/t5/Blog/An-update-for-our-Nest-Secure-Dropcam-and-Works-with-Nest-Users-and/ba-p/391449
        publisher: Google Nest Community
        kind: primary
        published: 2023-04-07
        archive: https://web.archive.org/web/20230407182457/https://www.googlenestcommunity.com/t5/Blog/An-update-for-our-Nest-Secure-Dropcam-and-Works-with-Nest-Users-and/ba-p/391449
        quote: >-
          we will officially end Works with Nest as of September 29, 2023. Until that date, all
          current Works with Nest connections will remain active.
      - url: https://support.google.com/googlenest/answer/9293712
        publisher: Google Nest Help
        kind: primary
        published: 2023-10-04
        archive: https://web.archive.org/web/20231004144220/https://support.google.com/googlenest/answer/9293712
        quote: >-
          The Google Nest skill for Alexa works with the Google Home app and replaces the WWN skill
          for Alexa, which was turned off on September 29, 2023.
      - url: https://help.ifttt.com/hc/en-us/articles/360022524734-Important-update-about-the-Nest-services
        publisher: IFTTT Help Center
        kind: press
        published: 2022-12-05
        archive: https://web.archive.org/web/20240229032921/https://help.ifttt.com/hc/en-us/articles/360022524734-Important-update-about-the-Nest-services
        quote: >-
          Migrating your Nest account will cause IFTTT and other Works with Nest integrations to be
          disconnected.
    added: 2026-11-20
    updated: 2026-11-20
    sources_checked: 2026-11-20
    status_checked: 2026-11-20

  - id: nest-secure-shutdown
    date: 2023-04-07
    date_kind: announced
    effective: 2024-04-08
    category: bricked
    title: Google cuts Nest Secure alarms off from the Nest app and the internet
    question: When did Nest Secure stop working?
    what_changed: >-
      Google said on 7 April 2023 that it would end Nest Secure on 8 April 2024, after which the
      alarm no longer worked in the Nest app or connected to the internet. Eligible owners were
      offered an ADT Self Setup System (up to $485 value) or $200 to spend on the Google Store.
    user_impact: >-
      Owners lost app control and alarm notifications, with Google recommending they stop using it,
      and Nest x Yale locks that went online through the Nest Guard needed a Nest Connect instead.
    company_said: >-
      Google said it was increasingly challenging to keep updating these products given the early
      hardware and newer, better options, and pointed owners to its partner ADT.
    severity: 5
    status: in-force
    related: [google-nest/dropcam-shutdown]
    sources:
      - url: https://www.googlenestcommunity.com/t5/Blog/An-update-for-our-Nest-Secure-Dropcam-and-Works-with-Nest-Users-and/ba-p/391449
        publisher: Google Nest Community
        kind: primary
        published: 2023-04-07
        archive: https://web.archive.org/web/20230407182457/https://www.googlenestcommunity.com/t5/Blog/An-update-for-our-Nest-Secure-Dropcam-and-Works-with-Nest-Users-and/ba-p/391449
        quote: >-
          To show our appreciation and help provide a smooth transition, we will give users an
          exclusive offer for a Self Setup System from ADT on us (up to $485 value) or $200 to use
          on the Google Store.
      - url: https://support.google.com/googlenest/answer/10191961
        publisher: Google Nest Help
        kind: primary
        published: 2024-04-24
        archive: https://web.archive.org/web/20240424133743/https://support.google.com/googlenest/answer/10191961
        quote: >-
          Your Nest Secure will no longer connect to Cloud services, therefore it will no longer
          work in the Google Nest app and won’t connect to the internet.
      - url: https://www.theverge.com/2023/4/7/23673165/google-nest-dropcam-nest-secure-eol
        publisher: The Verge
        kind: press
        published: 2023-04-07
        archive: https://web.archive.org/web/20230407153422/https://www.theverge.com/2023/4/7/23673165/google-nest-dropcam-nest-secure-eol
        quote: >-
          We will be contacting eligible Nest Secure customers on Friday with an exclusive offer for
