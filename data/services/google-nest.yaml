changes:
  - id: revolv-shutdown
    date: 2016-02
    date_kind: announced
    effective: 2016-06-19
    category: bricked
    title: Nest switches off the $300 Revolv smart home hub
    what_changed: >-
      Nest told Revolv owners in February 2016 that the hub and app would stop working on 15 May,
      then pushed the shutdown back to 19 June 2016. Revolv later offered owners who emailed its
      support team a refund of the hub's purchase price.
    user_impact: Revolv hubs and the app stopped working, and Revolv deleted owners' data.
    company_said: >-
      Revolv's founders said Nest was putting all its energy into Works with Nest and couldn't
      allocate resources to Revolv anymore.
    severity: 5
    status: in-force
    related: [google-nest/works-with-nest-shutdown]
    sources:
      - url: https://revolv.com/
        publisher: Revolv
        kind: primary
        published: 2016-05-19
        archive: https://web.archive.org/web/20160519050051/http://revolv.com/
        quote: As of June 19, 2016, your Revolv hub and app will no longer work.
      - url: https://revolv.com/
        publisher: Revolv
        kind: primary
        published: 2016-06-20
        archive: https://web.archive.org/web/20160620072227/http://revolv.com/
        quote: >-
          Revolv is now closed. The Revolv app and hub don’t work anymore, but we are offering a
          refund for your Revolv hub.
      - url: https://www.theverge.com/2016/4/5/11374358/nest-revolv-smart-home-hub-disable-user-compensation
        publisher: The Verge
        kind: press
        published: 2016-04-05
        archive: https://web.archive.org/web/20160406061804/http://www.theverge.com/2016/4/5/11374358/nest-revolv-smart-home-hub-disable-user-compensation
        quote: >-
          However, Revolv's smart hub and mobile app remained active until an announcement in
          February notified customers that the product would cease functioning entirely starting May
          15th.
