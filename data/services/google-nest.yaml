  - id: aware-price-2023
    date: 2023-09-01
    date_kind: announced
    effective: 2023-11-06
    category: price-rise
    title: Nest Aware goes from $6 to $8 a month, and Nest Aware Plus from $12 to $15
    what_changed: >-
      Google raised US Nest Aware from $6 to $8 a month for new subscribers on 1 September 2023,
      and Nest Aware Plus from $12 to $15. Annual plans went from $60 to $80 and from $120 to $150.
      Existing US subscribers paid it from their first bill on or after 6 November 2023, with
      existing UK and Australian subscriptions going up that autumn too.
    before: $6 a month
    after: $8 a month
    user_impact: >-
      Every US subscriber paid more, apart from people who got Nest Aware through a partner like
      ADT.
    company_said: >-
      Google said subscription prices can change to keep up with market shifts, which can include
      inflation and local tax updates.
    severity: 2
    status: in-force
    regions: [US, GB, AU]
    prices:
      - { plan: aware-us, from: 6, to: 8 }
      - { plan: aware-annual-us, from: 60, to: 80 }
      - { plan: aware-plus-us, from: 12, to: 15 }
      - { plan: aware-plus-annual-us, from: 120, to: 150 }
    sources:
