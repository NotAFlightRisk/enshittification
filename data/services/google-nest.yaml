  - id: hub-max-meetings-end
    date: 2023-09-18
    date_kind: reported
    effective: 2023-09-28
    category: removed-feature
    title: Nest Hub Max stops joining Meet meetings by code or link, and Zoom drops its app
    what_changed: >-
      Google's Nest Hub Max stopped joining Google Meet meetings by code or link from 28 September
      2023, and Zoom ended its Hub Max app on 30 September. Video calling had been pitched as a key
      Hub Max feature, and Google said video calls to friends and family with Meet weren't changing.
    user_impact: >-
      Hub Max owners who joined meetings on it with a Meet code or link, or through Zoom, lost that.
    company_said: >-
      Google said it was prioritising the features people love and exploring generative AI in
      Assistant, so some underutilized features would no longer be supported.
    severity: 1
    status: in-force
    sources:
      - url: https://9to5google.com/2023/09/18/nest-hub-max-google-meet-zoom/
        publisher: 9to5Google
        kind: press
        published: 2023-09-18
        archive: https://web.archive.org/web/20231001180232/https://9to5google.com/2023/09/18/nest-hub-max-google-meet-zoom/
        quote: >-
          people have found that the Google Meet set-up process on the Nest Hub Max ends with the
          following message: “Joining meetings will no longer be available on this device starting
          September 28.”
      - url: https://9to5google.com/2023/09/18/nest-hub-max-google-meet-zoom/
        publisher: 9to5Google
        kind: press
        published: 2023-09-18
        archive: https://web.archive.org/web/20231001180232/https://9to5google.com/2023/09/18/nest-hub-max-google-meet-zoom/
        quote: >-
          As we continue to make Google Assistant even more helpful, we’re prioritizing the features
          people love and exploring new ways to build generative AI capabilities into their Assistant
          experience. As a result, some underutilized features will no longer be supported.
      - url: https://9to5google.com/2023/09/18/nest-hub-max-google-meet-zoom/
        publisher: 9to5Google
        kind: press
        published: 2023-09-18
        archive: https://web.archive.org/web/20231001180232/https://9to5google.com/2023/09/18/nest-hub-max-google-meet-zoom/
        quote: >-
          There is no change to making 1:1 and group video calls to friends, family and businesses
          with Google Meet. What’s changing at the end of September is the support for joining
          meetings via meeting codes and links in Meet.
      - url: https://9to5google.com/2023/09/18/nest-hub-max-google-meet-zoom/
        publisher: 9to5Google
        kind: press
        published: 2023-09-18
        archive: https://web.archive.org/web/20231001180232/https://9to5google.com/2023/09/18/nest-hub-max-google-meet-zoom/
        quote: >-
          Video calling was originally pitched as a key feature of the Nest Hub Max, but Google Meet
          and Zoom are dropping support at the end of September.
      - url: https://support.zoom.us/hc/en-us/articles/17423126359309-Advance-notice-of-end-of-support-for-Google-Nest-Hub-Max
        publisher: Zoom Support
        kind: primary
        published: 2023-07-19
        archive: https://web.archive.org/web/20230918161634/https://support.zoom.us/hc/en-us/articles/17423126359309-Advance-notice-of-end-of-support-for-Google-Nest-Hub-Max
        quote: >-
          All support for Zoom for Google Nest Hub Max will end on September 30th, 2023. The Zoom
          application for these devices will stop functioning, and no further updates will be made
          available.
    added: 2026-11-20
    updated: 2026-11-20
    sources_checked: 2026-11-20
    status_checked: 2026-11-20

  - id: learning-thermostat-app-cutoff
    date: 2025-04-25
    date_kind: announced
    effective: 2025-10-25
    category: removed-feature
    title: Google cuts 1st and 2nd gen Nest Learning Thermostats off from its apps
    question: When did Google end support for 1st and 2nd gen Nest thermostats?
    what_changed: >-
      Google said on 25 April 2025 that 1st and 2nd gen Nest Learning Thermostats would be cut off
      from the Nest and Home apps on 25 October 2025. They still run their schedules on the device,
      but can't be controlled from a phone or with Google Assistant. Google emailed eligible owners
      offers of $130 off a 4th gen model in the US, $160 off in Canada or 50% off a tado° thermostat
      in Europe.
    user_impact: >-
      Owners of the 2011 and 2012 models and the 2014 European one lost app control, notifications,
      Home/Away Assist and third-party assistants, and linked Nest Protects no longer ran the
      emergency shut-off.
    company_said: >-
      Google said it had become increasingly challenging to keep updating them given the early
      hardware.
    severity: 3
    status: in-force
    sources:
      - url: https://www.googlenestcommunity.com/t5/Blog/Support-changes-to-our-earliest-generation-Nest-Learning-Thermostats/ba-p/713068
        publisher: Google Nest Community
        kind: primary
        published: 2025-04-25
        archive: https://web.archive.org/web/20250425181734/https://www.googlenestcommunity.com/t5/Blog/Support-changes-to-our-earliest-generation-Nest-Learning-Thermostats/ba-p/713068
        quote: >-
          You will no longer be able to control them remotely from your phone or with Google
          Assistant, but can still adjust the temperature and modify schedules directly on the
          thermostat.
      - url: https://support.google.com/googlenest/answer/16233096
        publisher: Google Nest Help
        kind: primary
        published: 2025-10-30
        archive: https://web.archive.org/web/20251030024406/https://support.google.com/googlenest/answer/16233096?hl=en
        quote: >-
          Nest Protects will also disconnect from the thermostat and emergency shut off will no
          longer run.
      - url: https://www.theverge.com/news/656332/google-ending-support-nest-thermostats
        publisher: The Verge
        kind: press
        published: 2025-04-25
        archive: https://web.archive.org/web/20250425172136/https://www.theverge.com/news/656332/google-ending-support-nest-thermostats
        quote: >-
          In a clear attempt to ease customer anger, Google is offering a $130 discount on the
          fourth-gen Nest Learning Thermostat in the US, $160 off the same device in Canada, and 50
          percent savings on the Tado Smart Thermostat X in Europe
    added: 2026-11-20
    updated: 2026-11-20
    sources_checked: 2026-11-20
    status_checked: 2026-11-20

