  - id: family-shared-storage
    date: 2026-10-08
    date_kind: effective
    category: removed-feature
    title: Microsoft 365 Family goes from 1TB per person to 2TB shared by up to 6 people
    question: Is Microsoft 365 Family storage shared now?
    what_changed: >-
      From 8 October 2026, new Microsoft 365 Family subscriptions share 2TB of storage between
      everyone on the plan, where each of up to 6 people had their own 1TB. Existing subscriptions
      move over when they renew on or after 2 May 2027.
    before: 1TB each, up to 6TB
    after: 2TB shared
    user_impact: >-
      Families of 3 or more, or 2 people storing over 1TB between them, get less space for the same
      $129.99 a year, with up to a year to get under the limit.
    company_said: >-
      Microsoft said shared storage stops one person running out of space while others have unused
      storage.
    severity: 2
    status: in-force
    sources:
      - url: https://support.microsoft.com/en-us/onedrive/changes-to-microsoft-365-storage
        publisher: Microsoft Support
        kind: primary
        published: 2026-10-08
        archive: https://web.archive.org/web/20261008175837/https://support.microsoft.com/en-us/onedrive/changes-to-microsoft-365-storage
        quote: >-
          New and upgraded subscriptions include shared storage starting October 8, 2026. If you
          already have a subscription before October 8, 2026, your plan moves to shared storage when
          it renews on or after May 2, 2027.
      - url: https://support.microsoft.com/en-us/onedrive/changes-to-microsoft-365-storage
        publisher: Microsoft Support
        kind: primary
        published: 2026-10-08
        archive: https://web.archive.org/web/20261008175837/https://support.microsoft.com/en-us/onedrive/changes-to-microsoft-365-storage
        quote: >-
          Shared storage helps ensure that one person doesn't run out of space while other members
          have unused storage available.
      - url: https://support.microsoft.com/en-us/onedrive/changes-to-microsoft-365-storage
        publisher: Microsoft Support
        kind: primary
        published: 2026-10-08
        archive: https://web.archive.org/web/20261008175837/https://support.microsoft.com/en-us/onedrive/changes-to-microsoft-365-storage
        quote: >-
          If your subscription exceeds the limit, you can continue to access your files for up to one
          year while you manage your storage.
