  - id: copilot-in-apps
    date: 2025-01-16
    date_kind: announced
    category: ai
    title: Copilot goes into Microsoft 365's apps, with no off switch on phones or the web
    question: Can you turn off Copilot in Microsoft 365?
    what_changed: >-
      Microsoft put Copilot into Word, Excel, PowerPoint, Outlook and OneNote for Personal and
      Family subscribers on 16 January 2025, on their next update. At first the only way to turn it
      off was a privacy setting that turns off other features too. Per-app switches came to Windows
      and Mac by March 2025, but Microsoft says you can't turn it off in the iOS, Android or web
      versions of Word, Excel or PowerPoint.
    user_impact: >-
      Every Personal and Family subscriber got Copilot, and anyone using Word, Excel or PowerPoint
      on a phone or the web still has no way to turn it off on its own.
