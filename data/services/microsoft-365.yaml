        publisher: Microsoft
        kind: pricing-page
        published: 2026-10-07
        archive: https://web.archive.org/web/20261007104841/https://www.microsoft.com/en-us/microsoft-365/p/microsoft-365-family/cfq7ttc0k5dm
        quote: Up to 6 TB of cloud storage (1 TB per person)
