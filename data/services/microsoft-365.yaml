  - id: publisher-removed
    date: 2026-10-01
    date_kind: effective
    category: removed-feature
    title: Microsoft takes Publisher out of Microsoft 365
    what_changed: >-
      Microsoft took Publisher out of Microsoft 365 from 1 October 2026, as an update removes it.
      Subscribers can't open or edit their Publisher files in it any more, while people who bought
      a perpetual copy can keep using theirs.
    user_impact: >-
      Subscribers who made things in Publisher lost the app and had to convert their files to
      another format, with no change to the price.
