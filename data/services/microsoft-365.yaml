changes:
  - id: unlimited-onedrive-ends
    date: 2015-11-02
    date_kind: announced
    category: removed-feature
    title: Office 365 Home and Personal lose unlimited OneDrive storage and get 1TB
    question: When did Microsoft end unlimited OneDrive storage?
    what_changed: >-
      Microsoft said on 2 November 2015 that Office 365 Home, Personal and University would get 1TB
      of OneDrive storage, not unlimited. It had started rolling out unlimited storage to them, and
      anyone already over 1TB could keep the extra for at least 12 months, or take a pro-rated
      refund.
    before: Unlimited OneDrive storage
    after: 1TB
    user_impact: >-
      Subscribers got 1TB in place of the unlimited storage Microsoft had started rolling out, and
      the ones already storing more had at least 12 months to move it.
    company_said: >-
      Microsoft said a small number of users had backed up numerous PCs and stored entire movie
      collections and DVR recordings, in some cases over 75TB each.
    severity: 2
    status: in-force
    sources:
      - url: https://blogs.office.com/2015/11/02/onedrive_changes/
        publisher: Microsoft
        kind: primary
        published: 2015-11-02
        archive: https://web.archive.org/web/20170102225532/https://blogs.office.com/2015/11/02/onedrive_changes/
        quote: >-
          We’re no longer planning to offer unlimited storage to Office 365 Home, Personal, or
          University subscribers. Starting now, those subscriptions will include 1 TB of OneDrive
          storage.
      - url: https://blogs.office.com/2015/11/02/onedrive_changes/
        publisher: Microsoft
        kind: primary
        published: 2015-11-02
        archive: https://web.archive.org/web/20170102225532/https://blogs.office.com/2015/11/02/onedrive_changes/
        quote: >-
          If you are an Office 365 consumer subscriber and have stored in excess of 1 TB, you will be
          notified of this change and will be able to keep your increased storage for at least 12
          months.
      - url: https://blogs.office.com/2015/11/02/onedrive_changes/
        publisher: Microsoft
        kind: primary
        published: 2015-11-02
        archive: https://web.archive.org/web/20170102225532/https://blogs.office.com/2015/11/02/onedrive_changes/
        quote: >-
          Since we started to roll out unlimited cloud storage to Office 365 consumer subscribers, a
          small number of users backed up numerous PCs and stored entire movie collections and DVR
          recordings. In some instances, this exceeded 75 TB per user or 14,000 times the average.
    added: 2026-11-19
    updated: 2026-11-19
    sources_checked: 2026-11-19
    status_checked: 2026-11-19

  - id: money-in-excel-ends
    date: 2023-06-30
    date_kind: effective
    category: removed-feature
    title: Microsoft 365 drops Money in Excel, Wolfram data types and partner offers
    what_changed: >-
      Microsoft took Money in Excel out of Microsoft 365 Personal and Family on 30 June 2023, after
      the Wolfram data types in Excel stopped on 11 June. Partner offers for subscribers went too.
      Money in Excel had pulled bank transactions into a workbook, in the US only.
    user_impact: >-
      Subscribers who tracked their money in Excel stopped getting new transactions, and Wolfram
      data types stopped refreshing, with no change to the price.
    company_said: >-
      Microsoft said there were other areas where it could have a greater impact, and that it was
      choosing not to renew the Wolfram partnership for this range of data.
