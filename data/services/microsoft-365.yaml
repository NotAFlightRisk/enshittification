  - id: copilot-price-2025
    date: 2025-01-16
    date_kind: announced
    category: price-rise
    title: Microsoft 365 Personal and Family go up $3 a month in the US, with Copilot added
    question: Why did Microsoft 365 go up in price?
    what_changed: >-
      Microsoft said on 16 January 2025 that Microsoft 365 Personal and Family would cost $3 a month
      more in the US, the first rise since launch, with Copilot added. Personal went from $69.99 to
      $99.99 a year and Family from $99.99 to $129.99. Existing subscribers paid it from their next
      renewal, or for a limited time could switch to a Classic plan without Copilot, offered when
      they went to cancel.
    before: Personal $69.99, Family $99.99 a year
    after: Personal $99.99, Family $129.99 a year
    user_impact: >-
      US subscribers paid 43% more for Personal and 30% more for Family, unless they moved to a
      plan without Copilot.
    company_said: >-
      Microsoft said the rise reflected the benefits it had added over the past 12 years and would
      fund new innovations.
    severity: 2
    status: in-force
    regions: [US]
    prices:
      - { plan: personal-annual-us, from: 69.99, to: 99.99 }
      - { plan: personal-monthly-us, from: 6.99, to: 9.99 }
      - { plan: family-annual-us, from: 99.99, to: 129.99 }
      - { plan: family-monthly-us, from: 9.99, to: 12.99 }
    sources:
      - url: https://www.microsoft.com/en-us/microsoft-365/blog/2025/01/16/copilot-is-now-included-in-microsoft-365-personal-and-family/
        publisher: Microsoft
        kind: primary
        published: 2025-01-16
        archive: https://web.archive.org/web/20250116203624/https://www.microsoft.com/en-us/microsoft-365/blog/2025/01/16/copilot-is-now-included-in-microsoft-365-personal-and-family/
        quote: >-
