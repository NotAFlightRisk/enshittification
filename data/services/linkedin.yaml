  - id: ai-training-default
    date: 2024-09-18
    date_kind: announced
    category: ai
    title: LinkedIn trains generative AI on members' data unless they opt out
    what_changed: >-
      LinkedIn said on 18 September 2024 that it trains generative AI on members' data, with an
      opt-out, except in the European Economic Area and Switzerland. The Verge, citing 404 Media,
      reported that LinkedIn had opted accounts in without asking, and added the setting before it
      updated its privacy policy to say so. By 20 September 2024 it had paused training on UK
      members' data after the Information Commissioner's Office raised concerns.
    user_impact: >-
      Members in most countries were opted in without being asked, and opting out didn't undo
      training already done.
    company_said: >-
      LinkedIn said it was clarifying how it uses members' data to develop its and its affiliates'
      products, including by training generative AI.
    severity: 1
    status: in-force
    related: [linkedin/eu-uk-ai-training]
    sources:
      - url: https://www.linkedin.com/blog/member/trust-and-safety/updates-to-our-terms-of-service-2024
        publisher: LinkedIn
        kind: primary
        published: 2024-09-18
        archive: https://web.archive.org/web/20240918181101/https://www.linkedin.com/blog/member/trust-and-safety/updates-to-our-terms-of-service-2024
        quote: >-
          When it comes to using members’ data for generative AI training, we offer an opt-out
          setting
      - url: https://www.linkedin.com/blog/member/trust-and-safety/updates-to-our-terms-of-service-2024
        publisher: LinkedIn
        kind: primary
        published: 2024-09-18
        archive: https://web.archive.org/web/20240918181101/https://www.linkedin.com/blog/member/trust-and-safety/updates-to-our-terms-of-service-2024
        quote: >-
          At this time, we are not enabling training for generative AI on member data from the
          European Economic Area or Switzerland
      - url: https://www.theverge.com/2024/9/18/24248471/linkedin-ai-training-user-accounts-data-opt-in
        publisher: The Verge
        kind: press
        published: 2024-09-18
        archive: https://web.archive.org/web/20240919052448/https://www.theverge.com/2024/9/18/24248471/linkedin-ai-training-user-accounts-data-opt-in
        quote: >-
          the social network has, without asking, opted accounts into training generative AI models.
          404Media reports that LinkedIn introduced the new privacy setting and opt-out form before
          rolling out an updated privacy policy
      - url: https://www.theverge.com/2024/9/18/24248471/linkedin-ai-training-user-accounts-data-opt-in
        publisher: The Verge
        kind: press
        published: 2024-09-18
        archive: https://web.archive.org/web/20240919052448/https://www.theverge.com/2024/9/18/24248471/linkedin-ai-training-user-accounts-data-opt-in
        quote: >-
          Opting out means that LinkedIn and its affiliates won’t use your personal data or content
          on LinkedIn to train models going forward, but does not affect training that has already
          taken place.
      - url: https://www.linkedin.com/blog/member/trust-and-safety/updates-to-our-terms-of-service-2024
        publisher: LinkedIn
        kind: primary
        published: 2024-09-18
        archive: https://web.archive.org/web/20240918181101/https://www.linkedin.com/blog/member/trust-and-safety/updates-to-our-terms-of-service-2024
        quote: >-
          we have added language to clarify how we use the information you share with us to develop
          the products and services of LinkedIn and its affiliates, including by training AI models
          used for content generation
      - url: https://www.bbc.com/news/articles/cy89x4y1pmgo
        publisher: BBC News
        kind: press
        published: 2024-09-20
        archive: https://web.archive.org/web/20260213215202/https://www.bbc.com/news/articles/cy89x4y1pmgo
        quote: >-
          LinkedIn has suspended the use of UK user data to train its artificial intelligence (AI)
          models after a regulator raised concerns.
      - url: https://www.bbc.com/news/articles/cy89x4y1pmgo
        publisher: BBC News
        kind: press
        published: 2024-09-20
        archive: https://web.archive.org/web/20260213215202/https://www.bbc.com/news/articles/cy89x4y1pmgo
        quote: >-
          quietly saw users around the world opted into their data being used to train its AI models
