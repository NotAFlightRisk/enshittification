  - id: microsoft-ad-data-sharing
    date: 2025-11-03
    date_kind: effective
    category: tracking
    title: LinkedIn starts sharing more member data with Microsoft for ads
    what_changed: >-
      From 3 November 2025, LinkedIn shares more data on members outside the EEA, Switzerland and the
      UK with Microsoft, for personalised ads. It may include profile data, feed activity and ad
      engagement, and members can opt out in their settings.
    user_impact: >-
      Members outside the EEA, Switzerland and the UK had more of their LinkedIn data shared with
      Microsoft for its ads, unless they turned the setting off.
    severity: 1
    status: in-force
    sources:
      - url: https://www.linkedin.com/help/linkedin/answer/a8059228
        publisher: LinkedIn Help
        kind: primary
        published: 2025-09-18
        archive: https://web.archive.org/web/20250918085139/https://www.linkedin.com/help/linkedin/answer/a8059228
        quote: >-
          Starting November 3, 2025, we will share additional data about members in your region with
          our Affiliate Microsoft so that the Microsoft family of companies can show you more
          personalized and relevant ads.
      - url: https://www.linkedin.com/help/linkedin/answer/a8059228
        publisher: LinkedIn Help
        kind: primary
        published: 2025-09-18
        archive: https://web.archive.org/web/20250918085139/https://www.linkedin.com/help/linkedin/answer/a8059228
        quote: >-
          This data may include your LinkedIn profile data, feed activity data, and ad engagement
          data
      - url: https://www.linkedin.com/help/linkedin/answer/a8059228
        publisher: LinkedIn Help
        kind: primary
        published: 2025-09-18
        archive: https://web.archive.org/web/20250918085139/https://www.linkedin.com/help/linkedin/answer/a8059228
        quote: >-
          We are not making any changes to our ad practices in these regions, so there are no new ad
