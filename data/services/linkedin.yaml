changes:
  - id: open-apis-limited
    date: 2015-02-12
    date_kind: announced
    effective: 2015-05-12
    category: api-restriction
    title: LinkedIn shuts most of its APIs to developers who aren't partners
    what_changed: >-
      LinkedIn said on 12 February 2015 that from 12 May its open APIs would only cover members' own
      profiles and sharing posts as a member or company. Every other API needed developers to join
      one of its partnership programs, and when it began rolling out on 12 May 2015, LinkedIn said
      apps that hadn't adjusted would get errors signing in members or renewing access, and might
      miss data.
    user_impact: >-
      Apps built on LinkedIn's other APIs lost access unless LinkedIn made their developers
      partners, which TechCrunch said most small developers likely couldn't.
    company_said: >-
      LinkedIn said many apps built on its open APIs delivered value back to members and LinkedIn,
      but not all had, so it was refocusing on partnership integrations.
    severity: 3
    status: in-force
    sources:
      - url: https://developer.linkedin.com/blog/posts/2015/developer-program-changes
        publisher: LinkedIn Developer Network
        kind: primary
        published: 2015-02-12
        archive: https://web.archive.org/web/20150327015224/https://developer.linkedin.com/blog/posts/2015/developer-program-changes
        quote: >-
          All other APIs will require developers to become a member of one of our partnership
          programs.
      - url: https://developer.linkedin.com/blog/posts/2015/developer-program-changes
        publisher: LinkedIn Developer Network
        kind: primary
        published: 2015-02-12
        archive: https://web.archive.org/web/20150327015224/https://developer.linkedin.com/blog/posts/2015/developer-program-changes
        quote: >-
          Starting on May 12, 2015, we will be limiting the open APIs to only support the following
          uses
      - url: https://developer.linkedin.com/blog/posts/2015/developer-program-changes
        publisher: LinkedIn Developer Network
        kind: primary
        published: 2015-02-12
        archive: https://web.archive.org/web/20150327015224/https://developer.linkedin.com/blog/posts/2015/developer-program-changes
        quote: >-
          While many delivered value back to our members and LinkedIn, not all have. As such, we’ve
          taken steps to refocus the Developer Program from primarily open APIs to partnership
