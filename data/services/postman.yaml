changes:
  - id: scratch-pad-removed
    date: 2023-09-15
    date_kind: effective
    category: lock-out
    title: Postman removes Scratch Pad, its offline mode for collections without an account
    question: When did Postman remove Scratch Pad?
    what_changed: >-
      Postman removed Scratch Pad, its offline mode, with its 15 September 2023 release, after
      announcing it in May 2023. New downloads lost it from 15 May 2023. Its replacement, a
      lightweight API client, keeps its data and request history locally, but collections and
      environments now need a signed-in Postman account and its workspaces.
    before: Local collections and environments, with no account
    after: Collections and environments need a Postman account
    user_impact: >-
      People who used Scratch Pad could still send requests locally, but had to sign in to keep
      using collections and environments, and Postman said migrating to an account was the only way
      to recover their Scratch Pad data.
    company_said: >-
      Postman said keeping two separate architectures, Scratch Pad and workspaces, for the same
      features meant spending 2x-4x the time developing or improving the product.
    severity: 3
    status: in-force
    sources:
      - url: https://blog.postman.com/announcing-new-lightweight-postman-api-client/
        publisher: Postman Blog
        kind: primary
        published: 2023-05-14
        archive: https://web.archive.org/web/20230515000045/https://blog.postman.com/announcing-new-lightweight-postman-api-client/
        quote: >-
          Starting May 15, 2023, Scratch Pad mode will no longer be available in the latest version
          of the Postman app for new downloads.
      - url: https://blog.postman.com/announcing-new-lightweight-postman-api-client/
        publisher: Postman Blog
        kind: primary
        published: 2023-05-14
        archive: https://web.archive.org/web/20230515000045/https://blog.postman.com/announcing-new-lightweight-postman-api-client/
        quote: >-
          For users currently using the Scratch Pad mode, it will continue working in deprecated
          mode until September 15, 2023.
      - url: https://blog.postman.com/announcing-new-lightweight-postman-api-client/
        publisher: Postman Blog
        kind: primary
        published: 2023-05-14
        archive: https://web.archive.org/web/20230929170608/https://blog.postman.com/announcing-new-lightweight-postman-api-client/
        quote: >-
          Scratch Pad is no longer available starting with the September 15, 2023 release.
      - url: https://blog.postman.com/announcing-new-lightweight-postman-api-client/
        publisher: Postman Blog
        kind: primary
        published: 2023-05-14
        archive: https://web.archive.org/web/20230515000045/https://blog.postman.com/announcing-new-lightweight-postman-api-client/
        quote: >-
          So far, we have continued to maintain offline collections through the Scratch Pad and
          collections through cloud-powered workspaces.
      - url: https://blog.postman.com/announcing-new-lightweight-postman-api-client/
        publisher: Postman Blog
        kind: primary
        published: 2023-05-14
        archive: https://web.archive.org/web/20230515000045/https://blog.postman.com/announcing-new-lightweight-postman-api-client/
        quote: >-
          However, maintaining two separate architectures—one with the Scratch Pad and the other
          with workspaces—for the same set of features has meant that we spend 2x-4x the amount of
          time in developing or improving the product.
      - url: https://blog.postman.com/announcing-new-lightweight-postman-api-client/
        publisher: Postman Blog
        kind: primary
        published: 2023-05-14
        archive: https://web.archive.org/web/20230515000045/https://blog.postman.com/announcing-new-lightweight-postman-api-client/
        quote: >-
          The API client maintains a history of API calls so you can go back to the requests you use
          often.
      - url: https://blog.postman.com/announcing-new-lightweight-postman-api-client/
        publisher: Postman Blog
        kind: primary
        published: 2023-05-14
        archive: https://web.archive.org/web/20230929170608/https://blog.postman.com/announcing-new-lightweight-postman-api-client/
        quote: >-
          No, environments and collections features require you to be signed in to a Postman
          account.
      - url: https://blog.postman.com/announcing-new-lightweight-postman-api-client/
        publisher: Postman Blog
        kind: primary
        published: 2023-05-14
        archive: https://web.archive.org/web/20230929170608/https://blog.postman.com/announcing-new-lightweight-postman-api-client/
        quote: >-
          Yes, all of your data in the lightweight API client is stored locally and isn’t synced
          online with Postman.
      - url: https://blog.postman.com/announcing-new-lightweight-postman-api-client/
        publisher: Postman Blog
        kind: primary
        published: 2023-05-14
        archive: https://web.archive.org/web/20230929170608/https://blog.postman.com/announcing-new-lightweight-postman-api-client/
        quote: >-
          You must migrate your data to a Postman account in order to recover the data created in
          the Scratch Pad.
      - url: https://blog.postman.com/announcing-new-lightweight-postman-api-client/
        publisher: Postman Blog
        kind: primary
        published: 2023-05-14
        archive: https://web.archive.org/web/20230515000045/https://blog.postman.com/announcing-new-lightweight-postman-api-client/
        quote: >-
          We recommend migrating to workspaces through our migration tool, which enables you to pick
          up right where you left off with your collections, environments, and history.
