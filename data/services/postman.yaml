  - id: free-plan-single-user
    date: 2026-03-01
    date_kind: effective
    category: paywall
    title: Postman limits its Free plan to a single user, ending free team collaboration
    what_changed: >-
      Postman limited its Free plan to a single user on 1 March 2026, after letting free teams of up
      to 3 users collaborate. It announced the new plans on 31 January 2026. Its docs say an
      existing Free team with multiple members is put into a read-only state, where 1 Admin keeps
      editing access and the rest get limited actions in shared workspaces.
    before: Free teams of up to 3 users
    after: Free plan limited to 1 user
    user_impact: >-
      In Free teams with more than 1 member, only 1 Admin kept full access to shared workspaces and
      the rest got limited actions, though everyone kept their personal workspaces. Lifting the
      read-only state meant a trial, a paid plan or cutting the team to 1.
    company_said: >-
      Postman said its existing plans could be challenging to navigate given its growing suite of
      add-ons, and that the Free and new Solo plans are designed for individual developers.
    severity: 3
    status: in-force
    sources:
      - url: https://learning.postman.com/docs/billing/about-plans
        publisher: Postman Docs
        kind: primary
        published: 2026-03
        archive: https://web.archive.org/web/20260305083345/https://learning.postman.com/docs/billing/about-plans
        quote: >-
          Previously, Free plans could create a team and invite up to three users to collaborate.
          With the new plans, Free plans are limited to one user and can’t create a team. To
          collaborate with others, you will need to upgrade to a paid plan.
      - url: https://learning.postman.com/docs/billing/about-plans
        publisher: Postman Docs
        kind: primary
        published: 2026-03
        archive: https://web.archive.org/web/20260305083345/https://learning.postman.com/docs/billing/about-plans
        quote: Postman plan offerings changed in March 2026, and the new plans are now available for purchase.
      - url: https://blog.postman.com/new-capabilities-march-2026/
        publisher: Postman Blog
        kind: primary
        published: 2026-01-31
        archive: https://web.archive.org/web/20260416132413/https://blog.postman.com/new-capabilities-march-2026/
        quote: >-
          On March 1, we’re also updating Postman’s pricing and packaging. We have learned from
          customers that our existing pricing plans can be challenging to navigate given our growing
          suite of add-ons.
      - url: https://blog.postman.com/new-capabilities-march-2026/
        publisher: Postman Blog
        kind: primary
        published: 2026-01-31
        archive: https://web.archive.org/web/20260416132413/https://blog.postman.com/new-capabilities-march-2026/
        quote: >-
          The Free plan and new Solo plan are designed for individual developers and support everyday
          development workflows
      - url: https://learning.postman.com/docs/administration/free-and-solo
        publisher: Postman Docs
        kind: primary
        published: 2026-04
        archive: https://web.archive.org/web/20260419085013/https://learning.postman.com/docs/administration/free-and-solo
        quote: >-
          When a Free plan team has multiple members, the team is put into a read-only state because
          the Free plan only allows one member per team. When a team becomes read-only, Postman
          automatically selects one Admin to keep Editor access.
      - url: https://learning.postman.com/docs/administration/free-and-solo
        publisher: Postman Docs
        kind: primary
        published: 2026-04
        archive: https://web.archive.org/web/20260419085013/https://learning.postman.com/docs/administration/free-and-solo
        quote: >-
          Can access shared workspaces but have limited actions within them.
      - url: https://learning.postman.com/docs/administration/free-and-solo
        publisher: Postman Docs
        kind: primary
        published: 2026-04
        archive: https://web.archive.org/web/20260419085013/https://learning.postman.com/docs/administration/free-and-solo
        quote: Can continue to work in their personal workspaces.
      - url: https://learning.postman.com/docs/administration/free-and-solo
        publisher: Postman Docs
        kind: primary
        published: 2026-04
        archive: https://web.archive.org/web/20260419085013/https://learning.postman.com/docs/administration/free-and-solo
        quote: >-
          Any team member can start a trial or upgrade to a paid plan. Otherwise, the Admin can remove
          other members to reduce the team size to one.
      - url: https://www.postman.com/pricing/
        publisher: Postman
        kind: pricing-page
        published: 2026-01-11
        archive: https://web.archive.org/web/20260111144836/https://www.postman.com/pricing/
        quote: For individuals and small teams building and testing APIs $0 Get Started
      - url: https://www.postman.com/pricing/
        publisher: Postman
        kind: pricing-page
        published: 2026-01-11
        archive: https://web.archive.org/web/20260111144836/https://www.postman.com/pricing/
        quote: Up to 3 free users
      - url: https://www.postman.com/pricing/
