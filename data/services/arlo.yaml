        publisher: 9to5Google
        kind: press
        published: 2023-01-02
        archive: https://web.archive.org/web/20230102210616/https://9to5google.com/2023/01/02/arlo-end-of-life-policy/
        quote: >-
          The EOL of the Generation 3 (VMC3030) and Pro (VMC4030) cameras means that certain features
