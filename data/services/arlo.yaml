  - id: single-camera-price-2024
    date: 2024-01-31
    date_kind: reported
    category: price-rise
    title: Arlo Secure's single-camera plan goes from $4.99 to $7.99 a month
    what_changed: >-
      Arlo emailed single-camera Arlo Secure subscribers in January 2024 that the plan would go from
      $4.99 to $7.99 a month from their next billing period. The unlimited plan stayed at $12.99, so
      a single camera cost just $5 less than unlimited.
    before: $4.99 a month
    after: $7.99 a month
    user_impact: >-
      Single-camera Arlo Secure subscribers paid more from their next billing period, and new
      customers paid the new price straight away.
    company_said: Arlo cited increasing costs in developing innovative solutions.
    severity: 2
    status: in-force
    regions: [US]
    prices:
      - { plan: secure-single-us, from: 4.99, to: 7.99 }
    related: [arlo/secure-price-2023]
    sources:
