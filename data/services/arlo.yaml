      - url: https://kb.arlo.com/000063015/Arlo-Secure-Plan-Pricing-Update-February-2-2023
        publisher: Arlo Support
        kind: primary
        published: 2023-01-03
        archive: https://web.archive.org/web/20230103221809/https://kb.arlo.com/000063015/Arlo-Secure-Plan-Pricing-Update-February-2-2023
        quote: >-
          If your price is changing, Arlo will send you an email, with details about the price change
