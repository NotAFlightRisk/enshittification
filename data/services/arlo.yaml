  - id: secure-price-2023
    date: 2023-01-03
    date_kind: announced
    effective: 2023-02-02
    category: price-rise
    title: Arlo Secure goes from $9.99 to $12.99 a month, and single camera to $4.99
    what_changed: >-
      Arlo said on 3 January 2023 that US Arlo Secure would go from $9.99 to $12.99 a month on 2
      February 2023, and the single-camera plan from $2.99 to $4.99. Secure Plus went from $14.99 to
      $17.99, each from a subscriber's next billing cycle.
    before: $9.99 a month
    after: $12.99 a month
    user_impact: >-
      US Arlo Secure subscribers whose price changed were told by email at least 30 days before it
      went up, though monthly unlimited subscribers could keep their old price on an annual plan.
    company_said: >-
      Arlo said the rise would help it keep driving innovation and offering new security features
      and enhancements.
    severity: 2
    status: in-force
    regions: [US]
    prices:
      - { plan: secure-unlimited-us, from: 9.99, to: 12.99 }
      - { plan: secure-single-us, from: 2.99, to: 4.99 }
      - { plan: secure-plus-us, from: 14.99, to: 17.99 }
    related: [arlo/single-camera-price-2024]
    sources:
      - url: https://kb.arlo.com/000063015/Arlo-Secure-Plan-Pricing-Update-February-2-2023
        publisher: Arlo Support
        kind: primary
        published: 2023-01-03
        archive: https://web.archive.org/web/20230103221809/https://kb.arlo.com/000063015/Arlo-Secure-Plan-Pricing-Update-February-2-2023
        quote: >-
          On the next billing cycle, on or after February 2, 2023 (US Pacific Standard Time), your
          subscription rate will change.
      - url: https://kb.arlo.com/000063015/Arlo-Secure-Plan-Pricing-Update-February-2-2023
        publisher: Arlo Support
        kind: primary
        published: 2023-01-03
        archive: https://web.archive.org/web/20230103221809/https://kb.arlo.com/000063015/Arlo-Secure-Plan-Pricing-Update-February-2-2023
        quote: >-
          Starting at $4.99/month for a single camera, the new pricing will go into effect on February
          2, 2023.
      - url: https://kb.arlo.com/000063015/Arlo-Secure-Plan-Pricing-Update-February-2-2023
        publisher: Arlo Support
        kind: primary
        published: 2023-01-03
        archive: https://web.archive.org/web/20230103221809/https://kb.arlo.com/000063015/Arlo-Secure-Plan-Pricing-Update-February-2-2023
        quote: >-
          United States USD 12.99 9.99 per month (when paying 119.88 annually) 17.99 14.99 per month
          (when paying 179.88 annually)
      - url: https://kb.arlo.com/000063015/Arlo-Secure-Plan-Pricing-Update-February-2-2023
        publisher: Arlo Support
        kind: primary
        published: 2023-01-03
        archive: https://web.archive.org/web/20230103221809/https://kb.arlo.com/000063015/Arlo-Secure-Plan-Pricing-Update-February-2-2023
        quote: >-
          For customers in the US and Canada, you can keep your current monthly unlimited plan price by
