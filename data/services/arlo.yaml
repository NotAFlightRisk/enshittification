changes:
  - id: end-of-life-policy
    date: 2023-01
    date_kind: announced
    category: paywall
    title: Arlo plans to take free 7-day cloud storage off older cameras at end of life
    what_changed: >-
      Arlo said in January 2023 that older cameras reaching end of life would lose free 7-day cloud
      storage, leaving cloud recording to Arlo Secure. The Wire-Free and Pro
      cameras would reach end of life on 1 April 2023, the Pro 2, Q, Q+, Baby, Security Light and
      Audio Doorbell on 1 January 2024, and the free storage would go from them by 1 January 2024.
    before: Free 7-day cloud storage on older cameras
    after: Cloud storage only with an Arlo Secure subscription, as planned
    user_impact: >-
      Owners of the listed cameras stood to lose free cloud storage, which The Verge called a big
      selling point, unless they paid for Arlo Secure, though they could still live stream and store
      clips locally on a base station.
    company_said: >-
      Arlo said it was migrating its video storage to a new platform that delivers better scalability
      and efficiency.
    severity: 3
    status: reversed
    reversed:
      date: 2023-02
      what: >-
        Arlo's CEO Matthew McRae said in February 2023 that existing customers would keep free video
        storage, and that end-of-life dates for some older cameras would move a further year to 2025.
        Arlo's help page now says free 7-day storage stays even after a camera reaches end of life,
        though motion and audio email notifications and E911 calling went in 2023.
      sources:
        - url: https://www.theverge.com/2023/2/13/23597509/arlo-reverse-eol-policy-free-cloud-storage
          publisher: The Verge
          kind: press
          published: 2023-02-13
          archive: https://web.archive.org/web/20230213154323/https://www.theverge.com/2023/2/13/23597509/arlo-reverse-eol-policy-free-cloud-storage
          quote: >-
            announcing that the company will not remove free storage of videos for existing
            customers
            and that it is extending the EOL dates for older cameras a further year to 2025
        - url: https://kb.arlo.com/000063018/End-of-Life-for-Arlo-Devices-and-Services
          publisher: Arlo Support
          kind: primary
          published: 2025-05-15
          archive: https://web.archive.org/web/20251004104115/https://kb.arlo.com/000063018/End-of-Life-for-Arlo-Devices-and-Services
          quote: >-
            You will continue to have access to free 7-day storage for those applicable devices even
            if they enter the EOL stage.
        - url: https://kb.arlo.com/000063018/End-of-Life-for-Arlo-Devices-and-Services
          publisher: Arlo Support
          kind: primary
          published: 2025-05-15
          archive: https://web.archive.org/web/20251004104115/https://kb.arlo.com/000063018/End-of-Life-for-Arlo-Devices-and-Services
          quote: >-
            The following Arlo hardware devices were moved to EOL on January 1, 2025: Arlo Pro 2
            (VMC4030P)
        - url: https://kb.arlo.com/000063018/End-of-Life-for-Arlo-Devices-and-Services
          publisher: Arlo Support
          kind: primary
          published: 2025-05-15
          archive: https://web.archive.org/web/20251004104115/https://kb.arlo.com/000063018/End-of-Life-for-Arlo-Devices-and-Services
          quote: >-
            The following Arlo services were moved to EOL in 2023: Email Notifications for motion
            and audio detection E911 Emergency Calling
        - url: https://kb.arlo.com/000063018/End-of-Life-for-Arlo-Legacy-Cameras-and-Arlo-Services
          publisher: Arlo Support
          kind: primary
          published: 2024-04-24
          archive: https://web.archive.org/web/20240905134224/https://kb.arlo.com/000063018/End-of-Life-for-Arlo-Legacy-Cameras-and-Arlo-Services
          quote: >-
            The following Arlo hardware devices will be moved to EOL on July 1, 2023: Arlo Wire-Free
            Camera (VMC3030) Arlo Pro Camera (VMC4030)
        - url: https://kb.arlo.com/000063018/End-of-Life-for-Arlo-Legacy-Cameras-and-Arlo-Services
          publisher: Arlo Support
          kind: primary
          published: 2024-04-24
          archive: https://web.archive.org/web/20240905134224/https://kb.arlo.com/000063018/End-of-Life-for-Arlo-Legacy-Cameras-and-Arlo-Services
          quote: >-
            Arlo will provide critical security updates for hardware to one year beyond the
            hardware's EOL date.
    sources:
      - url: https://kb.arlo.com/000063018/Arlo-Legacy-Cameras-End-of-Life
        publisher: Arlo Support
        kind: primary
        published: 2023-01-01
        archive: https://web.archive.org/web/20230101133608/https://kb.arlo.com/000063018/Arlo-Legacy-Cameras-End-of-Life
        quote: >-
