    status_checked: 2026-11-22

  - id: autoplay-video-ads-test
    date: 2025-03-17
    date_kind: reported
    category: ads
    title: Roku tests video ads that play before the home screen
    what_changed: >-
      In March 2025 some Roku users reported video ads playing automatically before they could reach
      the Roku OS home screen. Roku confirmed the ads were expected behaviour but called it a test,
      and didn't say whether it would make them permanent.
    user_impact: >-
      Some people using Roku OS got a video ad that played on its own before the home screen, which
      already showed ads.
    company_said: >-
      Roku said the test was the latest example of it exploring new ways to showcase brands and
      programming.
    severity: 1
    status: test
    sources:
      - url: https://arstechnica.com/gadgets/2025/03/roku-says-unpopular-autoplay-ads-are-just-a-test/
        publisher: Ars Technica
        kind: press
        published: 2025-03-17
        archive: https://web.archive.org/web/20250317193754/https://arstechnica.com/gadgets/2025/03/roku-says-unpopular-autoplay-ads-are-just-a-test/
        quote: >-
          Reports of Roku customers seeing video ads automatically play before they could view the
          OS’ home screen started appearing online this week.
      - url: https://arstechnica.com/gadgets/2025/03/roku-says-unpopular-autoplay-ads-are-just-a-test/
        publisher: Ars Technica
        kind: press
        published: 2025-03-17
        archive: https://web.archive.org/web/20250317193754/https://arstechnica.com/gadgets/2025/03/roku-says-unpopular-autoplay-ads-are-just-a-test/
        quote: >-
          a Roku spokesperson shared a company statement that confirms that the autoplaying ads are
          expected behavior but not a permanent part of Roku OS currently.
    added: 2026-11-22
    updated: 2026-11-22
    sources_checked: 2026-11-22
    status_checked: 2026-11-22
