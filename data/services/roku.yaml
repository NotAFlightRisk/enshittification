changes:
  - id: dispute-terms-lockout
    date: 2024-03-05
    date_kind: reported
    category: lock-out
    title: Roku locks TVs and streaming devices until owners accept new dispute terms
    what_changed: >-
      In March 2024 owners reported Roku TVs and streaming devices showing a pop-up that blocked them
      until they agreed to Roku's new Dispute Resolution Terms. There was no way to disagree on screen, and
      opting out meant posting a letter to Roku's general counsel within 30 days of the terms
      taking effect on February 20.
    after: Devices unusable until you select Agree
    user_impact: >-
      Owners couldn't use devices they'd already bought until they accepted the new terms, and
      anyone who didn't want the updated dispute terms had to opt out by post.
    company_said: >-
      Roku said that like many companies it updates its terms from time to time and takes steps to
      make sure customers are informed of the change.
    severity: 3
    status: in-force
    sources:
      - url: https://arstechnica.com/gadgets/2024/03/disgraceful-messy-tos-update-allegedly-locks-roku-devices-until-users-give-in/
        publisher: Ars Technica
        kind: press
        published: 2024-03-07
        archive: https://web.archive.org/web/20240307202616/https://arstechnica.com/gadgets/2024/03/disgraceful-messy-tos-update-allegedly-locks-roku-devices-until-users-give-in/
        quote: >-
          The pop-up doesn't offer a way to disagree, and users are unable to use their device
          unless they hit agree.
      - url: https://arstechnica.com/gadgets/2024/03/disgraceful-messy-tos-update-allegedly-locks-roku-devices-until-users-give-in/
        publisher: Ars Technica
        kind: press
        published: 2024-03-07
        archive: https://web.archive.org/web/20240307202616/https://arstechnica.com/gadgets/2024/03/disgraceful-messy-tos-update-allegedly-locks-roku-devices-until-users-give-in/
        quote: >-
          Like many companies, Roku updates its terms of service from time to time. When we do, we
          take steps to make sure customers are informed of the change.
      - url: https://techcrunch.com/2024/03/05/roku-disables-tvs-and-streaming-devices-until-users-consent-to-forced-arbitration/
        publisher: TechCrunch
        kind: press
        published: 2024-03-06
        archive: https://web.archive.org/web/20240306005439/https://techcrunch.com/2024/03/05/roku-disables-tvs-and-streaming-devices-until-users-consent-to-forced-arbitration/
        quote: >-
          There was no accessing the device without agreeing to the new terms.
    added: 2026-11-22
