changes:
  - id: free-plans-end
    date: 2022-11-28
    date_kind: effective
    category: paywall
    title: Heroku ends its free dyno, Postgres and Redis plans
    question: When did Heroku end its free tier?
    what_changed: >-
      Heroku ended its free dyno, Postgres and Redis plans on 28 November 2022, after offering them
      for over a decade. It announced it on 25 August 2022. Free dynos were scaled down to 0 and free
      hobby-dev databases deleted unless their owners moved to a paid plan, such as Eco dynos at $5
      for 1,000 hours a month shared across all of an account's Eco dynos. Heroku also said it would delete
      accounts inactive for over a year, with their storage, from 26 October 2022.
    before: Free dynos, Postgres and Redis
    after: Eco dynos at $5 for 1,000 hours a month
    user_impact: >-
      Apps on free dynos were scaled down to 0 unless their owners paid, and free Postgres and Redis
      databases that weren't upgraded were deleted, though Heroku support offered to restore deleted
      Postgres data into a new paid database.
    company_said: >-
      Heroku said its teams were spending an extraordinary amount of effort to manage fraud and
      abuse of the free plans, and it wanted to focus its resources on mission-critical
      capabilities for customers.
    severity: 3
    status: in-force
    sources:
      - url: https://blog.heroku.com/next-chapter
        publisher: Heroku
        kind: primary
        published: 2022-08-25
        archive: https://web.archive.org/web/20220825150040/https://blog.heroku.com/next-chapter
        quote: >-
          In order to focus our resources on delivering mission-critical capabilities for
          customers, we will be phasing out our free plan for Heroku Dynos, free plan for Heroku
          Postgres, and free plan for Heroku Data for Redis®, as well as deleting inactive accounts.
      - url: https://blog.heroku.com/next-chapter
        publisher: Heroku
        kind: primary
        published: 2022-08-25
        archive: https://web.archive.org/web/20220825150040/https://blog.heroku.com/next-chapter
        quote: >-
